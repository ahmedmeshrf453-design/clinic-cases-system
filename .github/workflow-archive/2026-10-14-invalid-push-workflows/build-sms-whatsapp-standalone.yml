PROJECT_B64
          base64 -d "$RUNNER_TEMP/project.b64" > "$RUNNER_TEMP/project.zip"
          unzip -q "$RUNNER_TEMP/project.zip" -d "$RUNNER_TEMP/smsapp"

      - name: Verify locked configuration
        shell: bash
        working-directory: ${{ runner.temp }}/smsapp
        run: |
          set -euo pipefail
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          grep -q 'Vezeeta.com' README.md
          grep -q 'CliniDo' README.md
          grep -q 'ekshef' README.md
          grep -q 'CUORi0rtfVU2QlujljCzEg' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt

      - name: Build installable APK
        shell: bash
        working-directory: ${{ runner.temp }}/smsapp
        run: |
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SMS-WhatsApp-Forwarder-v1.1.apk"
          sha256sum "$GITHUB_WORKSPACE/SMS-WhatsApp-Forwarder-v1.1.apk" > "$GITHUB_WORKSPACE/SMS-WhatsApp-Forwarder-v1.1.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: SMS-WhatsApp-Forwarder-v1.1
          path: |
            SMS-WhatsApp-Forwarder-v1.1.apk
            SMS-WhatsApp-Forwarder-v1.1.sha256
          retention-days: 30
