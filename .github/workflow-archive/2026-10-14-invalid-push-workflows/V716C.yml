      - name: Apply V7.1.6C UI
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/v716c.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v716c.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v716c.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v716c.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v716c.b64"
          python - "$RUNNER_TEMP/v716c.b64" <<'PY'
          import base64,pathlib,sys
          exec(base64.b64decode(pathlib.Path(sys.argv[1]).read_text()).decode("utf-8"))
          PY

      - name: Verify V7.1.6C
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          m=Path('src/main.ts').read_text(encoding='utf-8')
          c=Path('src/style.css').read_text(encoding='utf-8')
          t=json.loads(Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          assert t.get('version')=='7.1.6'
          assert 'EMBEDDED HOLOGRAM ORGANS' in m
          assert 'specialty-home-v716c' in m
          assert 'realistic-hologram-tile' in m and 'realistic-hologram-tile' in c
          for n in ['urology', 'internal', 'ortho', 'surgery', 'eye', 'neuro', 'obgyn', 'ent', 'nutrition', 'vascular', 'audiology', 'labs', 'radiology', 'physio', 'nursing']:
              p=Path('public/home-icons/hologram-real')/(n+'.png')
              assert p.exists() and p.stat().st_size>15000,(n,p.stat().st_size if p.exists() else 0)
          print('V7.1.6C source/assets OK')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Verify bundled icons
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/home-icons/hologram-real/urology.png
          test -f dist/home-icons/hologram-real/internal.png
          test -f dist/home-icons/hologram-real/neuro.png
          test -f dist/home-icons/hologram-real/eye.png
          test -f dist/home-icons/hologram-real/labs.png

      - name: Rust tests
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify installer
        shell: pwsh
        run: |
          $i=Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Where-Object { $_.Name -match "7\.1\.6" } | Select-Object -First 1
          if(-not $i){throw "V7.1.6 installer missing"}
          if($i.Length -lt 80000000){throw "Installer too small"}
          Write-Host "Verified $($i.Name) $($i.Length)"

      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.1.6-Embedded-Hologram-Organs
          path: src-tauri/target/release/bundle/nsis/*7.1.6*-setup.exe
          if-no-files-found: error

      - name: Commit validated V7.1.6C
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/home-icons/hologram-real src/main.ts src/style.css src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "V7.1.6C: embedded hologram organ assets"; fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
