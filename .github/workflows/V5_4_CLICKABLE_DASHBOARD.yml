        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust compile check
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: V5.4 dashboard gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          main = Path("src/main.ts").read_text(encoding="utf-8")
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          for x in [
              'data-dashboard-target="patients"',
              'data-dashboard-target="today"',
              'data-dashboard-target="reports"',
              "openDashboardTarget",
              "مبلغ العيادات",
              "مبلغ الأطباء",
          ]:
              assert x in main, x

          assert "حضر اليوم" not in main
          assert "الحضور والإلغاء والتأجيل" not in main
          assert conf["version"] == "5.4.0"
          print("V5.4 dashboard gate passed")
          PY

      - name: Build V5.4 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          if ($installer.Length -lt 1000000) { throw "Setup EXE is unexpectedly small" }

      - name: Commit validated V5.4 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V5.4: clickable dashboard cards"
            git push
          fi

      - name: Upload V5.4 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V5.4-Clickable-Dashboard
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
