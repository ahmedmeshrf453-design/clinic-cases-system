      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend production build
        shell: bash
        run: npm run build

      - name: Rust compile check
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: V4.9 production gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          main = Path("src/main.ts").read_text(encoding="utf-8")
          lib = Path("src-tauri/src/lib.rs").read_text(encoding="utf-8")
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          for item in [
              "openEditVisitModal",
              "data-delete-visit",
              "renderSettings",
              "health_check",
              "operationalStartHour",
              "appSettings.whatsappNumber",
              "appSettings.phoneNumber",
          ]:
              assert item in main, item

          for item in [
              "fn get_visit",
              "fn update_visit",
              "fn delete_visit",
              "fn get_settings",
              "fn save_settings",
              "fn health_check",
              "get_operational_start_hour",
              "PRAGMA integrity_check",
              "PRAGMA foreign_key_check",
          ]:
              assert item in lib, item

          assert "'11:00'" not in lib
          assert 'windows_subsystem' in Path("src-tauri/src/main.rs").read_text(encoding="utf-8")
          assert conf["app"]["security"]["csp"]
          assert conf["app"]["windows"][0].get("devtools") is False
          assert conf["version"] == "4.9.0"
          print("V4.9 production gate passed")
          PY

      - name: Build V4.9 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          if ($installer.Length -lt 1000000) { throw "Setup EXE is unexpectedly small" }
          Write-Host "Installer:" $installer.FullName
          Write-Host "Size:" $installer.Length

      - name: Commit validated V4.9 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/src/lib.rs src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true

          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V4.9: visit management settings and production checks"
            git push
          fi

      - name: Upload V4.9 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V4.9-Visit-Management-Settings-Installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
