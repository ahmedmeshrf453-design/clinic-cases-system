name: Clinic Cases V7.1.20 Restore Specialty Names
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  build-installer:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Apply targeted label visibility fix
      shell: bash
      run: "set -euo pipefail\npython - <<'PY'\nfrom pathlib import Path\nimport json, re\np=Path('src/style.css')\ns=p.read_text(encoding='utf-8')\nassert '/* ===== V7.1.19 HOLOGRAM\
        \ SPECIALTY ICONS ONLY ===== */' in s, 'Expected hologram icons not installed'\nassert '.specialty-home-v7110 .specialty-card,' in s, 'Expected conflicting fixed card layout\
        \ not found'\nassert 'V7.1.20 - restore specialty names' not in s, 'Fix already applied'\ns += '\\n/* V7.1.20 - restore specialty names below hologram icons (scoped only) */\\\
        n.specialty-home-v7110 .specialty-grid .hologram-specialty-card{\\n  height:auto!important;min-height:184px!important;overflow:visible!important;\\n  display:flex!important;flex-direction:column!important;gap:5px!important;\\\
        n  align-items:center!important;justify-content:center!important;\\n  padding:9px 7px 12px!important;\\n}\\n.specialty-home-v7110 .specialty-grid .hologram-specialty-card .specialty-hologram-icon{\\\
        n  width:100px!important;height:100px!important;min-width:100px!important;min-height:100px!important;\\n  flex:0 0 100px!important;margin:0 auto!important;background:transparent!important;\\\
        n}\\n.specialty-home-v7110 .specialty-grid .hologram-specialty-card .specialty-card-copy{\\n  display:flex!important;flex-direction:column!important;align-items:center!important;\\\
        n  justify-content:center!important;flex:0 0 auto!important;height:auto!important;\\n  min-height:36px!important;max-height:none!important;overflow:visible!important;\\n  width:100%!important;margin:2px\
        \ 0 0!important;\\n}\\n.specialty-home-v7110 .specialty-grid .hologram-specialty-card .specialty-card-copy strong{\\n  display:block!important;visibility:visible!important;opacity:1!important;\\\
        n  position:static!important;color:#173650!important;font-size:12.5px!important;\\n  font-weight:800!important;line-height:1.5!important;\\n  max-width:100%!important;white-space:normal!important;\\\
        n  overflow:visible!important;text-align:center!important;\\n}\\n'\np.write_text(s,encoding='utf-8')\nfor f in ['package.json','src-tauri/tauri.conf.json']:\n p=Path(f); d=json.loads(p.read_text(encoding='utf-8'))\n\
        \ assert d['version']=='7.1.19',(f,d['version'])\n d['version']='7.1.20';p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')\np=Path('package-lock.json');s=p.read_text(encoding='utf-8');s,n=re.subn(r'(\"\
        version\"\\s*:\\s*\")7\\.1\\.19(\")',r'\\g<1>7.1.20\\2',s,count=2)\nassert n==2,(str(p),n)\np.write_text(s,encoding='utf-8')\np=Path('src-tauri/Cargo.toml');s=p.read_text(encoding='utf-8');s,n=re.subn(r'(?m)^version\\\
        s*=\\s*\"7\\.1\\.19\"\\s*$', 'version = \"7.1.20\"',s,count=1)\nassert n==1,(str(p),n)\np.write_text(s,encoding='utf-8')\np=Path('src-tauri/Cargo.lock');s=p.read_text(encoding='utf-8');s,n=re.subn(r'(name\\\
        s*=\\s*\"clinic-cases-system\"\\s*\\nversion\\s*=\\s*\")7\\.1\\.19(\")',r'\\g<1>7.1.20\\2',s,count=1)\nassert n==1,(str(p),n)\np.write_text(s,encoding='utf-8')\nprint('CSS names\
        \ visibility fix applied')\nPY"
    - name: Verify labels and icon preservation
      shell: bash
      run: 'python - <<''PY''

        from pathlib import Path

        import json

        s=Path(''src/style.css'').read_text(encoding=''utf-8'')

        m=Path(''src/main.ts'').read_text(encoding=''utf-8'')

        assert ''V7.1.20 - restore specialty names'' in s

        assert ''.hologram-specialty-card .specialty-card-copy strong'' in s

        assert ''height:auto!important;min-height:184px!important;overflow:visible!important'' in s

        assert ''<strong>${x.label}</strong>'' in m

        assert ''homeSpecialtyIconSrc(x.key)'' in m

        assert json.loads(Path(''package.json'').read_text())[''version'']==''7.1.20''

        print(''PASS: names remain in markup and are visible below icons; original app settings unchanged'')

        PY'
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: dtolnay/rust-toolchain@stable
    - name: Install dependencies
      shell: bash
      run: npm ci
    - name: Frontend build
      shell: bash
      run: npm run build
    - name: Rust tests
      shell: bash
      run: cargo test --manifest-path src-tauri/Cargo.toml
    - name: Windows installer
      shell: bash
      run: "set -euo pipefail\nfor attempt in 1 2 3; do\n if npx tauri build --bundles nsis; then exit 0; fi\n if [ \"$attempt\" -lt 3 ]; then sleep 20; fi\ndone\nexit 1"
    - name: Verify installer
      shell: pwsh
      run: '$i=Get-ChildItem ''src-tauri/target/release/bundle/nsis/*-setup.exe'' | Where-Object { $_.Name -match ''7\.1\.20'' } | Select-Object -First 1

        if(-not $i){throw ''V7.1.20 installer missing''}

        if($i.Length -lt 80000000){throw ''Installer too small''}'
    - uses: actions/upload-artifact@v4
      with:
        name: Clinic-Cases-Windows-V7.1.20-Restore-Specialty-Names
        path: src-tauri/target/release/bundle/nsis/*7.1.20*-setup.exe
        if-no-files-found: error
    - name: Commit validated targeted fix
      shell: bash
      run: 'set -euo pipefail

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add src/style.css package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock

        git commit -m ''V7.1.20: restore specialty names below hologram icons''

        git fetch origin main

        git rebase origin/main

        git push origin HEAD:main'
