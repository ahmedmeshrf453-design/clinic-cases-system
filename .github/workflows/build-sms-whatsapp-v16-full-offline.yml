      - name: Verify full offline lock and existing features
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionCode = 24' app/build.gradle.kts
          grep -q 'versionName = "2.4.0"' app/build.gradle.kts
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml
          ! grep -RqiE 'Firebase|Retrofit|OkHttp|HttpURLConnection|WebView|https?://|chat\.whatsapp\.com' app/src/main/java
          test "$(grep -c 'implementation(' app/build.gradle.kts)" -eq 2
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_SMS' app/src/main/AndroidManifest.xml
          grep -q 'com.whatsapp.w4b' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'getLaunchIntentForPackage("com.whatsapp.w4b")' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'EkshefDoctorMapper.replaceClinicNumber' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q '11:58' README.md
          grep -q 'Offline Lock V2.4' README.md
          grep -q 'android:id="@+id/settingsButton"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/reportsButton"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/todayBookingsButton"' app/src/main/res/layout/activity_main.xml
          test -s app/stable-release.jks

      - name: Build installable APK
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.4-Full-Offline.apk"
          sha256sum "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.4-Full-Offline.apk" > "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.4-Full-Offline.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagz-AlHalat-v2.4-Full-Offline
          path: |
            Hagz-AlHalat-v2.4-Full-Offline.apk
            Hagz-AlHalat-v2.4-Full-Offline.sha256
          retention-days: 30
