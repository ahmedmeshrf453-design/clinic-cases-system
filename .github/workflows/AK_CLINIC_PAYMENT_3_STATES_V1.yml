name: AK Clinic Payment 3 States V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/AK_CLINIC_PAYMENT_3_STATES_V1.yml'
permissions:
  contents: write
concurrency:
  group: ak-clinic-payment-3-states-v1
  cancel-in-progress: false
jobs:
  patch-test-build-release:
    runs-on: windows-latest
    timeout-minutes: 130
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Apply safe atomic-payment update
        shell: bash
        run: |
          cat > ak_payment_patch_v1.py <<'PY'
          from pathlib import Path
          import json, re, subprocess

          ROOT = Path('.')
          MAIN = ROOT / 'src/main.ts'
          LIB = ROOT / 'src-tauri/src/lib.rs'
          CSS = ROOT / 'src/style.css'
          CARGO = ROOT / 'src-tauri/Cargo.toml'
          TAURI = ROOT / 'src-tauri/tauri.conf.json'


          def replace_exact(src, old, new, label, expected=1):
              count = src.count(old)
              if count != expected:
                  raise RuntimeError(f'{label}: expected {expected} matches, got {count}')
              return src.replace(old, new, expected)


          main = MAIN.read_text(encoding='utf-8')
          lib = LIB.read_text(encoding='utf-8')
          css = CSS.read_text(encoding='utf-8')

          if 'AK_CLINIC_PAYMENT_3_STATES_V1' in main and 'AK_CLINIC_PAYMENT_3_STATES_V1' in lib:
              print('Payment workflow is already present; source patch is idempotent.')
          else:
              if 'AK_CLINIC_PAYMENT_3_STATES_V1' in main or 'AK_CLINIC_PAYMENT_3_STATES_V1' in lib:
                  raise RuntimeError('Source patch partially applied; refusing to risk data or duplicate code')

              main_helpers = r'''// AK_CLINIC_PAYMENT_3_STATES_V1 — Payment controls for BOTH new-visit flows.
          function clinicVisitPaymentFieldsHtml() {
            return `<section class="clinic-payment-fields">
              <div class="clinic-payment-heading">💳 حالة دفع الكشف</div>
              <div class="clinic-payment-grid">
                <label>حالة الدفع
                  <select name="paymentStatus">
                    <option value="full" selected>مدفوع بالكامل</option>
                    <option value="partial">دفع جزئي</option>
                    <option value="unpaid">غير مدفوع</option>
                  </select>
                </label>
                <label data-clinic-payment-amount>المبلغ المدفوع
                  <input class="ltr" name="paidAmount" type="number" min="0.01" step="0.01" placeholder="المبلغ المحصل">
                </label>
                <label data-clinic-payment-method>طريقة الدفع
                  <select name="paymentMethod">
                    <option value="نقدي">نقدي</option>
                    <option value="فيزا">فيزا</option>
                    <option value="إنستاباي">إنستاباي</option>
                    <option value="محفظة">محفظة</option>
                    <option value="أخرى">أخرى</option>
                  </select>
                </label>
              </div>
              <p class="clinic-payment-summary" data-clinic-payment-summary>يتم تسجيل التحصيل في الكاشير تلقائيًا عند حفظ الكشف.</p>
            </section>`;
          }

          function bindClinicVisitPaymentFields(form: HTMLFormElement) {
            const fee = form.querySelector<HTMLInputElement>('input[name="fee"]')!;
            const status = form.querySelector<HTMLSelectElement>('select[name="paymentStatus"]')!;
            const paid = form.querySelector<HTMLInputElement>('input[name="paidAmount"]')!;
            const amountWrap = form.querySelector<HTMLElement>('[data-clinic-payment-amount]')!;
            const methodWrap = form.querySelector<HTMLElement>('[data-clinic-payment-method]')!;
            const summary = form.querySelector<HTMLElement>('[data-clinic-payment-summary]')!;
            const refresh = () => {
              const charge = Math.max(0, Number(fee.value) || 0);
              const mode = status.value;
              amountWrap.hidden = mode !== 'partial';
              methodWrap.hidden = mode === 'unpaid' || charge <= 0;
              const amount = mode === 'full' ? charge : (mode === 'partial' ? Math.max(0, Number(paid.value) || 0) : 0);
              const due = Math.max(0, charge - amount);
              summary.textContent = mode === 'full'
                ? `المدفوع عند الحفظ: ${charge.toFixed(2)} ج.م — المتبقي: 0.00 ج.م`
                : mode === 'partial'
                  ? `المدفوع: ${amount.toFixed(2)} ج.م — المتبقي: ${due.toFixed(2)} ج.م`
                  : `غير مدفوع — المتبقي: ${charge.toFixed(2)} ج.م`;
            };
            fee.addEventListener('input', refresh);
            paid.addEventListener('input', refresh);
            status.addEventListener('change', refresh);
            refresh();
          }

          function clinicVisitPaymentPayload(fd: FormData) {
            const paymentStatus = String(fd.get('paymentStatus') || 'full');
            const feeText = String(fd.get('fee') || '').trim();
            const fee = Number(feeText);
            if (!['full', 'partial', 'unpaid'].includes(paymentStatus)) throw new Error('حالة الدفع غير صالحة');
            if (paymentStatus !== 'unpaid' && (!feeText || !Number.isFinite(fee) || fee < 0)) {
              throw new Error('أدخل سعر الكشف لتسجيل حالة الدفع');
            }
            const paidAmount = paymentStatus === 'full' ? feeText :
              (paymentStatus === 'partial' ? String(fd.get('paidAmount') || '').trim() : '0');
            if (paymentStatus === 'partial') {
              const paid = Number(paidAmount);
              if (!paidAmount || !Number.isFinite(paid) || paid <= 0 || paid >= fee) {
                throw new Error('المبلغ المدفوع جزئيًا لازم يكون أكبر من صفر وأقل من سعر الكشف');
              }
            }
            const paymentMethod = paymentStatus === 'unpaid' ? '' : String(fd.get('paymentMethod') || 'نقدي');
            return { paymentStatus, paidAmount, paymentMethod };
          }

          '''
              main = replace_exact(main, 'function openSpecialtyBookingModal(', main_helpers + 'function openSpecialtyBookingModal(', 'frontend helper insertion')

              main = replace_exact(main,
                  '''        <label>مبلغ الطبيب<input name="doctorAmount" class="ltr" type="number" min="0" step="0.01" placeholder="اختياري"></label>
                </div>
                <div class="specialty-booking-help">''',
                  '''        <label>مبلغ الطبيب<input name="doctorAmount" class="ltr" type="number" min="0" step="0.01" placeholder="اختياري"></label>
                  ${clinicVisitPaymentFieldsHtml()}
                </div>
                <div class="specialty-booking-help">''',
                  'specialty payment fields')

              main = replace_exact(main,
                  '''  const form=document.querySelector<HTMLFormElement>('#specialtyBookingForm')!;
            const phoneInput=''',
                  '''  const form=document.querySelector<HTMLFormElement>('#specialtyBookingForm')!;
            bindClinicVisitPaymentFields(form);
            const phoneInput=''', 'specialty field binding')

              main = replace_exact(main,
                  '''        doctorAmount:String(fd.get('doctorAmount')||'').trim(),
                  status:'منتظر',''',
                  '''        doctorAmount:String(fd.get('doctorAmount')||'').trim(),
                  ...paymentInput,
                  status:'منتظر',''', 'specialty payment API')

              main = replace_exact(main,
                  "      const result=await invoke<{id:string,existed:boolean}>('register_patient',{input:{",
                  "      const paymentInput = clinicVisitPaymentPayload(fd);\n      const result=await invoke<{id:string,existed:boolean}>('register_patient',{input:{",
                  'validate payment before registering patient')

              main = replace_exact(main,
                  '''            <label>مبلغ الطبيب
                        <input class="ltr" name="doctorAmount" type="number" min="0" step="0.01" placeholder="يكتب يدويًا">
                      </label>
                      <label>التاريخ''',
                  '''            <label>مبلغ الطبيب
                        <input class="ltr" name="doctorAmount" type="number" min="0" step="0.01" placeholder="يكتب يدويًا">
                      </label>
                      ${clinicVisitPaymentFieldsHtml()}
                      <label>التاريخ''', 'patient visit payment fields')

              main = replace_exact(main,
                  '''  document.querySelector<HTMLFormElement>('#visitForm')!.onsubmit = async e => {
              e.preventDefault();
              const fd = new FormData(e.currentTarget as HTMLFormElement);

              try {
                await invoke('add_visit',''',
                  '''  const visitForm = document.querySelector<HTMLFormElement>('#visitForm')!;
            bindClinicVisitPaymentFields(visitForm);
            visitForm.onsubmit = async e => {
              e.preventDefault();
              const fd = new FormData(visitForm);
              const saveButton = visitForm.querySelector<HTMLButtonElement>('button[type="submit"]')!;
              if (saveButton.disabled) return;
              saveButton.disabled = true;
              try {
                await invoke('add_visit',''', 'patient visit field binding')

              main = replace_exact(main,
                  '''        doctorAmount: String(fd.get('doctorAmount')||'').trim(),
                  status: 'حضر',''',
                  '''        doctorAmount: String(fd.get('doctorAmount')||'').trim(),
                  ...clinicVisitPaymentPayload(fd),
                  status: 'حضر',''', 'patient visit payment API')

              main = replace_exact(main,
                  '''      toast(`تعذر حفظ الزيارة: ${String(err)}`, 'error');
              }
            };
          }


          async function openEditVisitModal''',
                  '''      toast(`تعذر حفظ الزيارة: ${String(err)}`, 'error');
              } finally {
                saveButton.disabled = false;
              }
            };
          }


          async function openEditVisitModal''', 'patient visit double-submit protection')

              lib = replace_exact(lib,
                  '''    specialty: Option<String>,
          }

          #[derive(Debug, Deserialize)]
          #[serde(rename_all = "camelCase")]
          struct VisitStatusInput''',
                  '''    specialty: Option<String>,
              #[serde(default)]
              payment_status: Option<String>,
              #[serde(default)]
              paid_amount: Option<String>,
              #[serde(default)]
              payment_method: Option<String>,
          }

          #[derive(Debug, Deserialize)]
          #[serde(rename_all = "camelCase")]
          struct VisitStatusInput''', 'backend API payment fields')

              helper = r'''// AK_CLINIC_PAYMENT_3_STATES_V1: validated initial payment and atomic cashier insert.
          fn initial_visit_payment(
              fee: &str,
              status: Option<&str>,
              amount: Option<&str>,
              method: Option<&str>,
          ) -> Result<Option<(f64, String)>, String> {
              // Omitted payment fields preserve old API behavior for legacy callers.
              let status = status.unwrap_or("unpaid").trim();
              if !["full", "partial", "unpaid"].contains(&status) {
                  return Err("حالة دفع الكشف غير صالحة".into());
              }
              if status == "unpaid" {
                  if let Some(text) = amount {
                      if !text.trim().is_empty() && parse_lab_money(text, "المدفوع")? > 0.0 {
                          return Err("لا يمكن تسجيل مبلغ مدفوع مع حالة غير مدفوع".into());
                      }
                  }
                  return Ok(None);
              }
              if fee.trim().is_empty() {
                  return Err("سعر الكشف مطلوب عند تسجيل التحصيل".into());
              }
              let charge = parse_lab_money(fee, "سعر الكشف")?;
              let paid = if status == "full" {
                  charge
              } else {
                  parse_lab_money(amount.unwrap_or(""), "المدفوع")?
              };
              if status == "partial" && !(paid > 0.0 && paid + 0.001 < charge) {
                  return Err("المدفوع جزئيًا يجب أن يكون أكبر من صفر وأقل من سعر الكشف".into());
              }
              if status == "full" && charge <= 0.0 {
                  // A free visit is fully settled without a fictitious cash transaction.
                  return Ok(None);
              }
              let method = method.unwrap_or("").trim();
              if !["نقدي", "فيزا", "إنستاباي", "محفظة", "أخرى"].contains(&method) {
                  return Err("طريقة دفع الكشف غير صالحة".into());
              }
              Ok(Some((paid, method.to_string())))
          }

          '''
              lib = replace_exact(lib,
                  '''#[tauri::command]
          fn add_visit(state: State<AppState>, input: AddVisitInput) -> Result<String, String> {''',
                  helper + '''#[tauri::command]
          fn add_visit(state: State<AppState>, input: AddVisitInput) -> Result<String, String> {''',
                  'atomic backend payment insertion helper')

              visit_start = lib.index("fn add_visit(state: State<AppState>, input: AddVisitInput)")
              visit_end = lib.index("#[tauri::command]\nfn get_visit(", visit_start)
              visit_chunk = lib[visit_start:visit_end]

              visit_chunk = replace_exact(visit_chunk,
                  '''    validate_visit_fields(
                  input.visit_type.trim(),
                  input.doctor.trim(),
                  input.fee.trim(),
                  input.status.trim(),
                  input.visit_date.trim(),
                  input.visit_time.trim(),
              )?;

              let mut conn = open_db(&state)?;''',
                  '''    validate_visit_fields(
                  input.visit_type.trim(),
                  input.doctor.trim(),
                  input.fee.trim(),
                  input.status.trim(),
                  input.visit_date.trim(),
                  input.visit_time.trim(),
              )?;
              let initial_payment = initial_visit_payment(
                  &input.fee,
                  input.payment_status.as_deref(),
                  input.paid_amount.as_deref(),
                  input.payment_method.as_deref(),
              )?;

              let mut conn = open_db(&state)?;''', 'payment validation before DB transaction')

              visit_chunk = replace_exact(visit_chunk,
                  '''    ).map_err(|e| e.to_string())?;

              tx.execute(
                  "UPDATE patients SET updated_at=?1 WHERE id=?2",
                  params![now, input.patient_id],
              )''',
                  '''    ).map_err(|e| e.to_string())?;

              // The visit and its initial payment commit together, or neither commits.
              if let Some((paid, method)) = initial_payment {
                  tx.execute(
                      "INSERT INTO cashier_payments(id,patient_id,service_type,service_id,amount,payment_method,notes,created_at)
                       VALUES(?1,?2,'clinic',?3,?4,?5,?6,?7)",
                      params![
                          Uuid::new_v4().to_string(), input.patient_id, visit_id,
                          format!("{:.2}", paid), method,
                          "تحصيل تلقائي عند تسجيل الكشف", now
                      ],
                  ).map_err(|e| e.to_string())?;
              }

              tx.execute(
                  "UPDATE patients SET updated_at=?1 WHERE id=?2",
                  params![now, input.patient_id],
              )''', 'atomic cashier insert')

              lib = lib[:visit_start] + visit_chunk + lib[visit_end:]

              tests = r'''
              #[test]
              fn clinic_initial_payment_all_three_modes_and_rejections() {
                  let full = initial_visit_payment("300", Some("full"), Some("0"), Some("نقدي"))
                      .expect("full payment").expect("payment entry");
                  assert_eq!(full.0, 300.0);
                  assert_eq!(full.1, "نقدي");
                  let partial = initial_visit_payment("300", Some("partial"), Some("125"), Some("فيزا"))
                      .expect("partial payment").expect("payment entry");
                  assert_eq!(partial.0, 125.0);
                  assert!(initial_visit_payment("300", Some("unpaid"), Some("0"), None)
                      .expect("unpaid visit").is_none());
                  assert!(initial_visit_payment("300", None, None, None)
                      .expect("legacy unpaid visit").is_none());
                  assert!(initial_visit_payment("0", Some("full"), None, None)
                      .expect("free visit").is_none());
                  assert!(initial_visit_payment("300", Some("partial"), Some("300"), Some("نقدي")).is_err());
                  assert!(initial_visit_payment("300", Some("partial"), Some("0"), Some("نقدي")).is_err());
                  assert!(initial_visit_payment("300", Some("unpaid"), Some("20"), None).is_err());
                  assert!(initial_visit_payment("", Some("full"), None, Some("نقدي")).is_err());
                  assert!(initial_visit_payment("300", Some("full"), None, Some("غير صالحة")).is_err());
              }

              #[test]
              fn clinic_cashier_payment_records_affect_due_balance() {
                  let path = test_db_path("clinic-three-payment-states");
                  init_db(&path).expect("initialize synthetic database");
                  let mut conn = Connection::open(&path).expect("open db");
                  conn.execute(
                      "INSERT INTO patients(id,full_name,phone,created_at,updated_at)
                       VALUES('p-pay','Patient Payment Test','01010010010','2026-10-14 10:00:00','2026-10-14 10:00:00')",
                      [],
                  ).expect("insert patient");
                  for (id, state, amount, method) in [
                      ("full-v", "full", "300", "نقدي"),
                      ("partial-v", "partial", "125", "فيزا"),
                      ("unpaid-v", "unpaid", "0", ""),
                  ] {
                      let tx = conn.transaction().expect("transaction");
                      tx.execute(
                          "INSERT INTO visits(id,patient_id,visit_date,visit_time,doctor,fee,visit_type,status,booking_source,created_at,updated_at)
                           VALUES(?1,'p-pay','2026-10-14','10:30','طبيب تجريبي','300','كشف جديد','حضر','عادي','2026-10-14 10:30:00','2026-10-14 10:30:00')",
                          params![id],
                      ).expect("insert visit");
                      if let Some((paid, method)) = initial_visit_payment("300", Some(state), Some(amount), Some(method))
                          .expect("compute payment") {
                          tx.execute(
                              "INSERT INTO cashier_payments(id,patient_id,service_type,service_id,amount,payment_method,notes,created_at)
                               VALUES(?1,'p-pay','clinic',?2,?3,?4,'automated test','2026-10-14 10:30:00')",
                              params![Uuid::new_v4().to_string(), id, format!("{:.2}", paid), method],
                          ).expect("insert initial payment");
                      }
                      tx.commit().expect("commit visit and payment");
                  }
                  let rows = cashier_items_for_range(&conn, "2026-10-14", "2026-10-14")
                      .expect("load cashier results");
                  for (id, paid, due) in [("full-v", 300.0, 0.0), ("partial-v", 125.0, 175.0), ("unpaid-v", 0.0, 300.0)] {
                      let row = rows.iter().find(|x| x.service_id == id).expect("visit row");
                      assert!((row.paid - paid).abs() < 0.001);
                      assert!((row.remaining - due).abs() < 0.001);
                  }
                  drop(conn);
                  cleanup(&path);
              }
          '''
              lib = replace_exact(lib,
                  '''#[cfg(test)]
          mod production_tests {
              use super::*;
          ''',
                  '''#[cfg(test)]
          mod production_tests {
              use super::*;
          ''' + tests,
                  'payment regression tests')

              css += '''\n/* AK_CLINIC_PAYMENT_3_STATES_V1 — payment status inside both visit forms. */
          .clinic-payment-fields { grid-column: 1 / -1; padding: 14px; margin: 5px 0; border: 1px solid rgba(29, 101, 146, .25); border-radius: 14px; background: rgba(54, 146, 188, .055); }
          .clinic-payment-heading { font-weight: 800; margin-bottom: 12px; }
          .clinic-payment-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 12px; }
          .clinic-payment-grid label { display: flex; flex-direction: column; gap: 7px; }
          .clinic-payment-grid [hidden] { display: none !important; }
          .clinic-payment-summary { margin: 12px 0 0; font-weight: 650; }
          '''

              MAIN.write_text(main, encoding='utf-8')
              LIB.write_text(lib, encoding='utf-8')
              CSS.write_text(css, encoding='utf-8')
              print('Applied UI payment controls and atomic Rust payment accounting + regression tests.')

          # Give the release a genuinely distinct Windows app version; keep Cargo.lock aligned.
          conf = json.loads(TAURI.read_text(encoding='utf-8'))
          version = conf['version']
          if version == '7.1.38':
              conf['version'] = '7.1.39'
              TAURI.write_text(json.dumps(conf, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              cargo = CARGO.read_text(encoding='utf-8')
              cargo = replace_exact(cargo, 'version = "7.1.38"', 'version = "7.1.39"', 'Cargo version')
              CARGO.write_text(cargo, encoding='utf-8')
              subprocess.run(['cargo', 'update', '--workspace', '--manifest-path', str(CARGO)], check=True)
              print('Updated Windows app version from 7.1.38 to 7.1.39 and synchronized lockfile.')
          elif version == '7.1.39':
              print('Version already 7.1.39.')
          else:
              raise RuntimeError(f'Unexpected version {version}, refusing to bump blindly')

          assert 'AK_CLINIC_PAYMENT_3_STATES_V1' in MAIN.read_text(encoding='utf-8')
          assert 'AK_CLINIC_PAYMENT_3_STATES_V1' in LIB.read_text(encoding='utf-8')
          print('Source patch complete.')
          PY
          python ak_payment_patch_v1.py
          python -m py_compile ak_payment_patch_v1.py
      - name: Verify frontend build, all Rust tests and SQL regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows offline EXE NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -File -Filter '*.exe')
          if ($files.Count -ne 1) { throw "Expected exactly one NSIS installer; found $($files.Count)" }
          Copy-Item -LiteralPath $files[0].FullName -Destination 'Clinic-Cases-Windows-Payment-Fix.exe' -Force
          if ((Get-Item 'Clinic-Cases-Windows-Payment-Fix.exe').Length -lt 50000000) { throw 'Installer unexpectedly small' }
          $hash = (Get-FileHash 'Clinic-Cases-Windows-Payment-Fix.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Clinic-Cases-Windows-Payment-Fix.exe" | Set-Content 'Clinic-Cases-Windows-Payment-Fix.exe.sha256' -Encoding ascii
      - name: Publish tested patch to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/main.ts src/style.css src-tauri/src/lib.rs src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          $changed = @(git diff --cached --name-only)
          if ($changed.Count -gt 0) {
            git commit -m 'Fix clinic visit payment status: full, partial, unpaid with atomic cashier receipts'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $sha = (git rev-parse HEAD).Trim()
          "PATCHED_COMMIT=$sha" >> $env:GITHUB_ENV
          "## Tested payment fix committed" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: $sha" >> $env:GITHUB_STEP_SUMMARY
      - name: Create Windows download in GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v7.1.39-clinic-payments-$env:GITHUB_RUN_ID"
          gh release create $tag 'Clinic-Cases-Windows-Payment-Fix.exe' 'Clinic-Cases-Windows-Payment-Fix.exe.sha256' --target $env:PATCHED_COMMIT --title 'Clinic Cases V7.1.39 - Full / Partial / Unpaid Payments' --notes 'Windows offline installer. Visit booking and patient-visit registration support full (default), partial, and unpaid payments. Cashier receipt is saved in the same SQLite transaction as the visit. Existing payment data is not modified. Regression tests and frontend build passed.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "### Windows EXE (ready to download)" >> $env:GITHUB_STEP_SUMMARY
          "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Clinic-Cases-Windows-Payment-Fix.exe" >> $env:GITHUB_STEP_SUMMARY
          "- Release tag: $tag" >> $env:GITHUB_STEP_SUMMARY
