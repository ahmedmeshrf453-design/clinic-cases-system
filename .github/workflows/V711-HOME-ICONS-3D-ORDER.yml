name: Clinic Cases V7.1.1 Home Icons 3D Order

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V7.1.1 UI patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/v711-home.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v711-home.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v711-home.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v711-home.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v711-home.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v711-home.b64"
          python - "$RUNNER_TEMP/v711-home.b64" <<'PY'
          import base64, pathlib, sys
          exec(base64.b64decode(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')).decode('utf-8'))
          PY

      - name: Verify V7.1.1 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          m=Path('src/main.ts').read_text(encoding='utf-8')
          c=Path('src/style.css').read_text(encoding='utf-8')
          t=Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8')
          assert '7.1.1' in t
          assert 'HOME_SERVICE_ORDER_KEY' in m
          assert 'enableHomeGridDrag' in m
          assert 'clinicCases.home.specialties.v711' in m
          assert 'V7.1.1 • 3D ICON ORDER' in m
          assert '💧' in m and '🧠' in m and '🦵' in m
          assert 'V7.1.1 3D home icon ordering' in c
          print('V7.1.1 source gates passed')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        env:
          RUST_BACKTRACE: '1'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Where-Object { $_.Name -match "7\.1\.1" } | Select-Object -First 1
          if (-not $installer) { throw 'V7.1.1 Setup EXE was not generated' }
          if ($installer.Length -lt 80000000) { throw 'Installer too small' }
          Write-Host "Verified: $($installer.Name) — $($installer.Length) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.1.1-Home-Icons-3D
          path: src-tauri/target/release/bundle/nsis/*7.1.1*-setup.exe
          if-no-files-found: error

      - name: Commit validated V7.1.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m "V7.1.1: 3D home icons and drag order"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
