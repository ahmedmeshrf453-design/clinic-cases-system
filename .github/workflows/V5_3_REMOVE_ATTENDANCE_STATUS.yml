      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust compile check
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: V5.3 gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          main = Path("src/main.ts").read_text(encoding="utf-8")
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          forbidden = [
              'id="todayStatusFilter"',
              'id="reportStatus"',
              'data-visit-status-id',
              'visitStatusOptions',
              'set_visit_status',
              'حالة الزيارة</th>',
              'metrics.attended',
              'metrics.noShow',
              'metrics.cancelled',
              'metrics.postponed',
          ]
          for x in forbidden:
              assert x not in main, x

          assert "status: 'حضر'" in main
          assert "مبلغ العيادات" in main
          assert "مبلغ الطبيب" in main
          assert "مصدر الحجز" in main
          assert conf["version"] == "5.3.0"
          print("V5.3 gate passed")
          PY

      - name: Build V5.3 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          if ($installer.Length -lt 1000000) { throw "Setup EXE is unexpectedly small" }

      - name: Commit validated V5.3 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V5.3: remove attendance status workflow"
            git push
          fi

      - name: Upload V5.3 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V5.3-No-Attendance-Status
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
