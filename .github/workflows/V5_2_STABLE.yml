      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust compile check
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: V5.2 data contract gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          main = Path("src/main.ts").read_text(encoding="utf-8")
          lib = Path("src-tauri/src/lib.rs").read_text(encoding="utf-8")
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          required_main = [
              "clinicAmount: string",
              "doctorAmount: string",
              'name="clinicAmount"',
              'name="doctorAmount"',
              "مبلغ العيادات",
              "مبلغ الطبيب",
              "clinicTotal",
              "doctorTotal",
          ]
          required_lib = [
              "clinic_amount: String",
              "doctor_amount: String",
              "ADD COLUMN clinic_amount",
              "ADD COLUMN doctor_amount",
              "v.clinic_amount,v.doctor_amount",
              "clinic_amount=?9,doctor_amount=?10",
          ]
          for x in required_main:
              assert x in main, x
          for x in required_lib:
              assert x in lib, x
          assert conf["version"] == "5.2.0"
          print("V5.2 data contract gate passed")
          PY

      - name: Build V5.2 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          if ($installer.Length -lt 1000000) { throw "Setup EXE is unexpectedly small" }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          Write-Host "Installer:" $installer.FullName
          Write-Host "Size:" $installer.Length
          Write-Host "SHA256:" $hash.Hash

      - name: Commit validated V5.2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/src/lib.rs src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V5.2: clinic and doctor financial split"
            git push
          fi

      - name: Upload V5.2 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V5.2-STABLE-Doctor-Clinic-Amounts
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
