name: Clinic Cases V7.1 Specialty Home

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V7.1 specialty-first UI
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/v710.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v710.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v710.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v710.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v710.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v710.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v710.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v710.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v710.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v710.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v710.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v710.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v710.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v710.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v710.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v710.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v710.b64"
          python - "$RUNNER_TEMP/v710.b64" <<'PY'
          import base64,pathlib,sys
          exec(base64.b64decode(pathlib.Path(sys.argv[1]).read_text()).decode())
          PY

      - name: Source gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          m=Path("src/main.ts").read_text(encoding="utf-8")
          r=Path("src-tauri/src/lib.rs").read_text(encoding="utf-8")
          c=Path("src/style.css").read_text(encoding="utf-8")
          t=Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8")
          assert '"version": "7.1.0"' in t
          assert "V7.1.0 • SPECIALTY HOME" in m
          for label in ["مسالك بولية وذكورة","باطنة وجهاز هضمي","عظام ومفاصل","جراحة عامة ومناظير","عيون","مخ وأعصاب وعمود فقري","نساء وتوليد","أنف وأذن وحنجرة","تغذية علاجية","أوعية دموية وقدم سكري","سمع واتزان"]:
              assert label in m, label
          assert "renderPhysioServices" in m and "openPatientPhysioPanel" in m
          assert "physioOrders" in m and "kind:'physio'" in m
          assert "visiblePhysio" in m and "todayStatsPhysio" in m
          assert "service_type=?1 AND service_id=?2" in r
          assert "physio" in r[r.find("fn cashier_items_for_range"):r.find("fn finance_source_label")]
          assert "V7.1 specialty-first home" in c
          print("V7.1 source gates passed")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Verify built UI
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q "V7.1.0.*SPECIALTY HOME" dist
          grep -R -q "العلاج الطبيعي" dist
          echo "Built frontend contains specialty home + physiotherapy"

      - name: Rust tests
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify V7.1 installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Where-Object { $_.Name -match "7\.1\.0" } | Select-Object -First 1
          if (-not $installer) { throw "V7.1.0 installer was not generated" }
          if ($installer.Length -lt 80000000) { throw "Installer too small" }
          Write-Host "Verified: $($installer.Name) — $($installer.Length) bytes"

      - name: Upload V7.1 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.1-Specialty-Home
          path: src-tauri/target/release/bundle/nsis/*7.1.0*-setup.exe
          if-no-files-found: error

      - name: Commit validated V7.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/src/lib.rs src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No V7.1 changes to commit"
          else
            git commit -m "V7.1: specialty-first home and physiotherapy"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
