      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust compile check
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: V6.0 compact UI gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          css = Path("src/style.css").read_text(encoding="utf-8")
          main = Path("src/main.ts").read_text(encoding="utf-8")
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          for term in [
              "/* V6.0 compact labs window */",
              ".lab-catalog-modal",
              "max-width:900px",
              "min-height:52px",
              "min-width:83px",
              "min-width:64px",
              "max-height:112px",
          ]:
              assert term in css, term

          for term in [
              "data-add-lab",
              "data-delete-patient-lab",
              "list_patient_labs",
              "add_patient_lab",
              "delete_patient_lab",
          ]:
              assert term in main, term

          assert "version: '6.0.0'" in main
          assert conf["version"] == "6.0.0"
          print("V6.0 compact UI gate passed")
          PY

      - name: Build V6.0 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          if ($installer.Length -lt 1000000) { throw "Setup EXE is unexpectedly small" }

      - name: Commit validated V6.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/style.css src/main.ts src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V6.0: compact lab window and rows"
            git push
          fi

      - name: Upload V6.0 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V6.0-Compact-Labs
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
