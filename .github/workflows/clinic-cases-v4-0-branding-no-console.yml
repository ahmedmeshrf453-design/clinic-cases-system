          from pathlib import Path
          from PIL import Image
          raw = base64.b64decode(Path('_ak_logo.clean.b64').read_text())
          Path('public/clinic-logo-emblem-source.jpg').write_bytes(raw)
          img = Image.open('public/clinic-logo-emblem-source.jpg').convert('RGBA')
          fit = img.copy()
          fit.thumbnail((900,900), Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA', (1024,1024), (255,255,255,0))
          x = (1024-fit.width)//2
          y = (1024-fit.height)//2
          canvas.paste(fit, (x,y), fit)
          canvas.save('public/clinic-logo-emblem.png')
          ico_canvas = Image.new('RGBA', (256,256), (255,255,255,0))
          fit2 = img.copy()
          fit2.thumbnail((220,220), Image.Resampling.LANCZOS)
          x2 = (256-fit2.width)//2
          y2 = (256-fit2.height)//2
          ico_canvas.paste(fit2, (x2,y2), fit2)
          ico_canvas.save('src-tauri/icons/icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          PY

