name: Clinic Cases V7.1.11 Restore Visible Image Icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V7.1.11 icon visibility fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          main_p = Path("src/main.ts")
          tauri_p = Path("src-tauri/tauri.conf.json")
          cargo_p = Path("src-tauri/Cargo.toml")
          lock_p = Path("src-tauri/Cargo.lock")
          pkg_p = Path("package.json")
          pkglock_p = Path("package-lock.json")

          m = main_p.read_text(encoding="utf-8")

          # Keep BOTH classes:
          # v719b supplies the sprite image/background-position rules.
          # v7110 supplies the compact card sizing/layout.
          m = m.replace(
              'class="specialty-home specialty-home-v7110"',
              'class="specialty-home specialty-home-v719b specialty-home-v7110"',
              1
          )

          m = re.sub(
              r'V7\.1\.\d+ • [^<]+',
              'V7.1.11 • COMPACT IMAGE CARDS FIX',
              m,
              count=1
          )
          main_p.write_text(m, encoding="utf-8")

          tauri = json.loads(tauri_p.read_text(encoding="utf-8"))
          tauri["version"] = "7.1.11"
          tauri_p.write_text(json.dumps(tauri, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          pkg = json.loads(pkg_p.read_text(encoding="utf-8"))
          pkg["version"] = "7.1.11"
          pkg_p.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          pl = pkglock_p.read_text(encoding="utf-8")
          pl = re.sub(r'("version"\s*:\s*")7\.1\.\d+(")', r'\g<1>7.1.11\2', pl, count=2)
          pkglock_p.write_text(pl, encoding="utf-8")

          cg = cargo_p.read_text(encoding="utf-8")
          cg = re.sub(r'(?m)^version\s*=\s*"7\.1\.\d+"\s*$', 'version = "7.1.11"', cg, count=1)
          cargo_p.write_text(cg, encoding="utf-8")

          cl = lock_p.read_text(encoding="utf-8")
          cl = re.sub(
              r'(name\s*=\s*"clinic-cases-system"\s*\nversion\s*=\s*")7\.1\.\d+(")',
              r'\g<1>7.1.11\2',
              cl,
              count=1
          )
          lock_p.write_text(cl, encoding="utf-8")

          print("V7.1.11 icon visibility fix applied")
          PY

      - name: Verify V7.1.11
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          m = Path("src/main.ts").read_text(encoding="utf-8")
          c = Path("src/style.css").read_text(encoding="utf-8")
          t = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          assert t.get("version") == "7.1.11"
          assert 'specialty-home specialty-home-v719b specialty-home-v7110' in m
          assert "V7.1.11 • COMPACT IMAGE CARDS FIX" in m

          # Required sprite asset + CSS must already exist on main.
          sprite = Path("public/home-icons/organ-sprite.webp")
          assert sprite.exists() and sprite.stat().st_size > 50000
          assert ".specialty-home-v719b .photo-sprite-tile" in c
          assert "background-image:url('/home-icons/organ-sprite.webp')" in c
          assert ".specialty-home-v7110 .specialty-card" in c
          assert "photo-sprite-tile" in m
          assert "organ-urology" in m and "organ-labs" in m

          print("V7.1.11 icon visibility verification passed")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "NSIS build attempt $attempt/3"
            if npx tauri build --bundles nsis; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1

      - name: Verify installer
        shell: pwsh
        run: |
          $i = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" |
            Where-Object { $_.Name -match "7\.1\.11" } |
            Select-Object -First 1
          if(-not $i){ throw "V7.1.11 installer missing" }
          if($i.Length -lt 80000000){ throw "Installer too small" }

      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.1.11-Restore-Visible-Image-Icons
          path: src-tauri/target/release/bundle/nsis/*7.1.11*-setup.exe
          if-no-files-found: error

      - name: Commit validated V7.1.11
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "V7.1.11: restore image icons in compact cards"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
