name: Clinic Cases V7.1.22 Restore Realistic Hologram Icons
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore medical hologram icons only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,json,re
          p=Path('src/main.ts'); s=p.read_text(encoding='utf-8')
          a=Path('public/holograms');a.mkdir(parents=True,exist_ok=True)
          assets={
              'endocrine.webp': '',
              'others.webp': '',
              'pediatrics.webp': '',
              'emergency.webp': '',
              'dermatology.webp': '',
              'behavior.webp': '',
              'dental.webp': '',
              'cardio.webp': '',
          }
          for filename,data in assets.items():(a/filename).write_bytes(base64.b64decode(data))
          oldmap=s[s.index('const HOME_SPECIALTY_ICON_SRC:Record<string,string>={'):s.index('function specialtyMeta(',s.index('const HOME_SPECIALTY_ICON_SRC:Record<string,string>={'))]
          newmap="""const HOME_SPECIALTY_ICON_SRC:Record<string,string>={
            urology:'/holograms/urology.webp', internal:'/holograms/internal.webp',
            cardio:'/holograms/cardio.webp', endocrine:'/holograms/endocrine.webp',
            pediatrics:'/holograms/pediatrics.webp', dermatology:'/holograms/dermatology.webp',
            behavior:'/holograms/behavior.webp', dental:'/holograms/dental.webp',
            ortho:'/holograms/ortho.webp', surgery:'/holograms/surgery.webp',
            eye:'/holograms/eye.webp', neuro:'/holograms/neuro.webp',
            obgyn:'/holograms/obgyn.webp', ent:'/holograms/ent.webp',
            nutrition:'/holograms/nutrition.webp', vascular:'/holograms/vascular.webp',
            audiology:'/holograms/ent.webp'
          };
          function homeSpecialtyIconSrc(key:string){return HOME_SPECIALTY_ICON_SRC[key]||'/holograms/internal.webp'}
          const HOME_SERVICE_ICON_SRC:Record<string,string>={
            labs:'/home-icons/organ-sprite.webp',radiology:'/home-icons/organ-sprite.webp',
            physio:'/home-icons/organ-sprite.webp',nursing:'/home-icons/organ-sprite.webp',
            emergency:'/holograms/emergency.webp',others:'/holograms/others.webp'
          };
          function homeServiceIconSrc(key:string){return HOME_SERVICE_ICON_SRC[key]||'/holograms/others.webp'}
          """
          assert oldmap.count('const HOME_SERVICE_ICON_SRC')==1
          s=s.replace(oldmap,newmap,1)
          # Original service tiles remain sprite-backed; only 2 new services use raster icon images
          old_service='<span class="clinic-service-icon service-hologram-icon"><img src="${homeServiceIconSrc(x.key)}" alt="${esc(x.label)}"></span>'
          new_service=base64.b64decode("").decode()
          assert s.count(old_service)==1
          s=s.replace(old_service,new_service,1)
          # ensure distinctive image src for each new specialty and preserve doctor logic
          assert "const specialtyDoctors=doctors.filter(d=>d.active);" in s
          for name in ('behavior','dental','cardio','endocrine','pediatrics','dermatology'):
           assert f'{name}:' in s
          p.write_text(s,encoding='utf-8')
          # Keep CSS, sidebar, branding, white backgrounds, screen behavior untouched.
          for f in ('package.json','src-tauri/tauri.conf.json'):
           q=Path(f);v=json.loads(q.read_text(encoding='utf-8'));assert v['version']=='7.1.21';v['version']='7.1.22';q.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          q=Path('package-lock.json');v=q.read_text(encoding='utf-8');v,n=re.subn(r'("version"\s*:\s*")7\.1\.21(")',r'\g<1>7.1.22\2',v,count=2);assert n==2,n;q.write_text(v,encoding='utf-8')
          q=Path('src-tauri/Cargo.toml');v=q.read_text(encoding='utf-8');v,n=re.subn(r'(?m)^version\s*=\s*"7\.1\.21"\s*$','version = "7.1.22"',v,count=1);assert n==1,n;q.write_text(v,encoding='utf-8')
          q=Path('src-tauri/Cargo.lock');v=q.read_text(encoding='utf-8');v,n=re.subn(r'(name\s*=\s*"clinic-cases-system"\s*\nversion\s*=\s*")7\.1\.21(")',r'\g<1>7.1.22\2',v,count=1);assert n==1,n;q.write_text(v,encoding='utf-8')
          print('Restored original realistic holograms and added raster icons, no global design touched')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        shell: bash
        run: npm ci
      - name: Frontend build
        shell: bash
        run: npm run build
      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        shell: bash
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.1.22-Realistic-Holograms
          path: src-tauri/target/release/bundle/nsis/*7.1.22*-setup.exe
          if-no-files-found: error
      - name: Commit changes after validated build
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts public/holograms package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m 'V7.1.22: restore realistic medical hologram icons only'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
