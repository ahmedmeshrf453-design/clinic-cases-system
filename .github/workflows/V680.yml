      - name: Verify existing lab prices are untouched
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/labCatalog.sha256"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: V6.8 Lab 2 Lab gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          main = Path('src/main.ts').read_text(encoding='utf-8')
          rust = Path('src-tauri/src/lib.rs').read_text(encoding='utf-8')
          css = Path('src/style.css').read_text(encoding='utf-8')
          cat = Path('src/lab2labCatalog.ts').read_text(encoding='utf-8')
          conf = json.loads(Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          pkg = json.loads(Path('package.json').read_text(encoding='utf-8'))

          assert conf['version'] == '6.8.0'
          assert pkg['version'] == '6.8.0'
          assert conf['bundle']['windows']['webviewInstallMode']['type'] == 'offlineInstaller'
          assert cat.count('"testName"') == 331, cat.count('"testName"')
          for item in ['1 hr blood glucose (GTC report)', '17-OH progesterone', 'TSH', 'vit D3 (25 HYDROXYCHOLECALCIFEROL)', 'Contact lab']:
              assert item in cat, item
          for item in ["'lab2lab'", 'renderLab2Lab', 'LAB2LAB_SOURCE', 'أسعار Lab 2 Lab', 'editLab2LabPrice', 'changeLab2LabPin']:
              assert item in main, item
          for item in ['lab2lab_prices', 'lab2lab_auth_status', 'setup_lab2lab_pin', 'verify_lab2lab_pin', 'seed_lab2lab_prices', 'list_lab2lab_prices', 'update_lab2lab_price', 'Sha256']:
              assert item in rust, item
          assert '/* ===== V6.8 independent Lab 2 Lab price vault ===== */' in css
          print('V6.8 Lab 2 Lab gate passed - existing clinic lab catalog preserved')
          PY

      - name: Build V6.8 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 80000000) { throw "Offline WebView2 installer missing or setup too small" }

      - name: Commit validated V6.8 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src/lab2labCatalog.ts src-tauri/src/lib.rs src-tauri/tauri.conf.json src-tauri/Cargo.toml package.json
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V6.8: independent secure Lab 2 Lab prices"
            git push
          fi

      - name: Upload V6.8 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V6.8-Lab2Lab-Secure-Prices
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
