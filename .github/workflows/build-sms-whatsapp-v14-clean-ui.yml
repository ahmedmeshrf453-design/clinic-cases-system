      - name: Verify clean UI and existing features
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionName = "2.2.0"' app/build.gradle.kts
          grep -q 'android:id="@+id/todayBookingsButton"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/reportsButton"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/sourceSpinner"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/daySpinner"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/messagesContainer"' app/src/main/res/layout/activity_main.xml
          grep -q 'إدارة التطبيق' app/src/main/res/layout/activity_main.xml
          grep -q 'الوصول السريع' app/src/main/res/layout/activity_main.xml
          grep -q 'EkshefDoctorMapper.replaceClinicNumber' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q '58025' app/src/main/java/com/alakad/smsforwarder/EkshefDoctorMapper.kt
          grep -q '57330' app/src/main/java/com/alakad/smsforwarder/EkshefDoctorMapper.kt
          grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_SMS' app/src/main/AndroidManifest.xml
          grep -q 'com.whatsapp.w4b' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q '11:58' README.md
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          test -s app/stable-release.jks

      - name: Build installable APK
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.2-Clean-UI.apk"
          sha256sum "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.2-Clean-UI.apk" > "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.2-Clean-UI.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagz-AlHalat-v2.2-Clean-UI
          path: |
            Hagz-AlHalat-v2.2-Clean-UI.apk
            Hagz-AlHalat-v2.2-Clean-UI.sha256
          retention-days: 30
