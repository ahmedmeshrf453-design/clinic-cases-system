      - name: Verify catalogs untouched
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/labCatalog.sha256"
          sha256sum -c "$RUNNER_TEMP/lab2labCatalog.sha256"
          sha256sum -c "$RUNNER_TEMP/lab2labArabic.sha256"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        shell: bash
        run: npm install
      - name: Frontend build
        shell: bash
        run: npm run build
      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Performance gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          main=Path('src/main.ts').read_text(encoding='utf-8')
          rust=Path('src-tauri/src/lib.rs').read_text(encoding='utf-8')
          css=Path('src/style.css').read_text(encoding='utf-8')
          assert json.loads(Path('package.json').read_text())['version']=='6.9.1'
          assert json.loads(Path('src-tauri/tauri.conf.json').read_text())['version']=='6.9.1'
          for x in ['CORE_DATA_TTL_MS = 15000','clinic_last_screen','currentLimit = 120','patientLoadMore','bindModalBackObserver()','exitAppBtn']:
              assert x in main,x
          for x in ['fn exit_app(','WindowEvent::CloseRequested','window.minimize()']:
              assert x in rust,x
          assert 'V6.9.1 performance/resume' in css
          print('V6.9.1 performance gates passed')
          PY
      - name: Build Windows installer
        shell: bash
        run: npx tauri build --bundles nsis
      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          if ($installer.Length -lt 80000000) { throw "Offline WebView2 installer missing or setup too small" }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V6.9.1-Performance-Resume
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/src/lib.rs package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then echo "No source changes to commit"; else git commit -m "V6.9.1: faster navigation and instant resume"; fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
