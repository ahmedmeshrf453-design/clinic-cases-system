      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Validate frontend
        shell: bash
        run: npm run build

      - name: Validate Rust
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: V4.8 functionality gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          main = Path("src/main.ts").read_text(encoding="utf-8")
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          for term in [
            "today-summary-grid",
            "todayStatusFilter",
            "reportStatus",
            "reportVisitType",
            "إجمالي التحصيل",
            "ملخص الأطباء",
            "doctorBreakdown"
          ]:
              assert term in main, term

          assert conf["app"]["security"]["csp"]
          assert conf["app"]["windows"][0].get("devtools") is False
          assert "windows_subsystem" in Path("src-tauri/src/main.rs").read_text(encoding="utf-8")
          print("V4.8 gate passed")
          PY

      - name: Build V4.8 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify Setup EXE
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer:" $installer.FullName

      - name: Commit validated V4.8 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V4.8: richer today screen and reports"
            git push
          fi

      - name: Upload V4.8 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V4.8-Reports-Today-Intelligence-Installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
