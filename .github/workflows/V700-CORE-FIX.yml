      - name: Verify Lab2Lab catalogs untouched
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/labCatalog.sha256"
          sha256sum -c "$RUNNER_TEMP/lab2labCatalog.sha256"
          sha256sum -c "$RUNNER_TEMP/lab2labArabic.sha256"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: V7.0 core gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          from pathlib import Path
          import json
          main=Path("src/main.ts").read_text(encoding="utf-8")
          rust=Path("src-tauri/src/lib.rs").read_text(encoding="utf-8")
          css=Path("src/style.css").read_text(encoding="utf-8")
          pkg=json.loads(Path("package.json").read_text(encoding="utf-8"))
          conf=json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          assert pkg["version"]=="7.0.0"
          assert conf["version"]=="7.0.0"
          for term in ["renderCashier","renderFinance","renderAudit","renderAlerts","renderSecurity","openPatientAttachments","unified_search","startV7App","patientAttachments","'cashier'","'finance'","'alerts'","'audit'","'security'"]:
              assert term in main, term
          for term in ["CREATE TABLE IF NOT EXISTS patient_attachments","CREATE TABLE IF NOT EXISTS cashier_payments","CREATE TABLE IF NOT EXISTS audit_log","security_status","set_security_pin","verify_security_pin","add_patient_attachment","list_patient_attachments","list_cashier_items","record_cashier_payment","financial_report","list_audit_logs","unified_search","list_system_alerts"]:
              assert term in rust, term
          assert "V7.0 Core" in css
          print("V7.0 core gates passed")
          PY2

      - name: Build V7.0 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 80000000) { throw "Offline WebView2 installer missing or setup too small" }

      - name: Upload V7.0 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.0-Core-FIX
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Commit validated V7.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/src/lib.rs package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then echo "No source changes to commit"; else git commit -m "V7.0.0: cashier attachments audit search alerts finance security"; fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
