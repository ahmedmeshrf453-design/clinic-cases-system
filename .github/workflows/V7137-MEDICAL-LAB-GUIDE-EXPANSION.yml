          newblock='\nconst extendedReference: Record<string,Partial<Guide>>={\n'+content+'\n};\n'+"\nconst familyReference: Array<[RegExp,Partial<Guide>]> = [\n  [/Culture|C\\/S|C\\/S\\b|مزرعة/i,{purpose:'مزرعة للبحث عن الكائنات المسببة للعدوى وتحديد الحساسية عند انطباق ذلك.',organ:'العدوى والميكروبيولوجيا',specimen:'العينة المطلوبة تتحدد حسب موضع العدوى ولا يجوز افتراض أنها دم.',tube:'وعاء أو وسط نقل ميكروبي معتمد حسب العينة.',timing:'يفضل جمع العينة قبل المضادات إذا أمكن ودون تأخير العلاج.',turnaround:'المزارع تتطلب حضانة؛ المعمل يحدد المدة النهائية.',caution:'تعليمات النقل والتعقيم تختلف حسب نوع المزرعة.'}],\n  [/PCR|DNA|RNA|Mutation|Genetic|Karyotyp/i,{purpose:'اختبار جزيئي للكشف عن مادة وراثية أو تغيرات جينية بحسب اسم التحليل.',organ:'الوراثة أو الأمراض المعدية وفق الاختبار',specimen:'تحديد نوع العينة يتطلب الرجوع للاختبار المحدد.',tube:'لا يمكن اعتماد لون أنبوبة موحد لكل الاختبارات الجزيئية.',timing:'قد توجد تعليمات جمع أو نقل متخصصة.',turnaround:'حسب المعمل المرجعي وتقنية الفحص.',caution:'هذه معلومات فئة عامة وليست بروتوكولًا خاصًا لهذا التحليل.'}],\n  [/IgG|IgM|IgA|Antibody|\\bAb\\b|Antigen|\\bAg\\b/i,{purpose:'فحص مناعي للكشف عن أجسام مضادة أو مستضدات بحسب اسم التحليل.',organ:'المناعة أو العدوى أو العضو المرتبط بالفحص',specimen:'غالبًا مصل، لكن يجب تأكيد العينة على مستوى التحليل.',tube:'مصل: ذهبي SST أو أحمر؛ إذا وافق دليل الجهاز فقط.',timing:'قد يتأثر تفسير بعض الأجسام المضادة بتوقيت التعرض للعدوى.',turnaround:'حسب تشغيل المناعة أو الإرسال الخارجي.',caution:'هذه إرشادات عامة لفئة اختبارات المناعة.'}],\n  [/\\bUrine\\b|بول/i,{purpose:'تحليل مرتبط بعينة البول لتقييم حالة محددة وفق اسمه.',organ:'الكلى والمسالك البولية أو التمثيل الغذائي',specimen:'بول بعينة مفردة أو مجمعة وفق اسم الاختبار.',tube:'وعاء بول معتمد؛ ليس أنبوبة دم.',timing:'تعليمات وقت جمع العينة تختلف بين العينة المفردة و24 ساعة.',turnaround:'حسب فحص العينة وتشغيل المعمل.',caution:'هذه بيانات مبدئية لفئة اختبارات البول؛ راجع تعليمات الفحص.'}],\n  [/\\bStool\\b|براز/i,{purpose:'اختبار مرتبط بالبر