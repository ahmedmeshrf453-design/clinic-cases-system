          s=s.replace(point,newblock+point,1)
          old='...Object.entries(standard).find(([key])=>active.name.toLowerCase().includes(key.toLowerCase()))?.[1],...edits[String(active.id)]'
          new='...Object.entries(standard).find(([key])=>active.name.toLowerCase().includes(key.toLowerCase()))?.[1],...familyReference.find(([pattern])=>pattern.test(active.name))?.[1],...Object.entries(extendedReference).sort((a,b)=>b[0].length-a[0].length).find(([key])=>active.name.toLowerCase().includes(key.toLowerCase()))?.[1],...edits[String(active.id)]'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          css=Path('src/style.css');css.write_text(css.read_text(encoding='utf-8')+'\n/* V7.1.37 lab guide tube cues */\n.lab-guide-body .lab-guide-field{line-height:1.65!important}\n',encoding='utf-8')
          for fn in ['package.json','src-tauri/tauri.conf.json']:
           p=Path(fn);v=json.loads(p.read_text(encoding='utf-8'));assert v['version'] in ('7.1.35','7.1.36'),(fn,v['version']);v['version']='7.1.37';p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for fn in ['package-lock.json','src-tauri/Cargo.toml','src-tauri/Cargo.lock']:
           p=Path(fn);v=p.read_text(encoding='utf-8')
           if fn.endswith('.json'):v,n=re.subn(r'("version"\s*:\s*")7\.1\.3[56](")',r'\g<1>7.1.37\2',v,count=2);assert n==2,n
           elif fn.endswith('.toml'):v,n=re.subn(r'(?m)^version\s*=\s*"7\.1\.3[56]"\s*$', 'version = "7.1.37"',v,count=1);assert n==1
           else:v,n=re.subn(r'(name\s*=\s*"clinic-cases-system"\s*\nversion\s*=\s*")7\.1\.3[56](")',r'\g<1>7.1.37\2',v,count=1);assert n==1
           p.write_text(v,encoding='utf-8')
          print('Medical guide enhanced with specific groups and cautious family guidance')
          
          PY
      - name: Verify reference coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/labReferenceGuide.ts').read_text(encoding='utf-8')
          assert 'const extendedReference:' in s
          assert 'const familyReference:' in s
          assert 'Urine C/S' in s
          assert 'Sodium citrate' in s
          print('Expanded guide and fallback hierarchy present')
          
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Windows installer
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-V7.1.37-Medical-Lab-Guide
          path: src-tauri/target/release/bundle/nsis/*7.1.37*-setup.exe
          if-no-files-found: error
      - name: Commit only after green
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/labReferenceGuide.ts src/style.css package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m 'V7.1.37 expand medical lab guide'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
