name: Clinic Cases V7.1.2 Real 3D Organ Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add 3D organ sprite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/home-icons
          rm -f "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          printf '%s' '' >> "$RUNNER_TEMP/organ-sprite.b64"
          python - "$RUNNER_TEMP/organ-sprite.b64" "public/home-icons/organ-sprite.webp" <<'PY'
          import base64,pathlib,sys
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(pathlib.Path(sys.argv[1]).read_text()))
          PY

      - name: Apply V7.1.2 UI
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/v712patch.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v712patch.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v712patch.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v712patch.b64"
          python - "$RUNNER_TEMP/v712patch.b64" <<'PY'
          import base64,pathlib,sys
          exec(base64.b64decode(pathlib.Path(sys.argv[1]).read_text()).decode("utf-8"))
          PY

      - name: Verify source and sprite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          m=Path('src/main.ts').read_text(encoding='utf-8')
          c=Path('src/style.css').read_text(encoding='utf-8')
          t=Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8')
          p=Path('public/home-icons/organ-sprite.webp')
          assert '"version": "7.1.2"' in t
          assert 'REAL 3D ORGAN IMAGES' in m
          assert 'organ-sprite' in m and 'organ-sprite' in c
          assert p.exists() and p.stat().st_size > 30000
          print('V7.1.2 verified')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify installer
        shell: pwsh
        run: |
          $i=Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Where-Object { $_.Name -match "7\.1\.2" } | Select-Object -First 1
          if(-not $i){throw "V7.1.2 installer missing"}
          if($i.Length -lt 80000000){throw "Installer too small"}

      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.1.2-Real-3D-Organ-Images
          path: src-tauri/target/release/bundle/nsis/*7.1.2*-setup.exe
          if-no-files-found: error

      - name: Commit validated V7.1.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/home-icons/organ-sprite.webp src/main.ts src/style.css src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "V7.1.2: real 3D organ image tiles"; fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
