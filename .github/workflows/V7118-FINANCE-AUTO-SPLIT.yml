name: Clinic Cases V7.1.18 Finance Auto Split
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply finance split safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYINNER'
          from pathlib import Path
          import json,re
          p=Path('src/main.ts');s=p.read_text(encoding='utf-8')
          start=s.index('function openSpecialtyBookingModal(')
          end=s.index('\nasync function renderDoctors()',start)
          chunk=s[start:end]
          anchor="  const typeInput=form.querySelector<HTMLSelectElement>('select[name=\"visitType\"]')!;"
          injection="""  // Default fee allocation: 60% physician, 40% clinic. Both shares remain editable.
          const feeInput=form.querySelector<HTMLInputElement>('input[name="fee"]')!;
          const clinicInput=form.querySelector<HTMLInputElement>('input[name="clinicAmount"]')!;
          const doctorInput=form.querySelector<HTMLInputElement>('input[name="doctorAmount"]')!;
          const updateShares=()=>{
            const raw=feeInput.value.trim();
            if(!raw){clinicInput.value='';doctorInput.value='';return}
            const cents=Math.round(Number(raw)*100);
            if(!Number.isFinite(cents)||cents<0)return;
            const doctorCents=Math.round(cents*0.6);
            doctorInput.value=(doctorCents/100).toFixed(2);
            clinicInput.value=((cents-doctorCents)/100).toFixed(2);
          };
          feeInput.addEventListener('input',updateShares);
          """
          assert chunk.count(anchor)==1,'Finance UI binding anchor not found'
          chunk=chunk.replace(anchor,anchor+'\n'+injection,1)
          anchor2="      const result=await invoke<{id:string,existed:boolean}>('register_patient',{input:{"
          validation="""      const feeText=String(fd.get('fee')||'').trim();
          const clinicText=String(fd.get('clinicAmount')||'').trim();
          const doctorText=String(fd.get('doctorAmount')||'').trim();
          if(feeText && clinicText && doctorText){
            const cents=Math.round(Number(feeText)*100);
            const shares=Math.round(Number(clinicText)*100)+Math.round(Number(doctorText)*100);
            if(!Number.isFinite(cents)||!Number.isFinite(shares)||Math.abs(cents-shares)>1)
              throw new Error('مجموع مبلغ العيادة والطبيب لازم يساوي سعر الكشف');
          }
          """
          assert chunk.count(anchor2)==1,'Finance submission anchor not found'
          chunk=chunk.replace(anchor2,validation+anchor2,1)
          s=s[:start]+chunk+s[end:]
          p.write_text(s,encoding='utf-8')
          for f in ['package.json','src-tauri/tauri.conf.json']:
            q=Path(f);d=json.loads(q.read_text(encoding='utf-8'))
            assert d['version']=='7.1.17',(f,d['version'])
            d['version']='7.1.18';q.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          q=Path('package-lock.json');v=q.read_text(encoding='utf-8');v,n=re.subn(r'("version"\s*:\s*")7\.1\.17(")',r'\g<1>7.1.18\2',v,count=2)
          assert n==2,('package-lock',n);q.write_text(v,encoding='utf-8')
          for f,pat,repl in [
            ('src-tauri/Cargo.toml',r'(?m)^version\s*=\s*"7\.1\.17"\s*$', 'version = "7.1.18"'),
            ('src-tauri/Cargo.lock',r'(name\s*=\s*"clinic-cases-system"\s*\nversion\s*=\s*")7\.1\.17(")',r'\g<1>7.1.18\2')]:
            q=Path(f);v=q.read_text(encoding='utf-8');v,n=re.subn(pat,repl,v,count=1)
            assert n==1,(f,n);q.write_text(v,encoding='utf-8')
          PYINNER
      - name: Verify finance allocation and preserved booking
        shell: bash
        run: |
          python - <<'PYINNER'
          from pathlib import Path
          import json
          s=Path('src/main.ts').read_text(encoding='utf-8')
          c=s[s.index('function openSpecialtyBookingModal('):s.index('async function renderDoctors()')]
          checks={
            'fee auto 60 40': 'const doctorCents=Math.round(cents*0.6)' in c and 'cents-doctorCents' in c,
            'manual override': "feeInput.addEventListener('input',updateShares)" in c,
            'allocation validation': 'Math.abs(cents-shares)>1' in c,
            'existing patient reuse': 'const reused=result.existed;' in c,
            'visit booking': "await invoke('add_visit'" in c,
            'patient click': 'data-booking-patient-row' in s,
            'version':json.loads(Path('package.json').read_text())['version']=='7.1.18',
          }
          for k,v in checks.items():print(k,'OK' if v else 'FAIL')
          assert all(checks.values()),checks
          PYINNER
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        shell: bash
        run: npm ci
      - name: Frontend build
        shell: bash
        run: npm run build
      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Windows installer
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx tauri build --bundles nsis; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - name: Verify Windows installer
        shell: pwsh
        run: |
          $i=Get-ChildItem 'src-tauri\target\release\bundle\nsis\*-setup.exe' | Where-Object { $_.Name -match '7\.1\.18' } | Select-Object -First 1
          if(-not $i){throw 'V7.1.18 installer missing'}
          if($i.Length -lt 80000000){throw 'Installer too small'}
      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.1.18-Finance-Auto-Split
          path: src-tauri/target/release/bundle/nsis/*7.1.18*-setup.exe
          if-no-files-found: error
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
          git commit -m 'V7.1.18: automatic finance split in specialty bookings'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
