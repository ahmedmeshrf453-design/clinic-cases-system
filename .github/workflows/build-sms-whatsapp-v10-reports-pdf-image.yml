name: Build Hagz AlHalat V1.9 Reports PDF Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore V1.8 project from V9 workflow
        shell: bash
        run: |
          set -euo pipefail
          SRC=".github/workflows/build-sms-whatsapp-v9-today-bookings.yml"
          test -f "$SRC"
          mkdir -p "$RUNNER_TEMP/hagzapp"
          sed -n "/<<'PROJECT_B64'/,/^[[:space:]]*PROJECT_B64[[:space:]]*$/p" "$SRC" \
            | sed '1d;$d;s/^[[:space:]]*//' \
            > "$RUNNER_TEMP/project.b64"
          test -s "$RUNNER_TEMP/project.b64"
          base64 -d "$RUNNER_TEMP/project.b64" > "$RUNNER_TEMP/project.zip"
          unzip -q "$RUNNER_TEMP/project.zip" -d "$RUNNER_TEMP/hagzapp"

      - name: Add reports screen and export engine
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        env:
          REPORTS_KT_B64: ""
          REPORTS_LAYOUT_B64: ""
          FILE_PATHS_B64: "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHBhdGhzIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+CiAgICA8Y2FjaGUtcGF0aCBuYW1lPSJyZXBvcnRzIiBwYXRoPSJyZXBvcnRzLyIgLz4KPC9wYXRocz4K"
          PANEL_B64: ""
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/xml
          printf '%s' "$REPORTS_KT_B64" | base64 -d > app/src/main/java/com/alakad/smsforwarder/ReportsActivity.kt
          printf '%s' "$REPORTS_LAYOUT_B64" | base64 -d > app/src/main/res/layout/activity_reports.xml
          printf '%s' "$FILE_PATHS_B64" | base64 -d > app/src/main/res/xml/file_paths.xml
          printf '%s' "$PANEL_B64" | base64 -d > "$RUNNER_TEMP/reports_panel.xml"

          python3 - <<'PY2'
          from pathlib import Path
          import os, re

          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 9', s, count=1)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.9.0"', s, count=1)
          p.write_text(s, encoding='utf-8')

          p = Path('app/src/main/java/com/alakad/smsforwarder/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          hook = '        findViewById<Button>(R.id.openGroupButton).setOnClickListener { openGroup() }\n'
          if hook not in s:
              raise SystemExit('MainActivity openGroup hook not found')
          if 'R.id.reportsButton' not in s:
              add = '        findViewById<Button>(R.id.reportsButton).setOnClickListener { startActivity(Intent(this, ReportsActivity::class.java)) }\n'
              s = s.replace(hook, hook + add, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('app/src/main/res/layout/activity_main.xml')
          s = p.read_text(encoding='utf-8')
          if 'android:id="@+id/reportsButton"' not in s:
              panel = (Path(os.environ['RUNNER_TEMP']) / 'reports_panel.xml').read_text(encoding='utf-8').strip()
              m = re.search(r'\s*<LinearLayout\s+\n\s*android:id="@\+id/messagesContainer"', s)
              if not m:
                  raise SystemExit('messagesContainer not found')
              indented = '\n'.join('            ' + line if line else '' for line in panel.splitlines())
              s = s[:m.start()] + '\n' + indented + '\n\n' + s[m.start():]
          p.write_text(s, encoding='utf-8')

          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          if 'android:name=".ReportsActivity"' not in s:
              block = (
                  '        <activity\n'
                  '            android:name=".ReportsActivity"\n'
                  '            android:exported="false" />\n\n'
                  '        <provider\n'
                  '            android:name="androidx.core.content.FileProvider"\n'
                  '            android:authorities="${applicationId}.fileprovider"\n'
                  '            android:exported="false"\n'
                  '            android:grantUriPermissions="true">\n'
                  '            <meta-data\n'
                  '                android:name="android.support.FILE_PROVIDER_PATHS"\n'
                  '                android:resource="@xml/file_paths" />\n'
                  '        </provider>\n\n'
              )
              marker = '        <receiver\n'
              idx = s.find(marker)
              if idx < 0:
                  raise SystemExit('Manifest receiver marker not found')
              s = s[:idx] + block + s[idx:]
          p.write_text(s, encoding='utf-8')
          PY2

      - name: Verify V1.9 reports
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionName = "1.9.0"' app/build.gradle.kts
          grep -q 'reportsButton' app/src/main/res/layout/activity_main.xml
          grep -q 'ReportsActivity' app/src/main/AndroidManifest.xml
          grep -q 'FileProvider' app/src/main/AndroidManifest.xml
          grep -q 'reportDaySpinner' app/src/main/res/layout/activity_reports.xml
          grep -q 'reportSourceSpinner' app/src/main/res/layout/activity_reports.xml
          grep -q 'exportImageButton' app/src/main/res/layout/activity_reports.xml
          grep -q 'exportPdfButton' app/src/main/res/layout/activity_reports.xml
          grep -q 'PdfDocument' app/src/main/java/com/alakad/smsforwarder/ReportsActivity.kt
          grep -q 'MediaStore.Downloads' app/src/main/java/com/alakad/smsforwarder/ReportsActivity.kt
          grep -q 'bookingDateKey' app/src/main/java/com/alakad/smsforwarder/ReportsActivity.kt
          grep -q 'normalizeArabicDigits' app/src/main/java/com/alakad/smsforwarder/ReportsActivity.kt
          grep -q 'com.whatsapp.w4b' app/src/main/java/com/alakad/smsforwarder/ReportsActivity.kt
          grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_SMS' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          test -s app/stable-release.jks

      - name: Verify real booking date examples
        shell: bash
        run: |
          python3 - <<'PY3'
          import datetime, re
          trans = str.maketrans('٠١٢٣٤٥٦٧٨٩۰۱۲۳۴۵۶۷۸۹','01234567890123456789')
          cases = [
              'إكشف: الميعاد: غدا 30/9 من: 8:00 مساءً',
              'حجز جديد: السبت ١٠/٣ - ٨:٠٠ م',
              'حجزجديد, 2026-10-01 من الساعه 08:30 م',
          ]
          n = [x.translate(trans) for x in cases]
          assert re.search(r'(\d{1,2})\s*/\s*(\d{1,2})', n[0]).groups() == ('30','9')
          a,b = map(int, re.search(r'(\d{1,2})\s*/\s*(\d{1,2})', n[1]).groups())
          candidates = []
          for month,day in [(b,a),(a,b)]:
              try: candidates.append(datetime.date(2026,month,day))
              except ValueError: pass
          assert datetime.date(2026,10,3) in candidates
          assert datetime.date(2026,10,3).strftime('%A') == 'Saturday'
          assert re.search(r'(20\d{2})-(\d{1,2})-(\d{1,2})', n[2]).groups() == ('2026','10','01')
          print('Date examples OK')
          PY3

      - name: Build installable APK
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Hagz-AlHalat-v1.9-Reports-PDF-Image.apk"
          sha256sum "$GITHUB_WORKSPACE/Hagz-AlHalat-v1.9-Reports-PDF-Image.apk" > "$GITHUB_WORKSPACE/Hagz-AlHalat-v1.9-Reports-PDF-Image.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagz-AlHalat-v1.9-Reports-PDF-Image
          path: |
            Hagz-AlHalat-v1.9-Reports-PDF-Image.apk
            Hagz-AlHalat-v1.9-Reports-PDF-Image.sha256
          retention-days: 30
