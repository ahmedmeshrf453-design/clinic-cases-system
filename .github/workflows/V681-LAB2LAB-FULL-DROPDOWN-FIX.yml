name: Clinic Cases V6.8.1 Lab2Lab Full Dropdown FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Lab2Lab full dropdown fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          main_path = Path("src/main.ts")
          main = main_path.read_text(encoding="utf-8")

          main = main.replace(
              'placeholder="اكتب اسم التحليل للبحث..."',
              'placeholder="اختر من القائمة أو اكتب اسم التحليل..."',
              1
          )

          main = main.replace(
              '<div class="lab2lab-help">اكتب جزءًا من اسم التحليل، ثم اختره من القائمة المنسدلة.</div>',
              '<div class="lab2lab-help">اضغط لعرض كل التحاليل، أو اكتب لتصفية القائمة ثم اختر التحليل.</div>',
              1
          )

          main = main.replace('if (!q) return [];', 'if (!q) return rows;', 1)

          main = main.replace(
              'return rows.filter(row => norm(row.testName).includes(q)).slice(0, 15);',
              'return rows.filter(row => norm(row.testName).includes(q));',
              1
          )

          blank_guard = "    if (!searchInput.value.trim()) {\n      closeDropdown();\n      return;\n    }\n"
          if blank_guard in main:
              main = main.replace(blank_guard, "", 1)

          focus_bind = "  searchInput.onfocus = renderDropdown;\n"
          click_bind = "  searchInput.onfocus = renderDropdown;\n  searchInput.onclick = renderDropdown;\n"
          if "searchInput.onclick = renderDropdown;" not in main:
              if focus_bind not in main:
                  raise RuntimeError("Lab2Lab focus binding not found")
              main = main.replace(focus_bind, click_bind, 1)

          required = [
              'if (!q) return rows;',
              'searchInput.onclick = renderDropdown;',
              'اختر من القائمة أو اكتب اسم التحليل',
              'renderLab2Lab',
              'LAB2LAB_SOURCE'
          ]
          for item in required:
              if item not in main:
                  raise RuntimeError(f"Required patch marker missing: {item}")

          if '.slice(0, 15)' in main:
              raise RuntimeError("15 item dropdown limit still exists")

          main_path.write_text(main, encoding="utf-8")

          pkg_path = Path("package.json")
          pkg = json.loads(pkg_path.read_text(encoding="utf-8"))
          pkg["version"] = "6.8.1"
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          conf_path = Path("src-tauri/tauri.conf.json")
          conf = json.loads(conf_path.read_text(encoding="utf-8"))
          conf["version"] = "6.8.1"
          conf_path.write_text(json.dumps(conf, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          cargo_path = Path("src-tauri/Cargo.toml")
          cargo = cargo_path.read_text(encoding="utf-8")
          cargo = re.sub(r'(?m)^version\s*=\s*"6\.8\.0"\s*$', 'version = "6.8.1"', cargo, count=1)
          cargo_path.write_text(cargo, encoding="utf-8")

          print("V6.8.1 Lab2Lab full dropdown patch applied")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: V6.8.1 dropdown gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          main = Path("src/main.ts").read_text(encoding="utf-8")
          pkg = json.loads(Path("package.json").read_text(encoding="utf-8"))
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          assert pkg["version"] == "6.8.1"
          assert conf["version"] == "6.8.1"
          assert 'if (!q) return rows;' in main
          assert '.slice(0, 15)' not in main
          assert 'searchInput.onclick = renderDropdown;' in main
          assert 'اختر من القائمة أو اكتب اسم التحليل' in main

          print("V6.8.1 full dropdown gate passed")
          PY

      - name: Build V6.8.1 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 80000000) { throw "Offline WebView2 installer missing or setup too small" }

      - name: Upload V6.8.1 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V6.8.1-Lab2Lab-Full-Dropdown
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Commit validated V6.8.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main.ts package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true

          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V6.8.1: full Lab2Lab dropdown"
          fi

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
