      - name: Verify Lite Multi Select features
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionCode = 27' app/build.gradle.kts
          grep -q 'versionName = "2.7.0"' app/build.gradle.kts
          grep -q 'android:id="@+id/messagesList"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/selectModeButton"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/selectAllButton"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/resendSelectedButton"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/deleteSelectedButton"' app/src/main/res/layout/activity_main.xml
          grep -q 'class MessageAdapter : BaseAdapter' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'last_sms_scan' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'resendSelected' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'EkshefDoctorMapper.replaceClinicNumber' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'booking_arrivals_v26' app/src/main/java/com/alakad/smsforwarder/SmsReceiver.kt
          grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_SMS' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s app/stable-release.jks

      - name: Build installable APK
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.7-Lite-Multi-Select.apk"
          sha256sum "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.7-Lite-Multi-Select.apk" > "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.7-Lite-Multi-Select.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagz-AlHalat-v2.7-Lite-Multi-Select
          path: |
            Hagz-AlHalat-v2.7-Lite-Multi-Select.apk
            Hagz-AlHalat-v2.7-Lite-Multi-Select.sha256
          retention-days: 30
