name: Clinic Cases V7.0.1 PIN RESET FINAL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V7.0.1 PIN reset release
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/v701-pin-reset.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v701-pin-reset.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v701-pin-reset.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v701-pin-reset.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v701-pin-reset.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v701-pin-reset.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v701-pin-reset.b64"
          python - "$RUNNER_TEMP/v701-pin-reset.b64" <<'PY'
          import base64, pathlib, sys
          exec(base64.b64decode(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")).decode("utf-8"))
          PY

      - name: Verify source architecture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          m=Path("src/main.ts").read_text(encoding="utf-8")
          r=Path("src-tauri/src/lib.rs").read_text(encoding="utf-8")
          c=Path("src/style.css").read_text(encoding="utf-8")
          t=Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8")
          h=Path("src-tauri/windows/hooks.nsh").read_text(encoding="utf-8")

          assert '"version": "7.0.1"' in t
          assert "V7.0.1 • PIN RESET" in m
          assert 'id="v7RecoveryPanel"' in m
          assert 'id="v7LocalRecoveryForm"' in m
          assert "reset_security_pin_with_local_recovery" in m
          assert "reset_security_pin_with_local_recovery" in r
          assert "read_security_recovery_file_code" in r
          assert "file_matches_hash" in r
          assert "NSIS_HOOK_PREINSTALL" in h
          assert "taskkill.exe /F /IM clinic-cases-system.exe" in h
          assert "V7.0.1 FINAL local PIN recovery" in c

          a=m.find("function showV7LockScreen()")
          b=m.find("async function startV7App()",a)
          lock=m[a:b]
          assert "openSecurityRecoveryResetModal" not in lock
          assert "showRecovery" in lock

          print("Architecture verified")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Verify built frontend contains PIN reset UI
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q "V7.0.1.*PIN RESET" dist
          grep -R -q "reset_security_pin_with_local_recovery" dist
          echo "Built frontend contains V7.0.1 PIN reset flow"

      - name: Rust tests
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify exact V7.0.1 installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Where-Object { $_.Name -match "7\.0\.1" } | Select-Object -First 1
          if (-not $installer) { throw "V7.0.1 Setup EXE was not generated" }
          if ($installer.Length -lt 80000000) { throw "Installer too small" }
          Write-Host "Verified installer: $($installer.Name)"
          Write-Host "Size: $($installer.Length)"

      - name: Upload V7.0.1 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.0.1-PIN-RESET-FINAL
          path: src-tauri/target/release/bundle/nsis/*7.0.1*-setup.exe
          if-no-files-found: error

      - name: Commit validated V7.0.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/src/lib.rs src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/windows/hooks.nsh package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "V7.0.1: deterministic local PIN recovery release"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
