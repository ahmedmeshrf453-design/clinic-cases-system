      - name: Verify settings and existing features
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionName = "2.3.0"' app/build.gradle.kts
          grep -q 'android:id="@+id/settingsButton"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/autoImportSwitch"' app/src/main/res/layout/activity_settings.xml
          grep -q 'android:id="@+id/dailyReportSwitch"' app/src/main/res/layout/activity_settings.xml
          grep -q 'android:id="@+id/reportNotificationSwitch"' app/src/main/res/layout/activity_settings.xml
          grep -q 'SettingsActivity' app/src/main/AndroidManifest.xml
          grep -q 'AppPrefs.autoImportSms' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'AppPrefs.dailyReportEnabled' app/src/main/java/com/alakad/smsforwarder/DailyReportScheduler.kt
          grep -q 'AppPrefs.dailyReportNotification' app/src/main/java/com/alakad/smsforwarder/ReportEngine.kt
          grep -q 'EkshefDoctorMapper.replaceClinicNumber' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q '11:58' README.md
          grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_SMS' app/src/main/AndroidManifest.xml
          grep -q 'com.whatsapp.w4b' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          test -s app/stable-release.jks

      - name: Build installable APK
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.3-Settings.apk"
          sha256sum "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.3-Settings.apk" > "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.3-Settings.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagz-AlHalat-v2.3-Settings
          path: |
            Hagz-AlHalat-v2.3-Settings.apk
            Hagz-AlHalat-v2.3-Settings.sha256
          retention-days: 30
