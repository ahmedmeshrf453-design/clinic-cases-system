      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust
        shell: bash
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: V5.9 feature gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          main = Path("src/main.ts").read_text(encoding="utf-8")
          rust = Path("src-tauri/src/lib.rs").read_text(encoding="utf-8")
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          for term in [
              "type PatientLab =",
              "selectedPatientLabsHtml",
              "data-add-lab",
              "data-delete-patient-lab",
              "list_patient_labs",
              "add_patient_lab",
              "delete_patient_lab",
              "input.value = '';",
          ]:
              assert term in main, term

          for term in [
              "CREATE TABLE IF NOT EXISTS patient_labs",
              "UNIQUE(patient_id,catalog_id)",
              "fn list_patient_labs",
              "fn add_patient_lab",
              "fn delete_patient_lab",
              "DELETE FROM patient_labs WHERE patient_id",
              "idx_patient_labs_patient",
          ]:
              assert term in rust, term

          assert conf["version"] == "5.9.0"
          print("V5.9 feature gate passed")
          PY

      - name: Build V5.9 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          if ($installer.Length -lt 1000000) { throw "Setup EXE is unexpectedly small" }

      - name: Commit validated V5.9 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/src/lib.rs src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V5.9: patient lab add delete and continuous search"
            git push
          fi

      - name: Upload V5.9 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V5.9-Patient-Lab-Selection
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
