      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: V6.6 UI gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          main = Path("src/main.ts").read_text(encoding="utf-8")
          css = Path("src/style.css").read_text(encoding="utf-8")
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          for required in [
              "modern-shell-v66",
              "globalPatientSearch",
              "v66-primary-actions",
              "v66NewVisit",
              "v66NewLab",
              "v66NewNursing",
              "تسجيلات العيادة اليوم",
              "تسجيلات التحاليل اليوم",
              "تسجيلات التمريض اليوم",
              "إجمالي تسجيلات اليوم",
              "v66TodayRows",
              "بحث في تسجيلات اليوم",
              "عيادات العقاد التخصصية",
              "رعاية تليق بك",
          ]:
              assert required in main, required

          for required in [
              "/* ===== V6.6 professional dashboard redesign ===== */",
              ".modern-sidebar",
              ".modern-app-header",
              ".v66-action-card",
              ".v66-stats-grid",
              ".v66-today-card",
              ".v66-filter-tabs",
              ".v66-empty-state",
          ]:
              assert required in css, required

          assert "مجمع الرعاية الطبي" not in main
          assert "version: '6.6.0'" in main
          assert conf["version"] == "6.6.0"
          assert conf["bundle"]["windows"]["webviewInstallMode"]["type"] == "offlineInstaller"
          print("V6.6 UI gate passed")
          PY

      - name: Build V6.6 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 80000000) { throw "Offline WebView2 installer missing or setup too small" }

      - name: Commit validated V6.6 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V6.6: professional integrated clinic UI"
            git push
          fi

      - name: Upload V6.6 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V6.6-Professional-UI
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
