name: Clinic Cases V7.1.10 Compact Image Cards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V7.1.10 compact cards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          main_p = Path('src/main.ts')
          css_p = Path('src/style.css')
          tauri_p = Path('src-tauri/tauri.conf.json')
          cargo_p = Path('src-tauri/Cargo.toml')
          lock_p = Path('src-tauri/Cargo.lock')
          pkg_p = Path('package.json')
          pkglock_p = Path('package-lock.json')

          m = main_p.read_text(encoding='utf-8')
          c = css_p.read_text(encoding='utf-8')

          tauri = json.loads(tauri_p.read_text(encoding='utf-8'))
          tauri['version'] = '7.1.10'
          tauri_p.write_text(json.dumps(tauri, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          pkg = json.loads(pkg_p.read_text(encoding='utf-8'))
          pkg['version'] = '7.1.10'
          pkg_p.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          pl = pkglock_p.read_text(encoding='utf-8')
          pl = re.sub(r'("version"\s*:\s*")7\.1\.\d+(")', r'\g<1>7.1.10\2', pl, count=2)
          pkglock_p.write_text(pl, encoding='utf-8')

          cg = cargo_p.read_text(encoding='utf-8')
          cg = re.sub(r'(?m)^version\s*=\s*"7\.1\.\d+"\s*$', 'version = "7.1.10"', cg, count=1)
          cargo_p.write_text(cg, encoding='utf-8')

          cl = lock_p.read_text(encoding='utf-8')
          cl = re.sub(r'(name\s*=\s*"clinic-cases-system"\s*\nversion\s*=\s*")7\.1\.\d+(")', r'\g<1>7.1.10\2', cl, count=1)
          lock_p.write_text(cl, encoding='utf-8')

          m = re.sub(r"const HOME_SPECIALTY_ORDER_KEY='[^']+';", "const HOME_SPECIALTY_ORDER_KEY='clinicCases.home.specialties.v7110';", m)
          m = re.sub(r"const HOME_SERVICE_ORDER_KEY='[^']+';", "const HOME_SERVICE_ORDER_KEY='clinicCases.home.services.v7110';", m)
          m = re.sub(r'specialty-home specialty-home-v7[0-9a-zA-Z-]*', 'specialty-home specialty-home-v7110', m, count=1)
          m = re.sub(r'V7\.1\.\d+ • [^<]+', 'V7.1.10 • COMPACT IMAGE CARDS', m, count=1)

          if 'V7.1.10 COMPACT IMAGE CARDS' not in c:
              c += """

          /* ===== V7.1.10 COMPACT IMAGE CARDS ===== */
          .specialty-home-v7110{background:#f4f8fb!important}
          .specialty-home-v7110 .specialty-grid{grid-template-columns:repeat(7,minmax(132px,1fr))!important;gap:8px!important}
          .specialty-home-v7110 .clinic-services-grid{grid-template-columns:repeat(7,minmax(132px,1fr))!important;gap:8px!important}
          .specialty-home-v7110 .home-sortable-card{position:relative!important;overflow:visible!important;cursor:grab!important;user-select:none!important}
          .specialty-home-v7110 .home-sortable-card:active{cursor:grabbing!important}
          .specialty-home-v7110 .specialty-card,
          .specialty-home-v7110 .clinic-service-card{
            position:relative!important;
            min-height:82px!important;
            height:82px!important;
            padding:5px 8px 6px!important;
            border-radius:14px!important;
            border:1px solid #d8e5ee!important;
            background:#fff!important;
            box-shadow:0 5px 12px rgba(21,52,77,.045)!important;
            display:flex!important;
            flex-direction:column!important;
            align-items:center!important;
            justify-content:center!important;
            gap:3px!important;
            text-align:center!important;
            overflow:hidden!important
          }
          .specialty-home-v7110 .specialty-card:hover,
          .specialty-home-v7110 .clinic-service-card:hover{transform:translateY(-1px)!important;border-color:#bdd9e7!important;box-shadow:0 7px 15px rgba(21,52,77,.075)!important}
          .specialty-home-v7110 .specialty-card-arrow,
          .specialty-home-v7110 .specialty-card-copy small,
          .specialty-home-v7110 .clinic-service-copy small{display:none!important}
          .specialty-home-v7110 .specialty-card-drag{position:absolute!important;top:5px!important;right:5px!important;font-size:11px!important;color:#9cafbc!important;line-height:1!important;letter-spacing:-2px!important;padding:1px 2px!important;z-index:2!important}
          .specialty-home-v7110 .specialty-card-copy,
          .specialty-home-v7110 .clinic-service-copy{display:flex!important;align-items:center!important;justify-content:center!important;text-align:center!important;margin:0!important;min-height:18px!important}
          .specialty-home-v7110 .specialty-card-copy strong,
          .specialty-home-v7110 .clinic-service-copy strong{font-size:11px!important;font-weight:800!important;line-height:1.2!important;color:#153a5a!important;max-width:125px!important}
          .specialty-home-v7110 .photo-sprite-tile{width:46px!important;height:46px!important;min-width:46px!important;min-height:46px!important;border-radius:11px!important;margin:0 auto!important;border:1px solid #dce8ef!important;box-shadow:0 3px 9px rgba(40,125,166,.10),0 0 0 2px rgba(84,203,255,.06)!important;background-size:400% 400%!important}
          .specialty-home-v7110 .home-section-title{margin:2px 0 5px!important;min-height:25px!important}
          .specialty-home-v7110 .home-section-title strong{font-size:20px!important;line-height:1.1!important;color:#163a59!important}
          .specialty-home-v7110 .home-section-title small{font-size:9px!important;color:#899daa!important}
          .specialty-home-v7110 .specialty-home-hero{padding:9px 14px!important;margin-bottom:6px!important;min-height:auto!important;background:#fff!important;border:1px solid #d9e6ef!important;box-shadow:0 5px 14px rgba(20,50,74,.035)!important}
          .specialty-home-v7110 .specialty-home-hero h2{font-size:18px!important;margin:0 0 2px!important}
          .specialty-home-v7110 .specialty-home-hero p{font-size:11px!important;margin:0!important}
          .specialty-home-v7110 .specialty-home-day{padding:6px 9px!important;min-width:145px!important}
          .specialty-home-v7110 .home-quick-actions{gap:8px!important;margin-top:7px!important}
          .specialty-home-v7110 .home-quick-actions button{min-height:34px!important;padding:6px 8px!important;font-size:13px!important;background:#fff!important;border:1px solid #d9e6ef!important;color:#21455f!important}
          .specialty-home-v7110 .v71-build-stamp{font-size:9px!important;margin-top:3px!important}
          .specialty-home-v7110 .is-dragging{opacity:.55!important;transform:scale(.98)!important}
          .specialty-home-v7110 .is-drag-over{outline:2px dashed #9fdcff!important;outline-offset:-3px!important}
          @media(max-width:1380px){.specialty-home-v7110 .specialty-grid,.specialty-home-v7110 .clinic-services-grid{grid-template-columns:repeat(6,minmax(126px,1fr))!important}}
          @media(max-width:1120px){.specialty-home-v7110 .specialty-grid,.specialty-home-v7110 .clinic-services-grid{grid-template-columns:repeat(5,minmax(120px,1fr))!important}}
          @media(max-width:900px){.specialty-home-v7110 .specialty-grid,.specialty-home-v7110 .clinic-services-grid{grid-template-columns:repeat(3,minmax(118px,1fr))!important}}
          """

          main_p.write_text(m, encoding='utf-8')
          css_p.write_text(c, encoding='utf-8')
          print('V7.1.10 compact image cards applied')
          PY

      - name: Verify V7.1.10
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          m = Path('src/main.ts').read_text(encoding='utf-8')
          c = Path('src/style.css').read_text(encoding='utf-8')
          t = json.loads(Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          checks = {
            'version': t.get('version') == '7.1.10',
            'marker': 'COMPACT IMAGE CARDS' in m,
            'home_class': 'specialty-home-v7110' in m,
            'css': 'V7.1.10 COMPACT IMAGE CARDS' in c,
            'card_height': 'height:82px!important' in c,
            'icon_size': 'width:46px!important' in c,
          }
          for k,v in checks.items():
            print(k, 'OK' if v else 'FAIL')
          assert all(checks.values()), checks
          print('V7.1.10 verification passed')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "NSIS build attempt $attempt/3"
            if npx tauri build --bundles nsis; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1

      - name: Verify installer
        shell: pwsh
        run: |
          $i = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" |
            Where-Object { $_.Name -match "7\.1\.10" } |
            Select-Object -First 1
          if(-not $i){ throw "V7.1.10 installer missing" }
          if($i.Length -lt 80000000){ throw "Installer too small" }

      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.1.10-Compact-Image-Cards
          path: src-tauri/target/release/bundle/nsis/*7.1.10*-setup.exe
          if-no-files-found: error

      - name: Commit validated V7.1.10
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "V7.1.10: compact image cards"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
