      - name: Verify booking alert and offline mode
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionName = "2.5.0"' app/build.gradle.kts
          grep -q 'versionCode = 25' app/build.gradle.kts
          grep -q 'android.permission.USE_FULL_SCREEN_INTENT' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.VIBRATE' app/src/main/AndroidManifest.xml
          grep -q 'FullScreenBookingActivity' app/src/main/AndroidManifest.xml
          grep -q 'booking_arrivals_v25' app/src/main/java/com/alakad/smsforwarder/SmsReceiver.kt
          grep -q 'setFullScreenIntent' app/src/main/java/com/alakad/smsforwarder/SmsReceiver.kt
          grep -q 'DEFAULT_NOTIFICATION_URI' app/src/main/java/com/alakad/smsforwarder/SmsReceiver.kt
          grep -q 'bookingAlertsSwitch' app/src/main/res/layout/activity_settings.xml
          grep -q 'bookingSoundSwitch' app/src/main/res/layout/activity_settings.xml
          grep -q 'bookingFullScreenSwitch' app/src/main/res/layout/activity_settings.xml
          grep -q 'fullScreenAccessButton' app/src/main/res/layout/activity_settings.xml
          grep -q 'canUseFullScreenIntent' app/src/main/java/com/alakad/smsforwarder/SettingsActivity.kt
          grep -q 'EkshefDoctorMapper.replaceClinicNumber' app/src/main/java/com/alakad/smsforwarder/SmsReceiver.kt
          grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_SMS' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml
          test -s app/stable-release.jks

      - name: Build installable APK
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.5-Booking-Alert.apk"
          sha256sum "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.5-Booking-Alert.apk" > "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.5-Booking-Alert.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagz-AlHalat-v2.5-Booking-Alert
          path: |
            Hagz-AlHalat-v2.5-Booking-Alert.apk
            Hagz-AlHalat-v2.5-Booking-Alert.sha256
          retention-days: 30
