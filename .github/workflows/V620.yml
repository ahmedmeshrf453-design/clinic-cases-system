      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: V6.2 feature gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          main=Path("src/main.ts").read_text(encoding="utf-8")
          rust=Path("src-tauri/src/lib.rs").read_text(encoding="utf-8")
          css=Path("src/style.css").read_text(encoding="utf-8")
          conf=json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          for term in [
            "type LabOrder =",
            "finalize_lab_order",
            "حفظ وإنهاء الحالة",
            "المدفوع يدويًا",
            "متبقي التحاليل",
            "PDF للطباعة",
            "function labOrderRowsHtml",
            "exportTodayCombined",
          ]:
            assert term in main, term
          for term in [
            "CREATE TABLE IF NOT EXISTS lab_orders",
            "CREATE TABLE IF NOT EXISTS lab_order_items",
            "fn finalize_lab_order(",
            "fn list_lab_orders(",
            "fn get_lab_order(",
            "today_visits: today_visits + today_lab_orders",
          ]:
            assert term in rust, term
          for term in [
            "/* V6.2 lab orders, payments and accounting */",
            ".lab-payment-panel",
            ".lab-order-money-grid",
          ]:
            assert term in css, term
          assert conf["version"]=="6.2.0"
          print("V6.2 feature gate passed")
          PY

      - name: Build V6.2 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          if ($installer.Length -lt 1000000) { throw "Setup EXE is unexpectedly small" }

      - name: Commit validated V6.2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/src/lib.rs src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V6.2: lab orders payments accounting and exports"
            git push
          fi

      - name: Upload V6.2 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V6.2-Lab-Orders-Accounting
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
