      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Validate frontend
        shell: bash
        run: npm run build

      - name: Validate Rust
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Security configuration gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          conf = json.loads(Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          cap = json.loads(Path('src-tauri/capabilities/default.json').read_text(encoding='utf-8'))
          main = Path('src/main.ts').read_text(encoding='utf-8')
          lib = Path('src-tauri/src/lib.rs').read_text(encoding='utf-8')

          assert conf['app']['security']['csp'], 'CSP must be enabled'
          assert conf['app']['windows'][0].get('devtools') is False, 'DevTools must be disabled'
          assert conf['app']['windows'][0].get('generalAutofillEnabled') is False, 'Autofill must be disabled'
          assert 'dialog:allow-save' in cap['permissions'], 'Save dialog permission missing'
          assert '@tauri-apps/plugin-dialog' in Path('package.json').read_text(encoding='utf-8')
          assert 'targetPath' in main and 'saveDialog' in main
          assert 'MAX_EXPORT_BYTES' in lib
          assert 'source.starts_with(&backup_root)' in lib
          assert 'trusted_schema=OFF' in lib
          print('Security gate passed')
          PY

      - name: Build V4.5 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify Setup EXE
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer:" $installer.FullName

      - name: Commit validated V4.5 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src-tauri/src/lib.rs src-tauri/capabilities/default.json src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V4.5: native Save As and security hardening"
            git push
          fi

      - name: Upload V4.5 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V4.5-Save-As-Security-Installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
