      - name: Verify V1.5 configuration
        shell: bash
        working-directory: ${{ runner.temp }}/smsapp
        run: |
          set -euo pipefail
          grep -q 'android.permission.RECEIVE_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionName = "1.5.0"' app/build.gradle.kts
          test -s app/stable-release.jks
          grep -q 'Vezeeta.com' README.md
          grep -q 'CliniDo' README.md
          grep -q 'ekshef' README.md
          grep -q 'Sms.Inbox.CONTENT_URI' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'سحب الرسائل الموجودة' app/src/main/res/layout/activity_main.xml
          grep -q 'com.whatsapp.w4b' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt

      - name: Build signed installable APK
        shell: bash
        working-directory: ${{ runner.temp }}/smsapp
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/SMS-WhatsApp-Forwarder-v1.5-History-Business.apk"
          sha256sum "$GITHUB_WORKSPACE/SMS-WhatsApp-Forwarder-v1.5-History-Business.apk" > "$GITHUB_WORKSPACE/SMS-WhatsApp-Forwarder-v1.5-History-Business.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMS-WhatsApp-Forwarder-v1.5-History-Business
          path: |
            SMS-WhatsApp-Forwarder-v1.5-History-Business.apk
            SMS-WhatsApp-Forwarder-v1.5-History-Business.sha256
          retention-days: 30
