name: Clinic Cases V7.0 Daily Simple FIX10

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Daily Simple FIX10
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix10.b64"
          python - "$RUNNER_TEMP/fix10.b64" <<'PY'
          import base64
          import pathlib
          import sys
          payload = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          exec(base64.b64decode(payload).decode("utf-8"))
          PY

      - name: Verify FIX10 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          m=Path("src/main.ts").read_text(encoding="utf-8")
          r=Path("src-tauri/src/lib.rs").read_text(encoding="utf-8")
          c=Path("src/style.css").read_text(encoding="utf-8")
          terms=[
            "quick_note TEXT NOT NULL DEFAULT",
            "deleted_at TEXT NOT NULL DEFAULT",
            "update_patient_quick_note",
            "list_deleted_patients",
            "restore_deleted_patient",
            "purge_deleted_patient",
            "open_patient_contact",
            "duplicatePatientAlert",
            "patient-pinned-note",
            "patientCallBtn",
            "patientWhatsappBtn",
            "patientCopyPhoneBtn",
            "patient-quick-status-strip",
            "سلة المحذوفات",
            "globalRefreshBtn",
            "ملخص نهاية اليوم",
            "V7.0 FIX10 simple daily usability",
          ]
          missing=[x for x in terms if x not in m+r+c]
          assert not missing, missing
          print("FIX10 source gates passed")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 80000000) { throw "Offline installer missing or setup too small" }

      - name: Upload FIX10 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.0-Daily-Simple-FIX10
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Commit validated FIX10 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/src/lib.rs
          if git diff --cached --quiet; then
            echo "No FIX10 changes to commit"
          else
            git commit -m "V7.0 FIX10: simple daily clinic improvements"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
