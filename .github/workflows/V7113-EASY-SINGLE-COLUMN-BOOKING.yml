name: Clinic Cases V7.1.13 Easy Booking Form

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V7.1.13 easy booking UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          main_p=Path('src/main.ts')
          css_p=Path('src/style.css')
          tauri_p=Path('src-tauri/tauri.conf.json')
          cargo_p=Path('src-tauri/Cargo.toml')
          lock_p=Path('src-tauri/Cargo.lock')
          pkg_p=Path('package.json')
          pkglock_p=Path('package-lock.json')

          m=main_p.read_text(encoding='utf-8')
          c=css_p.read_text(encoding='utf-8')

          tauri=json.loads(tauri_p.read_text(encoding='utf-8'))
          tauri['version']='7.1.13'
          tauri_p.write_text(json.dumps(tauri,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          pkg=json.loads(pkg_p.read_text(encoding='utf-8'))
          pkg['version']='7.1.13'
          pkg_p.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          pl=pkglock_p.read_text(encoding='utf-8')
          pl=re.sub(r'("version"\s*:\s*")7\.1\.\d+(")',r'\g<1>7.1.13\2',pl,count=2)
          pkglock_p.write_text(pl,encoding='utf-8')

          cg=cargo_p.read_text(encoding='utf-8')
          cg=re.sub(r'(?m)^version\s*=\s*"7\.1\.\d+"\s*$', 'version = "7.1.13"', cg, count=1)
          cargo_p.write_text(cg,encoding='utf-8')

          cl=lock_p.read_text(encoding='utf-8')
          cl=re.sub(r'(name\s*=\s*"clinic-cases-system"\s*\nversion\s*=\s*")7\.1\.\d+(")',r'\g<1>7.1.13\2',cl,count=1)
          lock_p.write_text(cl,encoding='utf-8')

          m=m.replace('<div class="section-title">بيانات الحالة</div>','<div class="section-title specialty-step-title"><span>1</span> بيانات الحالة</div>',1)
          m=m.replace('<div class="section-title">بيانات الحجز</div>','<div class="section-title specialty-step-title"><span>2</span> بيانات الحجز</div>',1)
          m=m.replace('<label class="name">الاسم بالكامل<input name="fullName" required autocomplete="off"></label>','<label class="name">الاسم بالكامل <b class="required-star">*</b><input name="fullName" required autocomplete="off" placeholder="اكتب اسم المريض بالكامل"></label>',1)
          m=m.replace('<label>السن<input name="age" type="number" min="0" max="130" required></label>','<label>السن <b class="required-star">*</b><input name="age" type="number" min="0" max="130" required placeholder="مثال: 35"></label>',1)
          m=m.replace('<label>رقم الموبايل<input name="phone" class="ltr" inputmode="tel" required autocomplete="off"></label>','<label>رقم الموبايل <b class="required-star">*</b><input name="phone" class="ltr" inputmode="tel" required autocomplete="off" placeholder="01xxxxxxxxx"></label>',1)
          m=m.replace('<label>نوع الزيارة<select name="visitType" id="specialtyBookingType">','<label>نوع الزيارة <b class="required-star">*</b><select name="visitType" id="specialtyBookingType">',1)
          m=m.replace('<div class="form-actions"><button type="button" class="btn ghost" id="cancelSpecialtyBooking">إلغاء</button><button class="btn primary">✓ حفظ الحجز</button></div>','<div class="specialty-booking-help">راجع البيانات ثم اضغط حفظ الحجز.</div><div class="form-actions specialty-booking-actions"><button type="button" class="btn ghost" id="cancelSpecialtyBooking">إلغاء</button><button class="btn primary">✓ حفظ الحجز</button></div>',1)
          m=re.sub(r'V7\.1\.\d+ • [^<]+','V7.1.13 • EASY SINGLE-COLUMN BOOKING',m,count=1)
          main_p.write_text(m,encoding='utf-8')

          if 'V7.1.13 EASY SINGLE COLUMN BOOKING' not in c:
              c += r'''

          /* ===== V7.1.13 EASY SINGLE COLUMN BOOKING ===== */
          .specialty-booking-modal{
            max-width:560px!important;
            width:min(560px,calc(100vw - 30px))!important;
            max-height:90vh!important;
            overflow:auto!important;
          }
          .specialty-booking-modal .modal-head{
            position:sticky!important;
            top:0!important;
            z-index:5!important;
            background:#fff!important;
            padding-bottom:12px!important;
            border-bottom:1px solid #e4edf3!important;
          }
          .specialty-booking-modal .modal-head h2{font-size:22px!important;margin:0!important}
          .specialty-booking-modal .modal-head p{font-size:12px!important;margin-top:3px!important}
          .specialty-booking-modal #specialtyBookingForm{display:grid!important;gap:12px!important}
          .specialty-booking-modal .specialty-step-title{
            display:flex!important;align-items:center!important;gap:8px!important;
            margin:4px 0 0!important;font-size:17px!important;font-weight:900!important;color:#153c5b!important
          }
          .specialty-booking-modal .specialty-step-title span{
            display:inline-grid!important;place-items:center!important;width:28px!important;height:28px!important;
            border-radius:9px!important;background:#123b5c!important;color:#fff!important;font-size:14px!important
          }
          .specialty-booking-modal .specialty-booking-form-grid{
            display:grid!important;grid-template-columns:1fr!important;gap:10px!important;margin-bottom:2px!important
          }
          .specialty-booking-modal .specialty-booking-form-grid .name{grid-column:auto!important}
          .specialty-booking-modal .specialty-booking-form-grid label{
            display:grid!important;gap:6px!important;font-size:13px!important;font-weight:800!important;color:#4d697c!important
          }
          .specialty-booking-modal .specialty-booking-form-grid input,
          .specialty-booking-modal .specialty-booking-form-grid select{
            width:100%!important;height:48px!important;min-height:48px!important;border:1px solid #cfdde7!important;
            border-radius:12px!important;padding:0 13px!important;background:#fff!important;color:#153650!important;
            font-size:15px!important;box-sizing:border-box!important
          }
          .specialty-booking-modal .specialty-booking-form-grid input:focus,
          .specialty-booking-modal .specialty-booking-form-grid select:focus{
            outline:none!important;border-color:#4aa8d7!important;box-shadow:0 0 0 3px rgba(74,168,215,.12)!important
          }
          .specialty-booking-modal .required-star{color:#c0392b!important;font-weight:900!important}
          .specialty-booking-modal .specialty-duplicate-alert{margin:0!important;padding:11px 12px!important;font-size:12px!important}
          .specialty-booking-help{
            background:#f4f8fb!important;border:1px solid #dbe7ef!important;border-radius:11px!important;
            padding:9px 11px!important;color:#698091!important;font-size:12px!important
          }
          .specialty-booking-actions{
            position:sticky!important;bottom:0!important;z-index:4!important;background:#fff!important;
            padding-top:10px!important;border-top:1px solid #e5edf2!important
          }
          .specialty-booking-actions .btn{min-height:44px!important}
          @media(max-width:620px){
            .specialty-booking-modal{width:calc(100vw - 18px)!important;max-height:94vh!important}
          }
          '''
          css_p.write_text(c,encoding='utf-8')
          print('V7.1.13 single-column booking form applied')
          PY

      - name: Verify V7.1.13
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          m=Path('src/main.ts').read_text(encoding='utf-8')
          c=Path('src/style.css').read_text(encoding='utf-8')
          t=json.loads(Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          checks={
           'version':t.get('version')=='7.1.13',
           'step1':'<span>1</span> بيانات الحالة' in m,
           'step2':'<span>2</span> بيانات الحجز' in m,
           'single_column':'grid-template-columns:1fr!important' in c,
           'large_inputs':'height:48px!important' in c,
           'marker':'V7.1.13 EASY SINGLE COLUMN BOOKING' in c,
          }
          for k,v in checks.items(): print(k,'OK' if v else 'FAIL')
          assert all(checks.values()),checks
          print('V7.1.13 verification passed')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "NSIS build attempt $attempt/3"
            if npx tauri build --bundles nsis; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1

      - name: Verify installer
        shell: pwsh
        run: |
          $i=Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" |
            Where-Object { $_.Name -match "7\.1\.13" } |
            Select-Object -First 1
          if(-not $i){throw "V7.1.13 installer missing"}
          if($i.Length -lt 80000000){throw "Installer too small"}

      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.1.13-Easy-Single-Column-Booking
          path: src-tauri/target/release/bundle/nsis/*7.1.13*-setup.exe
          if-no-files-found: error

      - name: Commit validated V7.1.13
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "V7.1.13: simplify specialty booking form"; fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
