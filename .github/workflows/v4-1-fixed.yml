          ntXaeHrAYR8VTIjE6zQ7UKqcV3GlR/IBiub0i2xtwK6/TbdlVTt4+tS2bLQ2rNRwK27dcLxWTbIQc4rYt/u1LGWFB4qQA4pi9qlH
          SkB//9k=
          LOGOEOF
          tr -d '\r\n ' < _full_ak.b64 > _full_ak.clean.b64

          python - <<'PY'
          import base64
          from collections import deque
          from pathlib import Path
          from PIL import Image

          raw = base64.b64decode(Path("_full_ak.clean.b64").read_text())
          Path("_full_ak.jpg").write_bytes(raw)

          src = Image.open("_full_ak.jpg").convert("RGBA")
          w, h = src.size
          px = src.load()

          # Remove only the light background connected to the image edges.
          seen = set()
          q = deque()

          def is_bg(x, y):
              r, g, b, a = px[x, y]
              return a > 0 and r >= 220 and g >= 220 and b >= 220 and (max(r,g,b)-min(r,g,b) <= 30)

          for x in range(w):
              for y in (0, h-1):
                  if is_bg(x, y):
                      q.append((x, y)); seen.add((x, y))
          for y in range(h):
              for x in (0, w-1):
                  if is_bg(x, y) and (x, y) not in seen:
                      q.append((x, y)); seen.add((x, y))

          while q:
              x, y = q.popleft()
              r, g, b, a = px[x, y]
              px[x, y] = (r, g, b, 0)
              for nx, ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                  if 0 <= nx < w and 0 <= ny < h and (nx, ny) not in seen and is_bg(nx, ny):
                      seen.add((nx, ny))
                      q.append((nx, ny))

          alpha = src.getchannel("A")
          bbox = alpha.getbbox()
          if not bbox:
              raise SystemExit("Transparent logo extraction failed")
          emblem = src.crop(bbox)

          # Transparent square asset for header + watermark, with safe margins.
          square = Image.new("RGBA", (1024, 1024), (255,255,255,0))
          fit = emblem.copy()
          fit.thumbnail((900, 900), Image.Resampling.LANCZOS)
          x = (1024 - fit.width) // 2
          y = (1024 - fit.height) // 2
          square.paste(fit, (x, y), fit)
          square.save("public/clinic-logo-emblem.png", optimize=True)

          # Same complete emblem in the Windows ICO; no clipping.
          icon = Image.new("RGBA", (256, 256), (255,255,255,0))
          fit2 = emblem.copy()
          fit2.thumbnail((220, 220), Image.Resampling.LANCZOS)
          x2 = (256 - fit2.width) // 2
          y2 = (256 - fit2.height) // 2
          icon.paste(fit2, (x2, y2), fit2)
          icon.save(
              "src-tauri/icons/icon.ico",
              sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)]
          )
          PY

          test -s public/clinic-logo-emblem.png
          test -s src-tauri/icons/icon.ico

