      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Validate frontend
        shell: bash
        run: npm run build

      - name: Validate Rust
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build V4.1 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify Setup EXE
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer:" $installer.FullName

      - name: Commit validated V4.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/style.css src-tauri/src/main.rs src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml public/clinic-logo-emblem.png src-tauri/icons/icon.ico
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V4.1: full AK icon and visible watermark"
            git push
          fi

      - name: Upload V4.1 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V4.1-Full-Logo-Watermark-Installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
