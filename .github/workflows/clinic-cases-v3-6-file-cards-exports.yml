      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Validate frontend
        shell: bash
        run: npm run build

      - name: Validate Rust
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build V3.6 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify Setup EXE
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer:" $installer.FullName

      - name: Commit validated V3.6 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/src/lib.rs package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V3.6: patient file cards, watermark and PDF image exports"
            git push
          fi

      - name: Upload V3.6 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V3.6-File-Cards-Exports-Installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
