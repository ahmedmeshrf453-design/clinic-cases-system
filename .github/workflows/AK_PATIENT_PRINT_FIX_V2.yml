name: AK Patient Print Fix V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/AK_PATIENT_PRINT_FIX_V2.yml'

permissions:
  contents: write

concurrency:
  group: ak-patient-print-fix-v2
  cancel-in-progress: false

jobs:
  fix-and-package:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Apply targeted print correction
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          
          main_path = Path('src/main.ts')
          css_path = Path('src/style.css')
          main_source = main_path.read_text(encoding='utf-8')
          css_source = css_path.read_text(encoding='utf-8')
          
          start_marker = 'function patientExportSheet(title: string, subtitle: string, body: string) {'
          end_marker = 'function buildPatientQrPayload(details: PatientDetails) {'
          assert start_marker in main_source and end_marker in main_source, 'Patient print section not found'
          start = main_source.index(start_marker)
          end = main_source.index(end_marker, start)
          section = main_source[start:end]
          
          old_header = '<div>\n          <div class="patient-print-slogan">'
          new_header = '<div class="patient-print-brand-copy">\n          <div class="patient-print-clinic-name">${esc(appSettings.clinicName)}</div>\n          <div class="patient-print-slogan">'
          old_whatsapp = '<span class="patient-print-footer-badge wa">WA</span>'
          old_phone = '<span class="patient-print-footer-badge phone">☎</span>'
          
          if 'patient-print-clinic-name' not in section:
              assert section.count(old_header) == 1, 'Print header changed; stop without altering source'
              assert section.count(old_whatsapp) == 1 and section.count(old_phone) == 1, 'Print contact icons changed; stop'
              section = section.replace(old_header, new_header, 1)
              section = section.replace(old_whatsapp, '<span>واتساب</span>', 1)
              section = section.replace(old_phone, '<span>تليفون</span>', 1)
              main_path.write_text(main_source[:start] + section + main_source[end:], encoding='utf-8')
          else:
              print('Print header already fixed; keeping it unchanged')
          
          css_marker = '/* AK_PATIENT_PRINT_HEADER_FOOTER_FIX_20261014 */'
          css_rules = [
              '.patient-export-document .patient-print-brand-copy{display:grid;gap:6px;justify-items:center;text-align:center}',
              '.patient-export-document .patient-print-clinic-name{margin-top:12px;font-size:28px;line-height:1.35;font-weight:900;color:#0a2342}',
              '.patient-export-document .patient-print-slogan{margin-top:2px;font-size:24px;line-height:1.3;font-weight:900;color:#087f8a}',
              '.patient-export-document .patient-print-address{margin-top:4px;max-width:820px;font-size:14px;line-height:1.9;font-weight:700;color:#5f7686}',
              '.patient-export-document .patient-export-title h2{font-size:31px;line-height:1.35;font-weight:900}',
              '.patient-export-document .patient-export-title p{font-size:18px;line-height:1.7;font-weight:800}',
              '.patient-export-document .patient-print-footer{gap:28px}',
              '.patient-export-document .patient-print-footer-item{gap:8px}',
              '.patient-export-document .patient-print-footer-item span{font-size:12px;font-weight:900;color:#738698}',
              '.patient-export-document .patient-print-footer-item strong{font-size:18px;color:#0a2342}',
              '.patient-export-document .patient-file-event.created{display:none!important}',
          ]
          if css_marker not in css_source:
              css_path.write_text(css_source.rstrip() + '\n\n' + css_marker + '\n' + '\n'.join(css_rules) + '\n', encoding='utf-8')
          else:
              print('Print CSS already fixed; keeping it unchanged')
          
          final_main = main_path.read_text(encoding='utf-8')
          final_css = css_path.read_text(encoding='utf-8')
          final_section = final_main[final_main.index(start_marker):final_main.index(end_marker)]
          assert 'patient-print-clinic-name' in final_section
          assert '<span>واتساب</span>' in final_section and '<span>تليفون</span>' in final_section
          assert css_marker in final_css and '.patient-export-document .patient-file-event.created{display:none!important}' in final_css
          print('PASS: Targeted print-export fix applied or already present.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Print correction Python script failed' }
      - name: Verify changed files
        shell: pwsh
        run: |
          git add -- src/main.ts src/style.css
          $changed = @(git diff --cached --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin @('src/main.ts', 'src/style.css') })
          if ($unexpected.Count -gt 0) { throw "Unexpected files: $($unexpected -join ', ')" }
          if (-not (Select-String -Path src/main.ts -Pattern 'patient-print-clinic-name' -Quiet)) { throw 'Clinic print name absent' }
          if (-not (Select-String -Path src/style.css -Pattern 'AK_PATIENT_PRINT_HEADER_FOOTER_FIX_20261014' -Quiet)) { throw 'CSS fix absent' }
          Write-Host 'PASS: only intended print-export files changed'
      - name: Install packages and test frontend build
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'UI build failed' }
      - name: Build Windows EXE installer
        shell: pwsh
        run: |
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Windows NSIS build failed' }
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -File -Filter '*.exe')
          if ($files.Count -ne 1) { throw "Expected exactly one installer; found $($files.Count)" }
          Copy-Item -LiteralPath $files[0].FullName -Destination 'Clinic-Cases-Windows-Setup.exe'
          $hash = (Get-FileHash 'Clinic-Cases-Windows-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Clinic-Cases-Windows-Setup.exe" | Set-Content 'Clinic-Cases-Windows-Setup.exe.sha256' -Encoding ascii
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-Setup
          path: |
            Clinic-Cases-Windows-Setup.exe
            Clinic-Cases-Windows-Setup.exe.sha256
          retention-days: 30
      - name: Commit correction after successful build
        shell: pwsh
        run: |
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Changes already committed'; exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix patient print header footer and file creation row'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
          git rebase origin/main
          if ($LASTEXITCODE -ne 0) { throw 'git rebase failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "ak-patient-print-header-fix-$($env:GITHUB_RUN_ID)"
          gh release create $tag 'Clinic-Cases-Windows-Setup.exe' 'Clinic-Cases-Windows-Setup.exe.sha256' --target main --title 'Clinic Cases - Patient Print Header Fix' --notes 'Patient file printing: larger header and address, clinic name, footer contact labels, no creation event in print. Unrelated data and workflows unchanged.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
          "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Clinic-Cases-Windows-Setup.exe" >> $env:GITHUB_STEP_SUMMARY
