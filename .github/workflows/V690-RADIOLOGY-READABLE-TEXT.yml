      - name: Verify Lab2Lab catalogs untouched
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/labCatalog.sha256"
          sha256sum -c "$RUNNER_TEMP/lab2labCatalog.sha256"
          sha256sum -c "$RUNNER_TEMP/lab2labArabic.sha256"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: V6.9.0 feature gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          main = Path("src/main.ts").read_text(encoding="utf-8")
          css = Path("src/style.css").read_text(encoding="utf-8")
          rust = Path("src-tauri/src/lib.rs").read_text(encoding="utf-8")
          pkg = json.loads(Path("package.json").read_text(encoding="utf-8"))
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          assert pkg["version"] == "6.9.0"
          assert conf["version"] == "6.9.0"
          for term in [
              "type RadiologyOrder", "'radiology'", "renderRadiologyServices",
              "openRadiologyPatientRegistrationModal", "openPatientRadiologyPanel",
              "patientRadiologyServices", "list_patient_radiology_orders",
              "add_radiology_order", "اسم الأشعة", "اسم المركز", "نسبة الخصم",
              "radiologyPatientsToday"
          ]:
              assert term in main, term
          for term in [
              "struct RadiologyOrderInput", "struct RadiologyOrder",
              "CREATE TABLE IF NOT EXISTS radiology_orders", "add_radiology_order",
              "get_radiology_order", "list_radiology_orders",
              "list_patient_radiology_orders", "idx_radiology_orders_patient"
          ]:
              assert term in rust, term
          assert "V6.9.0 readable text + radiology" in css
          assert "font-size:16px !important" in css
          print("V6.9.0 feature gate passed")
          PY

      - name: Build V6.9.0 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 80000000) { throw "Offline WebView2 installer missing or setup too small" }

      - name: Upload V6.9.0 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V6.9.0-Radiology-Readable-Text
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Commit validated V6.9.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main.ts src/style.css src-tauri/src/lib.rs package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true

          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V6.9.0: radiology service and readable UI text"
          fi

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
