      - name: Verify phone date time fix and offline mode
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionCode = 28' app/build.gradle.kts
          grep -q 'versionName = "2.8.0"' app/build.gradle.kts
          grep -q 'object BookingDateResolver' app/src/main/java/com/alakad/smsforwarder/BookingDateResolver.kt
          grep -q 'TimeZone.getDefault()' app/src/main/java/com/alakad/smsforwarder/BookingDateResolver.kt
          grep -q 'compact.contains("اليوم")' app/src/main/java/com/alakad/smsforwarder/BookingDateResolver.kt
          grep -q 'inferNearestShortDate' app/src/main/java/com/alakad/smsforwarder/BookingDateResolver.kt
          grep -q 'BookingDateResolver.bookingDateKey' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'BookingDateResolver.bookingDateKey' app/src/main/java/com/alakad/smsforwarder/ReportEngine.kt
          grep -q 'android.intent.action.DATE_CHANGED' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_SMS' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml
          python3 - <<'PY2'
          import datetime
          assert datetime.date(2026, 10, 2).strftime('%A') == 'Friday'
          print('02/10/2026 = Friday')
          PY2
          test -s app/stable-release.jks

      - name: Build installable APK
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.8-Phone-Date-Time-Fix.apk"
          sha256sum "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.8-Phone-Date-Time-Fix.apk" > "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.8-Phone-Date-Time-Fix.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagz-AlHalat-v2.8-Phone-Date-Time-Fix
          path: |
            Hagz-AlHalat-v2.8-Phone-Date-Time-Fix.apk
            Hagz-AlHalat-v2.8-Phone-Date-Time-Fix.sha256
          retention-days: 30
