name: Clinic Cases V7.1.19D Icons Only Safe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply hologram specialties icons only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re, base64

          main_p=Path('src/main.ts')
          css_p=Path('src/style.css')
          tauri_p=Path('src-tauri/tauri.conf.json')
          cargo_p=Path('src-tauri/Cargo.toml')
          lock_p=Path('src-tauri/Cargo.lock')
          pkg_p=Path('package.json')
          pkglock_p=Path('package-lock.json')
          public_dir=Path('public/holograms')
          public_dir.mkdir(parents=True, exist_ok=True)

          assets = {
              'urology.webp': '',
              'internal.webp': '',
              'ortho.webp': '',
              'surgery.webp': '',
              'eye.webp': '',
              'neuro.webp': '',
              'obgyn.webp': '',
              'ent.webp': '',
              'nutrition.webp': '',
              'vascular.webp': '',
          }

          for filename, data in assets.items():
              (public_dir/filename).write_bytes(base64.b64decode(data))

          m=main_p.read_text(encoding='utf-8')
          c=css_p.read_text(encoding='utf-8')
          icon_map="const HOME_SPECIALTY_ICON_SRC:Record<string,string>={\n  urology:'/holograms/urology.webp',\n  internal:'/holograms/internal.webp',\n  ortho:'/holograms/ortho.webp',\n  surgery:'/holograms/surgery.webp',\n  eye:'/holograms/eye.webp',\n  neuro:'/holograms/neuro.webp',\n  obgyn:'/holograms/obgyn.webp',\n  ent:'/holograms/ent.webp',\n  nutrition:'/holograms/nutrition.webp',\n  vascular:'/holograms/vascular.webp',\n  audiology:'/holograms/ent.webp'\n};\n\nfunction homeSpecialtyIconSrc(key:string){return HOME_SPECIALTY_ICON_SRC[key]||'/holograms/internal.webp'}\n"
          old_card='      ${orderedSpecialties.map(x=>`<button class="specialty-card home-sortable-card" data-specialty-home="${x.key}" data-order-id="${x.key}" type="button" draggable="true">\n        <span class="specialty-card-drag" title="اسحب لتغيير الترتيب">⋮⋮</span>\n        <span class="specialty-card-icon photo-sprite-tile ${x.iconClass}"></span>\n        <span class="specialty-card-copy"><strong>${x.label}</strong><small>${doctors.filter(d=>d.active&&specialtyMatches(x.key,d.specialty)).length} طبيب • ${count(x.key)} حالة اليوم</small></span>\n        <span class="specialty-card-arrow">←</span>\n      </button>`).join(\'\')}'
          new_card='      ${orderedSpecialties.map(x=>`<button class="specialty-card home-sortable-card hologram-specialty-card" data-specialty-home="${x.key}" data-order-id="${x.key}" type="button" draggable="true">\n        <span class="specialty-card-drag" title="اسحب لتغيير الترتيب">⋮⋮</span>\n        <span class="specialty-card-icon specialty-hologram-icon"><img src="${homeSpecialtyIconSrc(x.key)}" alt="${esc(x.label)}"></span>\n        <span class="specialty-card-copy"><strong>${x.label}</strong><small>${doctors.filter(d=>d.active&&specialtyMatches(x.key,d.specialty)).length} طبيب • ${count(x.key)} حالة اليوم</small></span>\n        <span class="specialty-card-arrow">←</span>\n      </button>`).join(\'\')}'
          css_append='\n\n/* ===== V7.1.19 HOLOGRAM SPECIALTY ICONS ONLY ===== */\n.hologram-specialty-card{position:relative!important;grid-template-columns:1fr!important;grid-auto-rows:auto!important;justify-items:center!important;align-items:center!important;text-align:center!important;gap:8px!important;padding:14px 12px 12px!important;min-height:210px!important;background:#fff!important}\n.hologram-specialty-card .specialty-card-drag{position:absolute!important;top:10px!important;left:12px!important;right:auto!important;align-self:auto!important;padding-top:0!important;letter-spacing:-2px!important}\n.hologram-specialty-card .specialty-card-icon{width:114px!important;height:114px!important;min-width:114px!important;min-height:114px!important;border:none!important;background:transparent!important;box-shadow:none!important;border-radius:0!important;margin:8px auto 2px!important;display:grid!important;place-items:center!important}\n.hologram-specialty-card .specialty-card-icon img{width:100%!important;height:100%!important;object-fit:contain!important;display:block!important;filter:drop-shadow(0 12px 24px rgba(0,163,255,.18))}\n.hologram-specialty-card .specialty-card-copy{display:flex!important;flex-direction:column!important;align-items:center!important;gap:4px!important;text-align:center!important}\n.hologram-specialty-card .specialty-card-copy strong{font-size:18px!important;line-height:1.25!important;color:#173650!important}\n.hologram-specialty-card .specialty-card-copy small{margin-top:0!important;font-size:10px!important;line-height:1.5!important;color:#83929d!important}\n.hologram-specialty-card .specialty-card-arrow{margin-top:2px!important;align-self:center!important}\n'

          anchor="const HOME_SERVICE_ORDER_KEY=\'clinicCases.home.services.v7110\';\n"
          if icon_map not in m:
              if anchor not in m:
                  raise SystemExit('home order key anchor not found')
              m=m.replace(anchor, anchor+'\n'+icon_map, 1)
          if old_card not in m:
              raise SystemExit('specialty card template not found')
          m=m.replace(old_card,new_card,1)
          m=re.sub(r'V7\.1\.18[^<\n]*','V7.1.19 • HOLOGRAM SPECIALTY ICONS ONLY',m,count=1)
          main_p.write_text(m,encoding='utf-8')

          marker='/* ===== V7.1.19 HOLOGRAM SPECIALTY ICONS ONLY ===== */'
          if marker not in c:
              c += css_append
          css_p.write_text(c,encoding='utf-8')

          tauri=json.loads(tauri_p.read_text(encoding='utf-8'))
          tauri['version']='7.1.19'
          tauri_p.write_text(json.dumps(tauri,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          pkg=json.loads(pkg_p.read_text(encoding='utf-8'))
          pkg['version']='7.1.19'
          pkg_p.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          pl=pkglock_p.read_text(encoding='utf-8')
          pl,n=re.subn(r'("version"\s*:\s*")7\.1\.18(")',r'\g<1>7.1.19\2',pl,count=2)
          if n != 2:
              raise SystemExit(f'package-lock version replacements failed: {n}')
          pkglock_p.write_text(pl,encoding='utf-8')

          cg=cargo_p.read_text(encoding='utf-8')
          cg,n=re.subn(r'(?m)^version\s*=\s*"7\.1\.18"\s*$', 'version = "7.1.19"', cg, count=1)
          if n != 1:
              raise SystemExit('Cargo.toml version not updated')
          cargo_p.write_text(cg,encoding='utf-8')

          cl=lock_p.read_text(encoding='utf-8')
          cl,n=re.subn(r'(name\s*=\s*"clinic-cases-system"\s*\nversion\s*=\s*")7\.1\.18(")',r'\g<1>7.1.19\2',cl,count=1)
          if n != 1:
              raise SystemExit('Cargo.lock version not updated')
          lock_p.write_text(cl,encoding='utf-8')
          print('V7.1.19 icons-only patch applied')
          PY
      - name: Verify V7.1.19 icons-only patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          m=Path('src/main.ts').read_text(encoding='utf-8')
          c=Path('src/style.css').read_text(encoding='utf-8')
          t=json.loads(Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          checks={
            'version': t.get('version')=='7.1.19',
            'icon map': 'HOME_SPECIALTY_ICON_SRC' in m,
            'img tag': 'specialty-hologram-icon' in m and 'homeSpecialtyIconSrc(x.key)' in m,
            'css marker': 'V7.1.19 HOLOGRAM SPECIALTY ICONS ONLY' in c,
            'asset internal': Path('public/holograms/internal.webp').exists(),
            'asset surgery': Path('public/holograms/surgery.webp').exists(),
            'service cards untouched': 'clinic-service-card' in c,
          }
          for k,v in checks.items(): print(k, 'OK' if v else 'FAIL')
          assert all(checks.values()), checks
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        shell: bash
        run: npm ci
      - name: Frontend build
        shell: bash
        run: npm run build
      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx tauri build --bundles nsis; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - name: Verify Windows installer
        shell: pwsh
        run: |
          $i=Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Where-Object { $_.Name -match '7\.1\.19' } | Select-Object -First 1
          if(-not $i){throw 'V7.1.19 installer missing'}
          if($i.Length -lt 80000000){throw 'Installer too small'}
      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.1.19D-Icons-Only
          path: src-tauri/target/release/bundle/nsis/*7.1.19*-setup.exe
          if-no-files-found: error
      - name: Commit validated V7.1.19
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts src/style.css public/holograms src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'V7.1.19: hologram specialty icons only'; fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
