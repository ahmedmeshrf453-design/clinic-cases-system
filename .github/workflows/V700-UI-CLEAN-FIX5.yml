name: Clinic Cases V7.0 Patient UI CLEAN FIX5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patient UI CLEAN FIX5
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64; exec(base64.b64decode('').decode('utf-8'))"

      - name: Verify patient UI structure
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; m=Path('src/main.ts').read_text(encoding='utf-8'); c=Path('src/style.css').read_text(encoding='utf-8'); terms=['patient-file-overview-clean','patient-service-grid-clean','patient-file-primary-actions-clean','patient-file-more-actions-clean','patientAttachments','patientLabTests','patientNursingServices','patientRadiologyServices','addVisitToPatient','deletePatient']; [(_ for _ in ()).throw(AssertionError(x)) for x in terms if x not in m+c]; print('Patient UI FIX5 gates passed')"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 80000000) { throw "Offline installer missing or setup too small" }

      - name: Upload UI FIX5 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.0-UI-CLEAN-FIX5
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Commit validated UI FIX5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css
          if git diff --cached --quiet; then
            echo "No UI changes to commit"
          else
            git commit -m "V7.0 FIX5: reorganize patient file UI"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
