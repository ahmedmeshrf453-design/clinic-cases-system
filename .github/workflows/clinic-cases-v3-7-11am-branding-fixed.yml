name: Clinic Cases V3.7 11AM Branding FIXED

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build cropped AK emblem from existing clinic logo
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path("public/clinic-logo-header.jpg")
          if not src.exists():
              raise SystemExit("Existing clinic logo was not found")

          im = Image.open(src).convert("RGB")
          if im.size != (900, 1600):
              # Scale the known crop proportionally if the source size ever changes.
              sx = im.width / 900
              sy = im.height / 1600
              box = (
                  round(72 * sx),
                  round(390 * sy),
                  round(828 * sx),
                  round(923 * sy),
              )
          else:
              box = (72, 390, 828, 923)

          emblem = im.crop(box)
          emblem.save("public/clinic-logo-emblem.png", optimize=True)

          # Windows icon: square canvas, exact emblem centered, no clinic text/tagline.
          icon_source = emblem.copy()
          icon_source.thumbnail((232, 232), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (256, 256), (255, 255, 255, 0))
          x = (256 - icon_source.width) // 2
          y = (256 - icon_source.height) // 2
          canvas.paste(icon_source.convert("RGBA"), (x, y))
          canvas.save("src-tauri/icons/icon.ico", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          PY
          test -s public/clinic-logo-emblem.png
          test -s src-tauri/icons/icon.ico

