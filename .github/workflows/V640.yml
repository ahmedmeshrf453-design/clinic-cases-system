          from pathlib import Path
          import json
          main = Path("src/main.ts").read_text(encoding="utf-8")
          css = Path("src/style.css").read_text(encoding="utf-8")
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          for required in [
              "function serviceDockHtml()",
              'data-service-action="visit"',
              'data-service-action="lab-case"',
              'data-service-action="nursing-case"',
              "data-service-screen",
              "← رجوع",
              "data-delete-patient-card",
              "حذف المريض نهائيًا",
              "data-add-another-lab",
              "إضافة تحليل آخر",
              "labCtxPatient",
              "labCtxVisit",
              "labCtxNursing",
              "nursingCtxPatient",
              "nursingCtxVisit",
              "nursingCtxLabs",
              "archivePatientFromDetails",
              "patientGoToday",
              "patientGoReports",
              "labOrderPatient",
              "nursingOrderPatient",
          ]:
              assert required in main, required

          for required in [
              "/* V6.4 integrated clinic workflow */",
              ".service-dock",
              ".service-dock-btn",
              ".page-back-btn",
              ".modal-back-arrow",
              ".patient-context-links",
              ".lab-add-another",
              ".delete-patient-card",
          ]:
              assert required in css, required

          assert "version: '6.4.0'" in main
          assert conf["version"] == "6.4.0"
          assert conf["bundle"]["windows"]["webviewInstallMode"]["type"] == "offlineInstaller"
          print("V6.4 integration gate passed")
          PY

      - name: Build V6.4 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 80000000) { throw "Offline WebView2 installer missing or setup too small" }

      - name: Commit validated V6.4 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V6.4: integrated navigation and complete patient actions"
            git push
          fi

      - name: Upload V6.4 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V6.4-Integrated-System
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
