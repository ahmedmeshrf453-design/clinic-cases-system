      - name: Verify startup hotfix and offline protection
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionCode = 31' app/build.gradle.kts
          grep -q 'versionName = "3.0.1"' app/build.gradle.kts
          grep -q 'isMinifyEnabled = false' app/build.gradle.kts
          grep -q 'isShrinkResources = false' app/build.gradle.kts
          grep -q 'cachedMainKey' app/src/main/java/com/alakad/smsforwarder/MessageStore.kt
          grep -q 'cachedLegacyKey' app/src/main/java/com/alakad/smsforwarder/MessageStore.kt
          grep -q 'initialLoadFromStore' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'runCatching { DailyReportScheduler.schedule(this) }' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'MAX_MESSAGES = 30_000' app/src/main/java/com/alakad/smsforwarder/MessageStore.kt
          grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_SMS' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml
          test -s app/stable-release.jks

      - name: Build stable release APK
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Hagz-AlHalat-v3.0.1-STARTUP-HOTFIX.apk"
          sha256sum "$GITHUB_WORKSPACE/Hagz-AlHalat-v3.0.1-STARTUP-HOTFIX.apk" > "$GITHUB_WORKSPACE/Hagz-AlHalat-v3.0.1-STARTUP-HOTFIX.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagz-AlHalat-v3.0.1-STARTUP-HOTFIX
          path: |
            Hagz-AlHalat-v3.0.1-STARTUP-HOTFIX.apk
            Hagz-AlHalat-v3.0.1-STARTUP-HOTFIX.sha256
          retention-days: 30
