      - name: Final source hardening checks
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionCode = 30' app/build.gradle.kts
          grep -q 'versionName = "3.0.0"' app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' app/build.gradle.kts
          grep -q 'isShrinkResources = true' app/build.gradle.kts
          grep -q 'MAX_MESSAGES = 30_000' app/src/main/java/com/alakad/smsforwarder/MessageStore.kt
          grep -q 'SQLiteOpenHelper' app/src/main/java/com/alakad/smsforwarder/MessageStore.kt
          grep -q 'setKeySize(256)' app/src/main/java/com/alakad/smsforwarder/MessageStore.kt
          grep -q 'legacy_to_sqlite_v3' app/src/main/java/com/alakad/smsforwarder/MessageStore.kt
          grep -q 'loadByBookingDay' app/src/main/java/com/alakad/smsforwarder/ReportEngine.kt
          grep -q 'dataExtractionRules' app/src/main/AndroidManifest.xml
          grep -q 'fullBackupContent' app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'com.whatsapp.w4b' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.USE_FULL_SCREEN_INTENT' app/src/main/AndroidManifest.xml
          grep -q 'booking_arrivals_v26_sound' app/src/main/java/com/alakad/smsforwarder/SmsReceiver.kt
          grep -q 'updateStatuses' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'deleteMany' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'storageStatus' app/src/main/res/layout/activity_settings.xml
          grep -q 'protectionStatus' app/src/main/res/layout/activity_settings.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml
          test -s app/stable-release.jks

      - name: Build final release APK
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Hagz-AlHalat-v3.0-FINAL-DELIVERY.apk"

      - name: Verify signed release and offline permissions
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/Hagz-AlHalat-v3.0-FINAL-DELIVERY.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/APK-SIGNATURE.txt"
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/APK-BADGING.txt"
          "$AAPT" dump permissions "$APK" | tee "$GITHUB_WORKSPACE/APK-PERMISSIONS.txt"
          grep -q "versionName='3.0.0'" "$GITHUB_WORKSPACE/APK-BADGING.txt"
          grep -q 'android.permission.RECEIVE_SMS' "$GITHUB_WORKSPACE/APK-PERMISSIONS.txt"
          grep -q 'android.permission.READ_SMS' "$GITHUB_WORKSPACE/APK-PERMISSIONS.txt"
          if grep -q 'android.permission.INTERNET' "$GITHUB_WORKSPACE/APK-PERMISSIONS.txt"; then
            echo 'ERROR: INTERNET permission found in final APK' >&2
            exit 1
          fi
          if grep -q 'android.permission.ACCESS_NETWORK_STATE' "$GITHUB_WORKSPACE/APK-PERMISSIONS.txt"; then
            echo 'ERROR: ACCESS_NETWORK_STATE permission found in final APK' >&2
            exit 1
          fi
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/Hagz-AlHalat-v3.0-FINAL-DELIVERY.sha256"
          {
            echo 'Hagz AlHalat V3.0 FINAL DELIVERY'
            echo 'Release build: PASS'
            echo 'APK signature verification: PASS'
            echo 'Offline permission verification: PASS'
            echo 'INTERNET permission: ABSENT'
            echo 'ACCESS_NETWORK_STATE permission: ABSENT'
            echo 'Local encrypted SQLite capacity: 30000 messages'
            echo 'AndroidKeyStore AES-256-GCM: ENABLED'
            echo 'System backup/data transfer of app data: DISABLED'
            echo 'R8 minification/resource shrinking: ENABLED'
          } > "$GITHUB_WORKSPACE/FINAL-VERIFICATION.txt"

      - name: Upload final delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagz-AlHalat-v3.0-FINAL-DELIVERY
          path: |
            Hagz-AlHalat-v3.0-FINAL-DELIVERY.apk
            Hagz-AlHalat-v3.0-FINAL-DELIVERY.sha256
            FINAL-VERIFICATION.txt
            APK-SIGNATURE.txt
            APK-BADGING.txt
            APK-PERMISSIONS.txt
          retention-days: 30
