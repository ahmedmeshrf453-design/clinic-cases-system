      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: V6.3.1 feature gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          main = Path("src/main.ts").read_text(encoding="utf-8")
          css = Path("src/style.css").read_text(encoding="utf-8")
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          start = main.index("async function renderDashboard()")
          end = main.index("async function renderPatients(", start)
          dash = main[start:end]

          for forbidden in [
              "إجمالي المرضى",
              "stats.totalPatients",
              "آخر ملفات المرضى",
              "dashboard-recent-card",
          ]:
              assert forbidden not in dash, forbidden

          for required in [
              "إجمالي تسجيلات اليوم",
              "كشف جديد",
              "استشارة",
              "تحاليل",
              "خدمات تمريض",
              "const totalToday =",
          ]:
              assert required in dash, required

          for required in [
              "let sidebarPatientsTotal = 0;",
              "loadSidebarPatientsTotal",
              "navButton('patients','◉','المرضى', sidebarPatientsTotal)",
              "nav-count",
          ]:
              assert required in main or required in css, required

          assert "version: '6.3.1'" in main
          assert conf["version"] == "6.3.1"
          assert conf["bundle"]["windows"]["webviewInstallMode"]["type"] == "offlineInstaller"
          print("V6.3.1 feature gate passed")
          PY

      - name: Build V6.3.1 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 80000000) { throw "Offline WebView2 installer missing or setup too small" }

      - name: Commit validated V6.3.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V6.3.1: daily dashboard and patient sidebar total"
            git push
          fi

      - name: Upload V6.3.1 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V6.3.1-Daily-Dashboard
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
