name: Clinic V7.1.40 - Archived Finance Integrity
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-and-test:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Fix archived financial history only
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p=Path('src-tauri/src/lib.rs')
          text=p.read_text(encoding='utf-8')
          start=text.index('fn cashier_items_for_range(')
          end=text.index('\n#[tauri::command]',start)
          section=text[start:end]
          original='p.archived=0'
          replacement="COALESCE(p.deleted_at,'')=''"
          count=section.count(original)
          if count!=5:
              raise SystemExit(f'Safety stop: expected 5 archived-only filters, got {count}. No changes saved.')
          section=section.replace(original,replacement)
          assert section.count(replacement)==5
          p.write_text(text[:start]+section+text[end:],encoding='utf-8')
          print('Updated only the five cashier service filters. Archived patients remain excluded from active patient lists.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate patch boundary and frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build offline NSIS Windows installer
        shell: pwsh
        run: |
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer=Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File
          if (-not $installer) { throw 'No NSIS installer produced' }
      - name: Commit tested finance filter fix only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/lib.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Finance: preserve archived patients historical cashier entries'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
