name: Clinic Cases V7.0 PIN Recovery FIX12

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply PIN Recovery FIX12
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/fix12.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix12.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix12.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix12.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix12.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix12.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix12.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix12.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix12.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix12.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix12.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix12.b64"
          python - "$RUNNER_TEMP/fix12.b64" <<'PY'
          import base64, pathlib, sys
          exec(base64.b64decode(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")).decode("utf-8"))
          PY

      - name: Verify FIX12 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          m=Path("src/main.ts").read_text(encoding="utf-8")
          r=Path("src-tauri/src/lib.rs").read_text(encoding="utf-8")
          c=Path("src/style.css").read_text(encoding="utf-8")
          required=[
            "recovery_set: bool","generate_recovery_code_value","verify_security_recovery_value",
            "regenerate_security_recovery","reset_security_pin_with_recovery",
            "reset_lab2lab_pin_with_security_pin","RngCore","recoverySet:boolean",
            "showRecoveryCodeModal","openSecurityRecoveryResetModal","نسيت PIN؟",
            "openForgotLab2LabPinModal","نسيت الرقم السري؟","security_recovery_hash",
            "V7.0 FIX12 PIN recovery"
          ]
          missing=[x for x in required if x not in m+r+c]
          assert not missing, missing
          combined=(m+r+c).lower()
          assert "master_password" not in combined
          assert "sqlcipher" not in combined
          for fn in ["async function renderToday(","async function renderFinance(","async function renderLab2Lab(","async function openPatient(","async function renderBackups("]:
              assert fn in m, fn
          print("FIX12 source gates passed")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          if ($installer.Length -lt 80000000) { throw "Offline installer missing or setup too small" }

      - name: Upload FIX12 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.0-PIN-Recovery-FIX12
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Commit validated FIX12 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/src/lib.rs
          if git diff --cached --quiet; then
            echo "No FIX12 changes to commit"
          else
            git commit -m "V7.0 FIX12: secure PIN recovery"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
