      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend final build check
        shell: bash
        run: npm run build

      - name: Rust final compile check
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Database and validation tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: V5.0 FINAL production gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          lib = Path("src-tauri/src/lib.rs").read_text(encoding="utf-8")
          main = Path("src/main.ts").read_text(encoding="utf-8")
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          pkg = json.loads(Path("package.json").read_text(encoding="utf-8"))

          assert pkg["version"] == "5.0.0"
          assert conf["version"] == "5.0.0"
          assert "version: '5.0.0'" in main

          for term in [
              "PRAGMA synchronous=FULL",
              "PRAGMA integrity_check",
              "PRAGMA quick_check",
              "PRAGMA foreign_key_check",
              "create_safety_backup",
              "before-delete-visit",
              "before-delete-patient",
              "validate_patient_fields",
              "validate_visit_fields",
              "idx_visits_patient_date_time",
              "idx_visits_doctor_date",
              "archived=0,updated_at",
          ]:
              assert term in lib, term

          handler = re.search(
              r"tauri::generate_handler!\[(.*?)\]\)",
              lib,
              flags=re.S
          )
          assert handler, "generate_handler not found"
          assert "save_case" not in handler.group(1), "legacy save_case still exposed"

          assert "windows_subsystem" in Path("src-tauri/src/main.rs").read_text(encoding="utf-8")
          assert conf["app"]["security"]["csp"]
          assert conf["app"]["windows"][0].get("devtools") is False

          print("V5.0 FINAL production gate passed")
          PY

      - name: Build V5.0 FINAL Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify final installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Final Setup EXE was not generated" }
          if ($installer.Length -lt 1000000) { throw "Final Setup EXE is unexpectedly small" }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          Write-Host "Installer:" $installer.FullName
          Write-Host "Size:" $installer.Length
          Write-Host "SHA256:" $hash.Hash

      - name: Commit validated V5.0 FINAL source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src-tauri/src/lib.rs src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true

          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V5.0 FINAL: production hardening and final QA"
            git push
          fi

      - name: Upload V5.0 FINAL installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V5.0-FINAL-Production-Installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
