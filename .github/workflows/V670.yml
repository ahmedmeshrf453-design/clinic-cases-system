      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: V6.7 settings gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          main = Path("src/main.ts").read_text(encoding="utf-8")
          rust = Path("src-tauri/src/lib.rs").read_text(encoding="utf-8")
          css = Path("src/style.css").read_text(encoding="utf-8")
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          for item in ["clinicName: string","clinicSlogan: string","clinicAddress: string","backupHour: number","exportPath: string","إعدادات التطبيق","بيانات العيادة","التشغيل اليومي","البيانات والنسخ الاحتياطية","نسخة احتياطية الآن","فحص سلامة النظام","إدارة النسخ","مجلد الملفات المصدّرة","حفظ كل الإعدادات","version: '6.7.0'"]:
              assert item in main, item
          for item in ["clinic_name: String","clinic_slogan: String","clinic_address: String","backup_hour: u32","export_path: String","fn get_backup_hour","fn ensure_backup_tasks(backup_hour: u32)",'meta_value(&conn, "clinic_name"','("backup_hour", input.backup_hour.to_string())']:
              assert item in rust, item
          for item in ["/* ===== V6.7 complete application settings ===== */",".settings-workspace",".settings-section-card",".settings-tool-grid",".settings-path-row",".settings-save-bar"]:
              assert item in css, item

          assert conf["version"] == "6.7.0"
          assert conf["bundle"]["windows"]["webviewInstallMode"]["type"] == "offlineInstaller"
          print("V6.7 settings gate passed")
          PY

      - name: Build V6.7 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 80000000) { throw "Offline WebView2 installer missing or setup too small" }

      - name: Commit validated V6.7 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/src/lib.rs src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V6.7: complete application settings"
            git push
          fi

      - name: Upload V6.7 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V6.7-Complete-Settings
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
