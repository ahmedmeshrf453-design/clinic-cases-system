      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Validate frontend
        shell: bash
        run: npm run build

      - name: Validate Rust
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Registration flow gate
        shell: bash
        run: |
          python - <<'PY2'
          from pathlib import Path
          s = Path('src/main.ts').read_text(encoding='utf-8')
          assert '＋ تسجيل حالة' in s
          assert 'التالي: بيانات الزيارة' in s
          assert "await openVisitModal(details.patient);" in s
          assert 'تم حفظ الحالة وإضافتها إلى حالات اليوم والتقارير' in s
          print('Registration flow gate passed')
          PY2

      - name: Build V4.6 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify Setup EXE
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer:" $installer.FullName

      - name: Commit validated V4.6 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V4.6: complete case registration with visit"
            git push
          fi

      - name: Upload V4.6 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V4.6-Register-Case-Into-Reports-Installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
