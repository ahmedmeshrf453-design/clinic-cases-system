          sed 's/^[[:space:]]*//' "$RUNNER_TEMP/project.b64" | base64 -d > "$RUNNER_TEMP/project.zip"
          unzip -q "$RUNNER_TEMP/project.zip" -d "$RUNNER_TEMP/hagzapp"

      - name: Verify SQLite hotfix and offline mode
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionName = "3.0.2"' app/build.gradle.kts
          grep -q 'versionCode = 32' app/build.gradle.kts
          grep -q 'setWriteAheadLoggingEnabled(true)' app/src/main/java/com/alakad/smsforwarder/MessageStore.kt
          ! grep -q 'execSQL("PRAGMA' app/src/main/java/com/alakad/smsforwarder/MessageStore.kt
          grep -q 'migrateLegacyIfNeeded' app/src/main/java/com/alakad/smsforwarder/MessageStore.kt
          grep -q 'MAX_MESSAGES = 30_000' app/src/main/java/com/alakad/smsforwarder/MessageStore.kt
          grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_SMS' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml
          test -s app/stable-release.jks

      - name: Build installable release APK
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Hagz-AlHalat-v3.0.2-SQLITE-HOTFIX.apk"
          sha256sum "$GITHUB_WORKSPACE/Hagz-AlHalat-v3.0.2-SQLITE-HOTFIX.apk" > "$GITHUB_WORKSPACE/Hagz-AlHalat-v3.0.2-SQLITE-HOTFIX.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagz-AlHalat-v3.0.2-SQLITE-HOTFIX
          path: |
            Hagz-AlHalat-v3.0.2-SQLITE-HOTFIX.apk
            Hagz-AlHalat-v3.0.2-SQLITE-HOTFIX.sha256
          retention-days: 30
