name: Clinic AK Brand UI Safe Release
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - uses: dtolnay/rust-toolchain@stable
    - name: Apply AK brand CSS safely
      shell: pwsh
      run: '@''

        from pathlib import Path

        import base64

        p=Path(''src/style.css'')

        s=p.read_text(encoding=''utf-8'')

        marker=''AK_CLINIC_FULL_BRAND_20261014''

        if marker in s: raise SystemExit(''Theme already exists; aborting duplicate update'')

        css=base64.b64decode('''').decode(''utf-8'')

        assert marker in css

        p.write_text(s+''\n''+css,encoding=''utf-8'')

        ''@ | python -

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - name: Validate source
      shell: pwsh
      run: 'npm ci

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        npm run build

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        cargo test --manifest-path src-tauri/Cargo.toml --locked

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $changed=@(git diff --name-only)

        if ($changed.Count -ne 1 -or $changed[0] -ne ''src/style.css'') { throw "Unexpected source modifications:
        $changed" }'
    - name: Build EXE
      shell: pwsh
      run: 'npm run tauri -- build --bundles nsis

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $files=@(Get-ChildItem ''src-tauri/target/release/bundle/nsis'' -File -Filter ''*.exe'')

        if ($files.Count -ne 1) { throw ''Installer not found or multiple installers'' }

        Copy-Item -LiteralPath $files[0].FullName -Destination ''Clinic-Cases-Windows-Setup.exe''

        $hash=(Get-FileHash ''Clinic-Cases-Windows-Setup.exe'' -Algorithm SHA256).Hash.ToLowerInvariant()

        "$hash  Clinic-Cases-Windows-Setup.exe" | Set-Content ''Clinic-Cases-Windows-Setup.exe.sha256'' -Encoding
        ascii'
    - name: Commit visual-only change
      shell: pwsh
      run: 'git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add -- src/style.css

        git commit -m ''Apply clinic AK branding to navigation and dashboard''

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        git fetch origin main

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        git rebase origin/main

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        git push origin HEAD:main

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - name: Publish Windows installer
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: '$tag="clinic-ak-brand-safe-$($env:GITHUB_RUN_ID)"

        gh release create $tag ''Clinic-Cases-Windows-Setup.exe'' ''Clinic-Cases-Windows-Setup.exe.sha256'' --target
        main --title ''Clinic Cases AK Brand UI'' --notes ''Visual-only AK theme: navy and turquoise dashboard,
        sidebar, settings and home tiles. No patient/PIN/database logic changes. Verify appearance before rollout.''

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Clinic-Cases-Windows-Setup.exe" >> $env:GITHUB_STEP_SUMMARY'
