name: Clinic Cases V7.1.16 Click Booking Patient

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V7.1.16 patient click
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          main_p=Path('src/main.ts')
          css_p=Path('src/style.css')
          tauri_p=Path('src-tauri/tauri.conf.json')
          cargo_p=Path('src-tauri/Cargo.toml')
          lock_p=Path('src-tauri/Cargo.lock')
          pkg_p=Path('package.json')
          pkglock_p=Path('package-lock.json')

          m=main_p.read_text(encoding='utf-8')
          c=css_p.read_text(encoding='utf-8')

          tauri=json.loads(tauri_p.read_text(encoding='utf-8'))
          tauri['version']='7.1.16'
          tauri_p.write_text(json.dumps(tauri,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          pkg=json.loads(pkg_p.read_text(encoding='utf-8'))
          pkg['version']='7.1.16'
          pkg_p.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          pl=pkglock_p.read_text(encoding='utf-8')
          pl=re.sub(r'("version"\s*:\s*")7\.1\.\d+(")',r'\g<1>7.1.16\2',pl,count=2)
          pkglock_p.write_text(pl,encoding='utf-8')

          cg=cargo_p.read_text(encoding='utf-8')
          cg=re.sub(r'(?m)^version\s*=\s*"7\.1\.\d+"\s*$', 'version = "7.1.16"', cg, count=1)
          cargo_p.write_text(cg,encoding='utf-8')

          cl=lock_p.read_text(encoding='utf-8')
          cl=re.sub(r'(name\s*=\s*"clinic-cases-system"\s*\nversion\s*=\s*")7\.1\.\d+(")',r'\g<1>7.1.16\2',cl,count=1)
          lock_p.write_text(cl,encoding='utf-8')

          old_row="return `<tr data-booking-search=\"${esc(`${v.patientName||''} ${v.patientPhone||''} ${v.doctor||''} ${visitType}`.toLowerCase())}\">"
          new_row="return `<tr class=\"specialty-booking-patient-row\" data-booking-patient-row=\"${esc(v.patientId)}\" data-booking-search=\"${esc(`${v.patientName||''} ${v.patientPhone||''} ${v.doctor||''} ${visitType}`.toLowerCase())}\" role=\"button\" tabindex=\"0\" title=\"فتح ملف المريض\">"
          if old_row not in m:
              raise SystemExit('booking row template not found')
          m=m.replace(old_row,new_row,1)

          old_bind="  document.querySelectorAll<HTMLButtonElement>('[data-booking-patient]').forEach(btn=>{\n    btn.onclick=()=>openPatient(btn.dataset.bookingPatient||'');\n  });\n"
          new_bind="  document.querySelectorAll<HTMLButtonElement>('[data-booking-patient]').forEach(btn=>{\n    btn.onclick=e=>{\n      e.stopPropagation();\n      openPatient(btn.dataset.bookingPatient||'');\n    };\n  });\n\n  document.querySelectorAll<HTMLElement>('[data-booking-patient-row]').forEach(row=>{\n    const open=()=>openPatient(row.dataset.bookingPatientRow||'');\n    row.onclick=e=>{\n      if((e.target as HTMLElement).closest('button,select,input,a')) return;\n      open();\n    };\n    row.onkeydown=e=>{\n      if(e.key==='Enter' || e.key===' '){\n        e.preventDefault();\n        open();\n      }\n    };\n  });\n"
          if old_bind not in m:
              raise SystemExit('booking patient binding not found')
          m=m.replace(old_bind,new_bind,1)
          m=re.sub(r'V7\.1\.\d+ • [^<]+','V7.1.16 • CLICK BOOKING PATIENT',m,count=1)
          main_p.write_text(m,encoding='utf-8')

          if 'V7.1.16 CLICK BOOKING PATIENT' not in c:
              c += '\n\n/* ===== V7.1.16 CLICK BOOKING PATIENT ===== */\n.specialty-booking-patient-row{cursor:pointer!important;transition:background .14s ease,box-shadow .14s ease!important}\n.specialty-booking-patient-row:hover{background:#f3f9fd!important;box-shadow:inset 3px 0 0 #3d91bf!important}\n.specialty-booking-patient-row:focus{outline:2px solid #76b7d8!important;outline-offset:-2px!important}\n.specialty-booking-patient-row .booking-patient-link{cursor:pointer!important;font-weight:800!important}\n'
          css_p.write_text(c,encoding='utf-8')
          print('V7.1.16 booking patient click applied')
          PY

      - name: Verify V7.1.16
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          m=Path('src/main.ts').read_text(encoding='utf-8')
          c=Path('src/style.css').read_text(encoding='utf-8')
          t=json.loads(Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          checks={
            'version':t.get('version')=='7.1.16',
            'row_attr':'data-booking-patient-row' in m,
            'row_open':"openPatient(row.dataset.bookingPatientRow||'')" in m,
            'name_open':"openPatient(btn.dataset.bookingPatient||'')" in m,
            'css':'V7.1.16 CLICK BOOKING PATIENT' in c,
            'marker':'V7.1.16 • CLICK BOOKING PATIENT' in m,
          }
          for k,v in checks.items(): print(k,'OK' if v else 'FAIL')
          assert all(checks.values()),checks
          print('V7.1.16 verification passed')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx tauri build --bundles nsis; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1

      - name: Verify installer
        shell: pwsh
        run: |
          $i=Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" |
            Where-Object { $_.Name -match "7\.1\.16" } |
            Select-Object -First 1
          if(-not $i){throw "V7.1.16 installer missing"}
          if($i.Length -lt 80000000){throw "Installer too small"}

      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.1.16-Click-Booking-Patient
          path: src-tauri/target/release/bundle/nsis/*7.1.16*-setup.exe
          if-no-files-found: error

      - name: Commit validated V7.1.16
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "V7.1.16: open patient from booking row"; fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
