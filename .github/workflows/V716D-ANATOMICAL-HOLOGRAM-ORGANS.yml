name: Clinic Cases V7.1.6D Anatomical Hologram Organs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore anatomical hologram SVG assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/home-icons/hologram-real
          rm -f "$RUNNER_TEMP/urology.b64"
          printf '%s' '' >> "$RUNNER_TEMP/urology.b64"
          printf '%s' 'dHJva2UtbGluZWNhcD0icm91bmQiLz4KPHBhdGggZD0iTTEwMiAxNTMgQzExNSAxNjYgMTIyIDE4MCAxMjAgMjAzIE0yODIgMTUzIEMyNjkgMTY2IDI2MiAxODAgMjY0IDIwMyIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjYzFmYWZmIiBzdHJva2Utd2lkdGg9IjQiIG9wYWNpdHk9IjAuNjIiLz4KPC9nPgo8L3N2Zz4=' >> "$RUNNER_TEMP/urology.b64"
          python - "$RUNNER_TEMP/urology.b64" "public/home-icons/hologram-real/urology.svg" <<'PY'
          import base64,pathlib,sys
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(pathlib.Path(sys.argv[1]).read_text()))
          PY
          rm -f "$RUNNER_TEMP/internal.b64"
          printf '%s' '' >> "$RUNNER_TEMP/internal.b64"
          python - "$RUNNER_TEMP/internal.b64" "public/home-icons/hologram-real/internal.svg" <<'PY'
          import base64,pathlib,sys
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(pathlib.Path(sys.argv[1]).read_text()))
          PY
          rm -f "$RUNNER_TEMP/ortho.b64"
          printf '%s' '' >> "$RUNNER_TEMP/ortho.b64"
          printf '%s' 'OCAxOTkgMjc5IiBmaWxsPSJub25lIiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iNSIgb3BhY2l0eT0iMC4yOCIvPgo8L2c+CjwvZz4KPC9zdmc+' >> "$RUNNER_TEMP/ortho.b64"
          python - "$RUNNER_TEMP/ortho.b64" "public/home-icons/hologram-real/ortho.svg" <<'PY'
          import base64,pathlib,sys
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(pathlib.Path(sys.argv[1]).read_text()))
          PY
