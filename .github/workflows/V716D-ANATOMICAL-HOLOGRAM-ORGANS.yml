          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(pathlib.Path(sys.argv[1]).read_text()))
          PY
          rm -f "$RUNNER_TEMP/labs.b64"
          printf '%s' '' >> "$RUNNER_TEMP/labs.b64"
          python - "$RUNNER_TEMP/labs.b64" "public/home-icons/hologram-real/labs.svg" <<'PY'
          import base64,pathlib,sys
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(pathlib.Path(sys.argv[1]).read_text()))
          PY
          rm -f "$RUNNER_TEMP/radiology.b64"
          printf '%s' '' >> "$RUNNER_TEMP/radiology.b64"
          python - "$RUNNER_TEMP/radiology.b64" "public/home-icons/hologram-real/radiology.svg" <<'PY'
          import base64,pathlib,sys
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(pathlib.Path(sys.argv[1]).read_text()))
          PY
          rm -f "$RUNNER_TEMP/physio.b64"
          printf '%s' '' >> "$RUNNER_TEMP/physio.b64"
          python - "$RUNNER_TEMP/physio.b64" "public/home-icons/hologram-real/physio.svg" <<'PY'
          import base64,pathlib,sys
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(pathlib.Path(sys.argv[1]).read_text()))
          PY
          rm -f "$RUNNER_TEMP/nursing.b64"
          printf '%s' '' >> "$RUNNER_TEMP/nursing.b64"
          python - "$RUNNER_TEMP/nursing.b64" "public/home-icons/hologram-real/nursing.svg" <<'PY'
          import base64,pathlib,sys
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(pathlib.Path(sys.argv[1]).read_text()))
          PY

      - name: Apply V7.1.6D UI
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/v716d.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v716d.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v716d.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v716d.b64"
          printf '%s' '' >> "$RUNNER_TEMP/v716d.b64"
          printf '%s' 'Y2VzLWdyaWR7Z3JpZC10ZW1wbGF0ZS1jb2x1bW5zOnJlcGVhdCgyLG1pbm1heCgxODBweCwxZnIpKX19CiIiIgoKbWFpbl9wLndyaXRlX3RleHQobSxlbmNvZGluZz0ndXRmLTgnKQpjc3NfcC53cml0ZV90ZXh0KGMsZW5jb2Rpbmc9J3V0Zi04JykKcHJpbnQoJ1Y3LjEuNkQgcGF0Y2ggYXBwbGllZCcpCg==' >> "$RUNNER_TEMP/v716d.b64"
          python - "$RUNNER_TEMP/v716d.b64" <<'PY'
          import base64,pathlib,sys
          exec(base64.b64decode(pathlib.Path(sys.argv[1]).read_text()).decode("utf-8"))
          PY

      - name: Verify V7.1.6D
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          m=Path('src/main.ts').read_text(encoding='utf-8')
          c=Path('src/style.css').read_text(encoding='utf-8')
          t=json.loads(Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          assert t.get('version')=='7.1.6'
          assert 'ANATOMICAL HOLOGRAM ORGANS' in m
          assert 'specialty-home-v716d' in m
          assert 'anatomical-hologram-tile' in m and 'anatomical-hologram-tile' in c
          for n in ['urology', 'internal', 'ortho', 'surgery', 'eye', 'neuro', 'obgyn', 'ent', 'nutrition', 'vascular', 'audiology', 'labs', 'radiology', 'physio', 'nursing']:
              p=Path('public/home-icons/hologram-real')/(n+'.svg')
              assert p.exists() and p.stat().st_size>1000,(n,p.stat().st_size if p.exists() else 0)
          print('V7.1.6D source/assets OK')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Verify bundled icons
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/home-icons/hologram-real/urology.svg
          test -f dist/home-icons/hologram-real/internal.svg
          test -f dist/home-icons/hologram-real/neuro.svg
          test -f dist/home-icons/hologram-real/eye.svg
          test -f dist/home-icons/hologram-real/labs.svg

      - name: Rust tests
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify installer
        shell: pwsh
        run: |
          $i=Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Where-Object { $_.Name -match "7\.1\.6" } | Select-Object -First 1
          if(-not $i){throw "V7.1.6 installer missing"}
          if($i.Length -lt 80000000){throw "Installer too small"}

      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.1.6D-Anatomical-Hologram-Organs
          path: src-tauri/target/release/bundle/nsis/*7.1.6*-setup.exe
          if-no-files-found: error

      - name: Commit validated V7.1.6D
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/home-icons/hologram-real src/main.ts src/style.css src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "V7.1.6D: anatomical hologram organ icons"; fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
