          PY
          rm -f "$RUNNER_TEMP/eye.b64"
          printf '%s' '' >> "$RUNNER_TEMP/eye.b64"
          python - "$RUNNER_TEMP/eye.b64" "public/home-icons/hologram-real/eye.svg" <<'PY'
          import base64,pathlib,sys
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(pathlib.Path(sys.argv[1]).read_text()))
          PY
          rm -f "$RUNNER_TEMP/neuro.b64"
          printf '%s' '' >> "$RUNNER_TEMP/neuro.b64"
          python - "$RUNNER_TEMP/neuro.b64" "public/home-icons/hologram-real/neuro.svg" <<'PY'
          import base64,pathlib,sys
