          PY
          rm -f "$RUNNER_TEMP/ent.b64"
          printf '%s' '' >> "$RUNNER_TEMP/ent.b64"
          python - "$RUNNER_TEMP/ent.b64" "public/home-icons/hologram-real/ent.svg" <<'PY'
          import base64,pathlib,sys
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(pathlib.Path(sys.argv[1]).read_text()))
          PY
