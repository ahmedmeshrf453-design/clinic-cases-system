name: AK Patient Account Reconciliation V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/AK_PATIENT_ACCOUNT_RECONCILIATION_V1.yml'
permissions:
  contents: write
concurrency:
  group: ak-patient-account-reconciliation-v1
  cancel-in-progress: false
jobs:
  patch-test-build-release:
    runs-on: windows-latest
    timeout-minutes: 130
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Apply isolated patient account reconciliation patch
        shell: bash
        run: |
          cat > ak_patient_reconcile_patch_v1.py <<'PY'
          from pathlib import Path
          import json, subprocess

          MAIN=Path('src/main.ts')
          CSS=Path('src/style.css')
          LIB=Path('src-tauri/src/lib.rs')
          CARGO=Path('src-tauri/Cargo.toml')
          CONF=Path('src-tauri/tauri.conf.json')
          MARK='AK_PATIENT_ACCOUNT_RECONCILIATION_V1'

          def exact(s, old, new, label):
              count=s.count(old)
              if count!=1:
                  raise RuntimeError(f'{label}: expected unique anchor, found {count}. Refusing unsafe patch.')
              return s.replace(old,new,1)

          m=MAIN.read_text(encoding='utf-8')
          c=CSS.read_text(encoding='utf-8')
          r=LIB.read_text(encoding='utf-8')

          if MARK in m and MARK in c and MARK in r:
              print('Reconciliation patch already present — no duplicate changes.')
          elif any(MARK in x for x in [m,c,r]):
              raise RuntimeError('Patch only partially applied. Stopping without changing any source.')
          else:
              # The old 'remaining' label reflected missing recorded payments; it was not proof that cash was unpaid.
              m=exact(m,
                  '''            <strong>${patientRemaining > 0.009 ? `متبقي ${patientRemaining.toFixed(2)} ج.م` : 'مسدد ✓'}</strong>
                      <small>المدفوع ${patientPaid.toFixed(2)} من ${patientCharges.toFixed(2)} ج.م</small>''',
                  '''            <strong>${patientCharges <= 0.009 ? 'لا توجد رسوم مسجلة' : patientRemaining > 0.009 ? `غير مسجل سداده ${patientRemaining.toFixed(2)} ج.م` : 'مسدد ✓'}</strong>
                      <small>المدفوع المسجل ${patientPaid.toFixed(2)} من ${patientCharges.toFixed(2)} ج.م</small>
                      <button type="button" class="patient-account-review-button" id="patientReviewAccount">🧾 مراجعة السداد</button>''',
                  'patient header balance and reconcile button')
              m=exact(m,
                  '''  document.querySelector<HTMLButtonElement>('#closePatient')!.onclick = close;
            document.querySelector<HTMLDivElement>('#patientModalBackdrop')!.onclick = e => {''',
                  '''  document.querySelector<HTMLButtonElement>('#closePatient')!.onclick = close;
            // AK_PATIENT_ACCOUNT_RECONCILIATION_V1: old services require explicit reconciliation.
            document.querySelector<HTMLButtonElement>('#patientReviewAccount')!.onclick = () => void openPatientAccountModal(id);
            document.querySelector<HTMLDivElement>('#patientModalBackdrop')!.onclick = e => {''',
                  'patient profile button binding')

              # Retain other callers' behavior; optional modes are only used by the patient account flow.
              payment_start=m.index('function openCashierPaymentModal(')
              payment_end=m.index('async function renderCashier()',payment_start)
              payment_old=m[payment_start:payment_end]
              if 'cashierPaymentForm' not in payment_old or 'record_cashier_payment' not in payment_old:
                  raise RuntimeError('Unexpected original cashier collection modal; refusing to replace')

              replacement=r'''// AK_PATIENT_ACCOUNT_RECONCILIATION_V1 — retain ordinary cashier behavior and explicitly tag old receipts.
          function openCashierPaymentModal(
            item:{patientId:string;serviceType:string;serviceId:string;remaining:number},
            onSaved:()=>Promise<void>,
            options?:{historical?:boolean;onCancel?:()=>Promise<void>}
          ){
            const historical=options?.historical===true;
            const root=document.querySelector<HTMLDivElement>('#modalRoot')!;
            const methodOptions=historical
              ? '<option value="تسوية سداد سابق">تسوية سداد سابق — بدون تحصيل جديد</option>'
              : '<option>نقدي</option><option>فيزا</option><option>إنستاباي</option><option>محفظة</option><option>أخرى</option>';
            root.innerHTML=`<div class="modal-backdrop"><section class="modal compact">
              <div class="modal-head"><div><h2>${historical?'تسجيل سداد سابق':'تحصيل مبلغ'}</h2>
                <p>المتبقي المسجل ${item.remaining.toFixed(2)} ج.م</p></div>
                <button class="modal-close" id="closeCashierPayment">×</button></div>
              ${historical?'<p class="patient-reconcile-warning">⚠ سجل التسوية فقط إذا تأكدت من إيصال أو واقعة السداد السابقة. هذا ليس تحصيلًا نقديًا جديدًا ولن ينشئ كشفًا جديدًا.</p>':''}
              <form id="cashierPaymentForm"><div class="form-grid one">
                <label>المبلغ<input class="ltr" name="amount" type="number" min="0.01" max="${item.remaining}" step="0.01" value="${item.remaining.toFixed(2)}" required></label>
                <label>طريقة الدفع<select name="paymentMethod">${methodOptions}</select></label>
                <label>${historical?'مرجع السداد السابق / ملاحظات':'ملاحظات'}<input name="notes" maxlength="300" ${historical?'placeholder="مثال: تم السداد عند الزيارة وفق الإيصال"':''}></label>
              </div><div class="form-actions">
                <button type="button" class="btn ghost" id="cancelCashierPayment">إلغاء</button>
                <button type="submit" class="btn primary" id="confirmCashierPayment">${historical?'✓ اعتماد السداد السابق':'✓ حفظ التحصيل'}</button>
              </div></form>
            </section></div>`;
            const close=()=>{root.innerHTML='';if(options?.onCancel)void options.onCancel()};
            document.querySelector<HTMLButtonElement>('#closeCashierPayment')!.onclick=close;
            document.querySelector<HTMLButtonElement>('#cancelCashierPayment')!.onclick=close;
            const form=document.querySelector<HTMLFormElement>('#cashierPaymentForm')!;
            form.onsubmit=async e=>{
              e.preventDefault();
              const fd=new FormData(form);
              const button=document.querySelector<HTMLButtonElement>('#confirmCashierPayment')!;
              if(button.disabled)return;
              if(historical && !window.confirm('هل أنت متأكد أن المبلغ دُفع سابقًا بالفعل؟ لن يُسجل كتحصيل نقدي جديد، لكن سيُسوى المستحق في ملف المريض.'))return;
              button.disabled=true;
              try {
                await invoke('record_cashier_payment',{input:{
                  patientId:item.patientId,serviceType:item.serviceType,serviceId:item.serviceId,
                  amount:String(fd.get('amount')||''),
                  paymentMethod:String(fd.get('paymentMethod')||''),
                  notes:String(fd.get('notes')||'').trim()
                }});
                root.innerHTML='';
                toast(historical?'تم تسجيل تسوية السداد السابق':'تم تسجيل التحصيل');
                await onSaved();
              }catch(err){toast(`تعذر تسجيل ${historical?'السداد السابق':'التحصيل'}: ${String(err)}`,'error')}
              finally{button.disabled=false}
            };
          }

          // AK_PATIENT_ACCOUNT_RECONCILIATION_V1 — review old and new services independently.
          async function openPatientAccountModal(patientId:string){
            const root=document.querySelector<HTMLDivElement>('#modalRoot')!;
            try {
              const [details,all]=await Promise.all([
                invoke<PatientDetails>('get_patient_details',{id:patientId}),
                invoke<CashierItem[]>('list_cashier_items',{query:{from:'2000-01-01',to:'2099-12-31'}})
              ]);
              const rows=all.filter(row=>row.patientId===patientId);
              const charges=rows.reduce((s,r)=>s+r.charge,0);
              const paid=rows.reduce((s,r)=>s+r.paid,0);
              const remaining=rows.reduce((s,r)=>s+r.remaining,0);
              const back=async()=>{root.innerHTML='';await openPatient(patientId)};
              root.innerHTML=`<div class="modal-backdrop" data-back-patient-id="${esc(patientId)}"><section class="modal wide patient-account-review-modal">
                <div class="modal-head"><div><h2>🧾 مراجعة حساب المريض</h2><p>${esc(details.patient.fullName||'ملف المريض')} — سجل الدفع لكل خدمة على حدة</p></div>
                <button type="button" class="modal-close" id="closePatientAccountReview">×</button></div>
                <p class="patient-reconcile-warning">المستحقات الظاهرة تعني أن السداد غير مسجل في النظام، وليس بالضرورة أن المريض لم يدفع. راجع الإيصالات قبل تسجيل «سداد سابق».</p>
                <div class="v7-money-grid patient-account-money-summary">
                  <div><span>إجمالي الخدمات</span><strong>${charges.toFixed(2)} ج.م</strong></div>
                  <div><span>المدفوع المسجل</span><strong>${paid.toFixed(2)} ج.م</strong></div>
                  <div><span>غير مسجل سداده</span><strong>${remaining.toFixed(2)} ج.م</strong></div>
                </div>
                <div class="table-wrap"><table class="v7-cashier-table patient-account-table">
                  <thead><tr><th>التاريخ</th><th>الخدمة</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>الإجراء</th></tr></thead>
                  <tbody>${rows.length?rows.map((r,i)=>`<tr>
                    <td>${esc(displayDate(r.serviceDate))}</td><td>${esc(r.serviceLabel)}</td>
                    <td class="ltr">${r.charge.toFixed(2)} ج.م</td><td class="ltr">${r.paid.toFixed(2)} ج.م</td>
                    <td class="ltr ${r.remaining>0.009?'v7-due':'v7-paid'}">${r.remaining.toFixed(2)} ج.م</td>
                    <td>${r.remaining>0.009?`<div class="patient-account-row-actions"><button type="button" class="btn primary small" data-patient-account-collect="${i}">تحصيل / جزئي</button><button type="button" class="btn ghost small" data-patient-account-previous="${i}">سدد سابقًا</button></div>`:'<span class="v7-paid-badge">لا يوجد مستحق</span>'}</td>
                  </tr>`).join(''):'<tr><td colspan="6" class="empty-row">لا توجد خدمات مالية مسجلة</td></tr>'}</tbody>
                </table></div>
                <div class="form-actions"><button type="button" class="btn ghost" id="backToPatientFromAccount">← رجوع لملف المريض</button></div>
              </section></div>`;
              document.querySelector<HTMLButtonElement>('#closePatientAccountReview')!.onclick=()=>void back();
              document.querySelector<HTMLButtonElement>('#backToPatientFromAccount')!.onclick=()=>void back();
              const openReceipt=(idx:number,historical:boolean)=>{
                const row=rows[idx];
                if(!row||row.remaining<=0.009){toast('لم يعد على هذه الخدمة مبلغ مستحق');return}
                openCashierPaymentModal({patientId,serviceType:row.serviceType,serviceId:row.serviceId,remaining:row.remaining},
                  async()=>openPatientAccountModal(patientId),
                  {historical,onCancel:async()=>openPatientAccountModal(patientId)});
              };
              root.querySelectorAll<HTMLButtonElement>('[data-patient-account-collect]').forEach(button=>{
                button.onclick=()=>openReceipt(Number(button.dataset.patientAccountCollect),false);
              });
              root.querySelectorAll<HTMLButtonElement>('[data-patient-account-previous]').forEach(button=>{
                button.onclick=()=>openReceipt(Number(button.dataset.patientAccountPrevious),true);
              });
            }catch(err){toast(`تعذر فتح مراجعة الحساب: ${String(err)}`,'error');await openPatient(patientId)}
          }

          '''
              m=exact(m,payment_old,replacement,'existing cashier payment modal')
              c+='''\n/* AK_PATIENT_ACCOUNT_RECONCILIATION_V1 — patient-ledger reconciliation UI. */
          .patient-account-review-button { display: inline-flex; align-items: center; justify-content: center; background: #fff; border: 1px solid #d0dfea; color: #155b89; border-radius: 9px; padding: 7px 12px; font-weight: 800; cursor: pointer; margin-top: 7px; }
          .patient-account-review-button:hover { border-color: #1973ac; background: #f0f8ff; }
          .patient-account-review-modal { max-width: 1100px; }
          .patient-account-money-summary { margin: 15px 0; }
          .patient-reconcile-warning { padding: 12px 14px; border-radius: 10px; border: 1px solid #f1d7aa; background: #fff9ee; color: #86531e; font-weight: 600; line-height: 1.7; }
          .patient-account-row-actions { display: flex; flex-wrap: wrap; gap: 6px; }
          .patient-account-table td { vertical-align: middle; }
          '''
              tests=r'''    #[test]
              fn patient_historical_reconciliation_preserves_source_visit_and_balance() {
                  let db=test_db_path("patient-reconcile");
                  init_db(&db).expect("setup synthetic finance db");
                  let conn=Connection::open(&db).expect("open synthetic finance db");
                  conn.execute("INSERT INTO patients(id,full_name,phone,created_at,updated_at) VALUES('recon-p1','Test','01000000000','2026-10-15 10:00:00','2026-10-15 10:00:00')",[])
                      .expect("insert patient");
                  conn.execute("INSERT INTO visits(id,patient_id,visit_date,visit_time,doctor,fee,visit_type,booking_source,created_at,updated_at) VALUES('recon-v1','recon-p1','2026-10-15','10:00','Test Dr','300','كشف جديد','عادي','2026-10-15 10:00:00','2026-10-15 10:00:00')",[])
                      .expect("insert old visit");
                  let before=cashier_items_for_range(&conn,"2026-10-15","2026-10-15").expect("old visit cashier query");
                  let old=before.iter().find(|r|r.service_id=="recon-v1").expect("old visit visible");
                  assert!((old.paid-0.0).abs()<0.001);
                  assert!((old.remaining-300.0).abs()<0.001);
                  conn.execute("INSERT INTO cashier_payments(id,patient_id,service_type,service_id,amount,payment_method,notes,created_at) VALUES('recon-cp1','recon-p1','clinic','recon-v1','120.00','تسوية سداد سابق','Verified historical receipt','2026-10-15 11:00:00')",[])
                      .expect("record partial historical payment");
                  let partial=cashier_items_for_range(&conn,"2026-10-15","2026-10-15").expect("partial query");
                  let old=partial.iter().find(|r|r.service_id=="recon-v1").expect("partial visit exists");
                  assert!((old.paid-120.0).abs()<0.001);
                  assert!((old.remaining-180.0).abs()<0.001);
                  conn.execute("INSERT INTO cashier_payments(id,patient_id,service_type,service_id,amount,payment_method,notes,created_at) VALUES('recon-cp2','recon-p1','clinic','recon-v1','180.00','نقدي','Test actual collection','2026-10-15 11:15:00')",[])
                      .expect("collect remainder");
                  let final_rows=cashier_items_for_range(&conn,"2026-10-15","2026-10-15").expect("final query");
                  let old=final_rows.iter().find(|r|r.service_id=="recon-v1").expect("paid visit exists");
                  assert!((old.paid-300.0).abs()<0.001);
                  assert!((old.remaining-0.0).abs()<0.001);
                  let (price,count):(String,i64)=conn.query_row("SELECT fee,(SELECT COUNT(*) FROM visits WHERE id='recon-v1') FROM visits WHERE id='recon-v1'",[],|row|Ok((row.get(0)?,row.get(1)?))).expect("original visit unchanged");
                  assert_eq!(price,"300");
                  assert_eq!(count,1);
                  drop(conn);
                  cleanup(&db);
              }

          '''
              r=exact(r,
                '''#[cfg(test)]
          mod production_tests {
              use super::*;
          ''',
                '''#[cfg(test)]
          mod production_tests {
              use super::*;

          '''+tests,
                'add synthetic old-visit reconciliation test')
              MAIN.write_text(m,encoding='utf-8')
              CSS.write_text(c,encoding='utf-8')
              LIB.write_text(r,encoding='utf-8')

          if not (MARK in MAIN.read_text(encoding='utf-8') and MARK in CSS.read_text(encoding='utf-8') and MARK in LIB.read_text(encoding='utf-8')):
              raise RuntimeError('Safety marker missing in patched files')

          conf=json.loads(CONF.read_text(encoding='utf-8'))
          if conf['version']=='7.1.39':
              conf['version']='7.1.40'
              CONF.write_text(json.dumps(conf,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              cargo=CARGO.read_text(encoding='utf-8')
              cargo=exact(cargo,'version = "7.1.39"','version = "7.1.40"','Cargo version bump')
              CARGO.write_text(cargo,encoding='utf-8')
              subprocess.run(['cargo','update','--workspace','--manifest-path',str(CARGO)],check=True)
          elif conf['version']!='7.1.40':
              raise RuntimeError('Unexpected existing version; refusing to alter unrelated release')
          print('Patch ready: patient account ledger + past payments + partial/new payment + regression tests.')
          PY
          python ak_patient_reconcile_patch_v1.py
          python -m py_compile ak_patient_reconcile_patch_v1.py
      - name: Validate and test the app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -File -Filter '*.exe')
          if ($files.Count -ne 1) { throw "Expected one NSIS installer; got $($files.Count)" }
          Copy-Item -LiteralPath $files[0].FullName -Destination 'Clinic-Cases-Windows-Patient-Account-Fix.exe' -Force
          if ((Get-Item 'Clinic-Cases-Windows-Patient-Account-Fix.exe').Length -lt 50000000) { throw 'Installer too small' }
          $hash = (Get-FileHash 'Clinic-Cases-Windows-Patient-Account-Fix.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Clinic-Cases-Windows-Patient-Account-Fix.exe" | Set-Content 'Clinic-Cases-Windows-Patient-Account-Fix.exe.sha256' -Encoding ascii
      - name: Push tested exact changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/main.ts src/style.css src-tauri/src/lib.rs src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          $changed = @(git diff --cached --name-only)
          if ($changed.Count -gt 0) {
            git commit -m 'Add patient account review and auditable historical payment reconciliation'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $sha = (git rev-parse HEAD).Trim()
          "PATCHED_COMMIT=$sha" >> $env:GITHUB_ENV
      - name: Publish patched offline Windows EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v7.1.40-patient-account-$env:GITHUB_RUN_ID"
          gh release create $tag 'Clinic-Cases-Windows-Patient-Account-Fix.exe' 'Clinic-Cases-Windows-Patient-Account-Fix.exe.sha256' --target $env:PATCHED_COMMIT --title 'Clinic Cases V7.1.40 - Patient Account Review and Reconciliation' --notes 'Patient profile now has a per-service account ledger, verified historical settlement, and new or partial cashier collection. Zero existing patient entries are automatically reclassified. Prior settlement uses its own named payment method for audit clarity. Frontend and Rust tests passed; offline Windows EXE.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "### Patient account fix ready" >> $env:GITHUB_STEP_SUMMARY
          "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Clinic-Cases-Windows-Patient-Account-Fix.exe" >> $env:GITHUB_STEP_SUMMARY
