      - name: Verify V1.6 UI filters
        shell: bash
        working-directory: ${{ runner.temp }}/smsapp
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionName = "1.6.0"' app/build.gradle.kts
          grep -q 'sourceSpinner' app/src/main/res/layout/activity_main.xml
          grep -q 'daySpinner' app/src/main/res/layout/activity_main.xml
          grep -q 'countText' app/src/main/res/layout/activity_main.xml
          grep -q 'Vezeeta.com' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'CliniDo' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'ekshef' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_SMS' app/src/main/AndroidManifest.xml
          grep -q 'com.whatsapp.w4b' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          test -s app/stable-release.jks

      - name: Build signed installable APK
        shell: bash
        working-directory: ${{ runner.temp }}/smsapp
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/SMS-WhatsApp-Forwarder-v1.6-UI-Filters.apk"
          sha256sum "$GITHUB_WORKSPACE/SMS-WhatsApp-Forwarder-v1.6-UI-Filters.apk" > "$GITHUB_WORKSPACE/SMS-WhatsApp-Forwarder-v1.6-UI-Filters.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMS-WhatsApp-Forwarder-v1.6-UI-Filters
          path: |
            SMS-WhatsApp-Forwarder-v1.6-UI-Filters.apk
            SMS-WhatsApp-Forwarder-v1.6-UI-Filters.sha256
          retention-days: 30
