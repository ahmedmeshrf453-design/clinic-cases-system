name: AK Dashboard Logo Wallpaper Final Fix
'on':
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ak-dashboard-logo-fix-main
  cancel-in-progress: false
jobs:
  fix-build-release:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Apply targeted dashboard fix
        shell: pwsh
        run: |
          @'
          import base64
          exec(compile(base64.b64decode('').decode('utf-8'), 'ak_dashboard_fix.py', 'exec'))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          if ($changed.Count -gt 1 -or ($changed.Count -eq 1 -and $changed[0] -ne 'src/style.css')) {
            throw "Unexpected file changes: $changed"
          }
      - name: Validate TypeScript and Vite
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Rust tests
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -File -Filter '*.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          Copy-Item -LiteralPath $files[0].FullName -Destination 'Clinic-Cases-Windows-Setup.exe'
          $hash = (Get-FileHash 'Clinic-Cases-Windows-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Clinic-Cases-Windows-Setup.exe" | Set-Content 'Clinic-Cases-Windows-Setup.exe.sha256' -Encoding ascii
      - name: Commit tested CSS to main
        shell: pwsh
        run: |
          $changed = @(git diff --name-only)
          if ($changed.Count -eq 0) {
            Write-Host 'Fix already committed.'
            exit 0
          }
          if ($changed.Count -ne 1 -or $changed[0] -ne 'src/style.css') { throw "Unexpected files: $changed" }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/style.css
          git commit -m 'Use AK logo as dashboard wallpaper and suppress obsolete shortcuts'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rebase origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish installer download
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "ak-logo-wallpaper-$env:GITHUB_RUN_ID"
          gh release create $tag 'Clinic-Cases-Windows-Setup.exe' 'Clinic-Cases-Windows-Setup.exe.sha256' --target main --title 'AK Dashboard Logo Wallpaper Fix' --notes 'Dashboard-only logo wallpaper and obsolete shortcut removal. No patient, PIN, SQLite or booking logic changed.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Clinic-Cases-Windows-Setup.exe" >> $env:GITHUB_STEP_SUMMARY
