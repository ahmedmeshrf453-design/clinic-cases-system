      - name: Commit V3 source safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore package.json tsconfig.json vite.config.ts index.html src src-tauri/Cargo.toml src-tauri/build.rs src-tauri/src src-tauri/tauri.conf.json src-tauri/capabilities src-tauri/icons README.md
          git add -u
          if git diff --cached --quiet; then
            echo "No V3 source changes to commit"
          else
            git commit -m "Clinic Cases Windows Offline V3 Real System"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
