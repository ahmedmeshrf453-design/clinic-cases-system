      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: V6.2.2 dashboard gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          main = Path("src/main.ts").read_text(encoding="utf-8")
          css = Path("src/style.css").read_text(encoding="utf-8")
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          start = main.index("async function renderDashboard()")
          end = main.index("async function renderPatients(", start)
          dash = main[start:end]

          for forbidden in [
              "إجمالي الحالات</span>",
              "todayCases",
              "إجمالي التحصيل",
              "مبلغ العيادات",
              "مبلغ الأطباء",
              "item.revenue",
              "ج.م محصل",
          ]:
              assert forbidden not in dash, forbidden

          for required in [
              "إجمالي المرضى",
              "مرضى العيادات اليوم",
              "مرضى التحاليل اليوم",
              "مرضى خدمات التمريض",
              "كشف جديد",
              "استشارة",
              "عدد الحالات لكل طبيب فقط",
          ]:
              assert required in dash, required

          assert "version: '6.2.2'" in main
          assert "/* V6.2.2 organized dashboard without duplicate totals */" in css
          assert conf["version"] == "6.2.2"
          print("V6.2.2 dashboard gate passed")
          PY

      - name: Build V6.2.2 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          if ($installer.Length -lt 1000000) { throw "Setup EXE is unexpectedly small" }

      - name: Commit validated V6.2.2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V6.2.2: organize dashboard case categories"
            git push
          fi

      - name: Upload V6.2.2 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V6.2.2-Organized-Dashboard
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
