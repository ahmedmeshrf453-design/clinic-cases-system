name: Clinic Cases V3.8 Context Menu And Watermark

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild full AK icon from existing logo
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          emblem = Path("public/clinic-logo-emblem.png")
          header = Path("public/clinic-logo-header.jpg")

          if emblem.exists():
              source = Image.open(emblem).convert("RGBA")
          elif header.exists():
              src = Image.open(header).convert("RGBA")
              # Fallback crop if emblem file is missing.
              if src.size == (900, 1600):
                  box = (72, 390, 828, 923)
              else:
                  sx = src.width / 900
                  sy = src.height / 1600
                  box = (round(72*sx), round(390*sy), round(828*sx), round(923*sy))
              source = src.crop(box)
              source.save("public/clinic-logo-emblem.png", optimize=True)
          else:
              raise SystemExit("No logo source found")

          fit = source.copy()
          fit.thumbnail((220, 220), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (256, 256), (255, 255, 255, 0))
          x = (256 - fit.width) // 2
          y = (256 - fit.height) // 2
          canvas.paste(fit, (x, y), fit)
          Path("src-tauri/icons").mkdir(parents=True, exist_ok=True)
          canvas.save("src-tauri/icons/icon.ico", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          PY

