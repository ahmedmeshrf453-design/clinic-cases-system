name: Clinic Cases V7.0 Finance Pro FIX7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Finance Pro FIX7
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64; exec(base64.b64decode('').decode('utf-8'))"

      - name: Verify FIX7 source
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; m=Path('src/main.ts').read_text(encoding='utf-8'); r=Path('src-tauri/src/lib.rs').read_text(encoding='utf-8'); c=Path('src/style.css').read_text(encoding='utf-8'); terms=['التقرير المالي الشامل','financeBookingSourceLabel','financeRowsTableHtml','financeDownloadPdf','financePrint','service_time:String','booking_source:String','finance detail runtime query failed','V7.0 FIX7 sidebar viewport + professional financial report','overflow-y:auto!important']; [(_ for _ in ()).throw(AssertionError(x)) for x in terms if x not in m+r+c]; print('FIX7 source gates passed')"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests including finance runtime metadata test
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 80000000) { throw "Offline installer missing or setup too small" }

      - name: Upload FIX7 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.0-Finance-Pro-FIX7
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Commit validated FIX7 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/src/lib.rs
          if git diff --cached --quiet; then
            echo "No FIX7 changes to commit"
          else
            git commit -m "V7.0 FIX7: finance pro reports and sidebar viewport fix"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
