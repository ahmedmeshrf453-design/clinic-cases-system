name: AK Services Clean Medical Artwork - Remove Embedded Shortcuts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ak-services-clean-artwork
  cancel-in-progress: false

jobs:
  clean_service_art:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install image processing dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=10,<13"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Separate four medical illustrations from image-embedded shortcuts
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from PIL import Image, ImageOps

          src = Path("public/home-icons/organ-sprite.webp")
          css_path = Path("src/style.css")
          out = Path("public/home-icons/service-art")
          marker = "/* AK_SERVICE_ART_ONLY_NO_EMBEDDED_SHORTCUTS_20261014 */"
          assert src.is_file() and css_path.is_file(), "Required source files missing"
          css = css_path.read_text(encoding="utf-8")
          assert marker not in css, "Clean-artwork patch already applied; refusing duplicate"

          # Existing sprite: 4 columns x 4 rows.
          # Last row contains three service photos plus their unrelated
          # quick-action words; nursing is the last cell of the third row.
          # Crop ONLY the photographic/medical portion, before both text bars.
          source = Image.open(src).convert("RGB")
          width, height = source.size
          assert width == height and width >= 400 and width % 4 == 0, (
              f"Unexpected sprite dimensions: {width} x {height}; stop safely"
          )
          w, h = width // 4, height // 4
          positions = {
              "nursing": (3, 2, 0.56),
              "physio": (0, 3, 0.49),
              "radiology": (1, 3, 0.49),
              "labs": (2, 3, 0.49),
          }

          out.mkdir(parents=True, exist_ok=True)
          for key, (col, row, height_ratio) in positions.items():
              left, top = col*w, row*h
              artwork = source.crop((
                  left, top, left+w, top+round(h*height_ratio)
              ))
              # Pad without stretching so illustrations retain their shape.
              clean = ImageOps.pad(
                  artwork, (w, w),
                  method=Image.Resampling.LANCZOS,
                  color=(240, 249, 253), centering=(0.5, 0.5)
              )
              target = out / f"{key}.webp"
              clean.save(target, "WEBP", lossless=True, method=6)
              assert target.stat().st_size > 500, f"Failed to create {target}"
              print(f"{key}: extracted illustration -> {target}")

          # The existing HTML, labels, drag-and-drop, navigation, and PIN
          # logic stay unchanged. Override the background ONLY in service
          # cards, never on specialty cards or the login/lock screen.
          css_addition = r'''
          /* AK_SERVICE_ART_ONLY_NO_EMBEDDED_SHORTCUTS_20261014 */
          /* Standalone clean artwork from original 4x4 medical sprite. */
          .specialty-home-v7110 #serviceGridHome .photo-sprite-tile.organ-labs {
            background-image:url('/home-icons/service-art/labs.webp')!important;
          }
          .specialty-home-v7110 #serviceGridHome .photo-sprite-tile.organ-radiology {
            background-image:url('/home-icons/service-art/radiology.webp')!important;
          }
          .specialty-home-v7110 #serviceGridHome .photo-sprite-tile.organ-physio {
            background-image:url('/home-icons/service-art/physio.webp')!important;
          }
          .specialty-home-v7110 #serviceGridHome .photo-sprite-tile.organ-nursing {
            background-image:url('/home-icons/service-art/nursing.webp')!important;
          }
          .specialty-home-v7110 #serviceGridHome .photo-sprite-tile:is(
              .organ-labs,.organ-radiology,.organ-physio,.organ-nursing) {
            background-size:100% 100%!important;
            background-position:center!important;
            background-repeat:no-repeat!important;
            background-color:#f0f9fd!important;
          }
          '''
          css_path.write_text(css + "\n" + css_addition, encoding="utf-8")
          print("Scoped CSS appended; PIN lock screen and dashboard wallpaper untouched")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check exact changed files
        shell: pwsh
        run: |
          git add -- src/style.css public/home-icons/service-art
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --cached --name-only | Sort-Object)
          $expected = @(
            'public/home-icons/service-art/labs.webp',
            'public/home-icons/service-art/nursing.webp',
            'public/home-icons/service-art/physio.webp',
            'public/home-icons/service-art/radiology.webp',
            'src/style.css'
          ) | Sort-Object
          if (($changed -join "`n") -ne ($expected -join "`n")) {
            throw "Unexpected changed files: $($changed -join ', ')"
          }
          Write-Host "PASS - four separate icons and dashboard service-card CSS ONLY"

      - name: Validate frontend and backend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows EXE installer
        shell: pwsh
        run: |
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -File -Filter '*.exe')
          if ($files.Count -ne 1) { throw "Expected one EXE, found $($files.Count)" }
          Copy-Item -LiteralPath $files[0].FullName -Destination 'Clinic-Cases-Windows-Setup.exe'
          $hash = (Get-FileHash 'Clinic-Cases-Windows-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Clinic-Cases-Windows-Setup.exe" | Set-Content 'Clinic-Cases-Windows-Setup.exe.sha256' -Encoding ascii

      - name: Commit tested icons only
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove shortcut captions embedded in service card artwork'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rebase origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release tested Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "ak-clean-service-art-$($env:GITHUB_RUN_ID)"
          gh release create $tag 'Clinic-Cases-Windows-Setup.exe' 'Clinic-Cases-Windows-Setup.exe.sha256' --target main --title 'Clinic Cases - Clean Service Artwork' --notes 'Removed Patients/Today/Cashier/Stats captions embedded in the original services sprite. Retained original medical illustrations, service labels, layout, navigation, login and PIN recovery.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Clinic-Cases-Windows-Setup.exe" >> $env:GITHUB_STEP_SUMMARY
