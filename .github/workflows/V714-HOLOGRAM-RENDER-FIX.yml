name: Clinic Cases V7.1.4 Hologram Render FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix hologram SVG rendering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css_p=Path('src/style.css')
          css=css_p.read_text(encoding='utf-8')

          marker='V7.1.3 HOLOGRAM ORGAN ICONS'
          pos=css.rfind(marker)
          if pos < 0:
              raise RuntimeError('V7.1.3 hologram CSS block not found')

          before=css[:pos]
          block=css[pos:]
          count=block.count('%2523')
          if count == 0:
              raise RuntimeError('double-encoded hologram colors/filter refs not found')

          # The SVG payload was URL-encoded twice for # values.
          # %2523 decodes to literal %23 inside the SVG, making stroke colors
          # and filter url(#glow) invalid. Keep one URL-encoding layer only.
          block=block.replace('%2523','%23')
          css=before+block
          css_p.write_text(css,encoding='utf-8')

          for p in [
              Path('src-tauri/tauri.conf.json'),
              Path('src-tauri/Cargo.toml'),
              Path('src-tauri/Cargo.lock'),
              Path('package.json'),
              Path('package-lock.json'),
          ]:
              s=p.read_text(encoding='utf-8')
              s=s.replace('7.1.3','7.1.4')
              p.write_text(s,encoding='utf-8')

          main_p=Path('src/main.ts')
          main=main_p.read_text(encoding='utf-8')
          main=main.replace('V7.1.3 • HOLOGRAM ORGAN ICONS','V7.1.4 • HOLOGRAM RENDER FIX')
          main_p.write_text(main,encoding='utf-8')
          print(f'Fixed {count} double-encoded SVG hash references')
          PY

      - name: Verify hologram SVG data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          c=Path('src/style.css').read_text(encoding='utf-8')
          t=Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8')
          m=Path('src/main.ts').read_text(encoding='utf-8')
          block=c[c.rfind('V7.1.3 HOLOGRAM ORGAN ICONS'):]
          assert '%2523' not in block
          assert 'stroke%3D%27%2387efff%27' in block
          assert 'url%28%23glow%29' in block
          assert '7.1.4' in t
          assert 'V7.1.4 • HOLOGRAM RENDER FIX' in m
          print('Hologram render fix verified')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        env:
          RUST_BACKTRACE: '1'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify installer
        shell: pwsh
        run: |
          $i=Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Where-Object { $_.Name -match "7\.1\.4" } | Select-Object -First 1
          if(-not $i){throw 'V7.1.4 installer missing'}
          if($i.Length -lt 80000000){throw 'Installer too small'}

      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.1.4-Hologram-Render-FIX
          path: src-tauri/target/release/bundle/nsis/*7.1.4*-setup.exe
          if-no-files-found: error

      - name: Commit validated V7.1.4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'V7.1.4: fix hologram SVG rendering'
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
