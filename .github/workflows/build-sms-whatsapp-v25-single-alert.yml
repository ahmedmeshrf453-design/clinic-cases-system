      - name: Verify single-alert dedupe fix
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionName = "3.0.4"' app/build.gradle.kts
          grep -q 'versionCode = 34' app/build.gradle.kts
          grep -q 'BookingAlertGate.shouldAlert' app/src/main/java/com/alakad/smsforwarder/SmsReceiver.kt
          grep -q 'setOnlyAlertOnce(true)' app/src/main/java/com/alakad/smsforwarder/SmsReceiver.kt
          grep -q 'SAME_BOOKING_WINDOW_MS = 120_000L' app/src/main/java/com/alakad/smsforwarder/BookingAlertGate.kt
          grep -q 'MULTIPART_BURST_WINDOW_MS = 10_000L' app/src/main/java/com/alakad/smsforwarder/BookingAlertGate.kt
          grep -q 'MAX_MESSAGES = 30_000' app/src/main/java/com/alakad/smsforwarder/MessageStore.kt
          grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_SMS' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml
          test -s app/stable-release.jks

      - name: Build installable release APK
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Hagz-AlHalat-v3.0.4-SINGLE-ALERT.apk"
          sha256sum "$GITHUB_WORKSPACE/Hagz-AlHalat-v3.0.4-SINGLE-ALERT.apk" > "$GITHUB_WORKSPACE/Hagz-AlHalat-v3.0.4-SINGLE-ALERT.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagz-AlHalat-v3.0.4-SINGLE-ALERT
          path: |
            Hagz-AlHalat-v3.0.4-SINGLE-ALERT.apk
            Hagz-AlHalat-v3.0.4-SINGLE-ALERT.sha256
          retention-days: 30
