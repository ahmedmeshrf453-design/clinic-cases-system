name: Clinic Cases V3.2 Al Akkad Header

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Al Akkad clinic logo
        shell: bash
        env:
          LOGO_B64: ""
        run: |
          set -euo pipefail
          mkdir -p public
          python -c "import os,base64; open('public/clinic-logo-header.jpg','wb').write(base64.b64decode(os.environ['LOGO_B64']))"

      - name: Apply V3.2 synchronized clinic header
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          python -c "import os,base64; open('_v32_patch.py','wb').write(base64.b64decode(os.environ['PATCH_B64']))"
          python _v32_patch.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Validate frontend
        shell: bash
        run: npm run build

      - name: Validate Rust
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build V3.2 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify Setup EXE
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer:" $installer.FullName

      - name: Commit validated V3.2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css public/clinic-logo-header.jpg package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V3.2: add Al Akkad branded synchronized header"
            git push
          fi

      - name: Upload V3.2 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V3.2-Al-Akkad-Header-Installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
