name: Clinic Cases V7.0 Runtime SQL FIX4 Corrected

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply FIX4 corrected patch
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64; exec(base64.b64decode('').decode('utf-8'))"

      - name: Verify FIX4 source
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; s=Path('src-tauri/src/lib.rs').read_text(encoding='utf-8'); assert \"'clinic' AS service_type\" in s; assert 'v.id AS service_id' in s; assert 'p.id AS patient_id' in s; assert 'AS service_date' in s; assert 'AS charge' in s; assert 'AS paid' in s; assert 'cashier runtime query failed' in s; print('FIX4 source gates passed')"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests including V7 runtime smoke
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 80000000) { throw "Offline installer missing or setup too small" }

      - name: Upload FIX4 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.0-Runtime-FIX4
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Commit validated FIX4 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V7.0 FIX4: fix cashier runtime SQL aliases"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
