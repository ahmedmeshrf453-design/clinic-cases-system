name: Clinic Cases V7.1.38 Backup Integrity
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Add atomic validated backup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,json
          p=Path('src-tauri/src/lib.rs');s=p.read_text(encoding='utf-8')
          start=s.index('fn checkpoint_and_copy(state: &AppState, target: &PathBuf) -> Result<(), String> {')
          end=s.index('\nfn prune_backup_prefix(',start)
          old=s[start:end]
          assert 'fs::copy(&state.db_path, target)' in old and 'wal_checkpoint(FULL)' in old
          new="""fn checkpoint_and_copy(state: &AppState, target: &PathBuf) -> Result<(), String> {
              let conn = open_db(state)?;
              let checkpoint: (i64, i64, i64) = conn.query_row(
                  "PRAGMA wal_checkpoint(TRUNCATE)", [],
                  |r| Ok((r.get(0)?, r.get(1)?, r.get(2)?))
              ).map_err(|e| e.to_string())?;
              if checkpoint.0 != 0 || checkpoint.1 != checkpoint.2 {
                  return Err("لا يمكن إنشاء نسخة متسقة أثناء انشغال قاعدة البيانات".into());
              }
              let dir = target.parent().ok_or("مسار النسخة غير صالح")?;
              fs::create_dir_all(dir).map_err(|e| e.to_string())?;
              let temp = dir.join(format!(".backup-{}.tmp", Uuid::new_v4()));
              let result = (|| -> Result<(), String> {
                  fs::copy(&state.db_path, &temp).map_err(|e| e.to_string())?;
                  let check = Connection::open_with_flags(&temp, rusqlite::OpenFlags::SQLITE_OPEN_READ_ONLY)
                      .map_err(|e| e.to_string())?;
                  let integrity: String = check.query_row("PRAGMA integrity_check", [], |r| r.get(0))
                      .map_err(|e| e.to_string())?;
                  if integrity != "ok" { return Err("النسخة غير سليمة، لن يتم اعتمادها".into()); }
                  drop(check);
                  if target.exists() { return Err("يوجد ملف بنفس اسم النسخة".into()); }
                  fs::rename(&temp, target).map_err(|e| e.to_string())?;
                  Ok(())
              })();
              if result.is_err() { let _ = fs::remove_file(&temp); }
              result
          }
          """
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
          for f in ('package.json','src-tauri/tauri.conf.json'):
           p=Path(f);o=json.loads(p.read_text(encoding='utf-8'));assert o['version']=='7.1.37';o['version']='7.1.38';p.write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for f in ('package-lock.json','src-tauri/Cargo.toml','src-tauri/Cargo.lock'):
           p=Path(f);s=p.read_text(encoding='utf-8')
           if f.endswith('.json'):
            s,n=re.subn(r'("version"\s*:\s*")7\.1\.37(")',r'\g<1>7.1.38\2',s,count=2);assert n==2
           elif f.endswith('.toml'):
            s,n=re.subn(r'(?m)^version\s*=\s*"7\.1\.37"\s*$','version = "7.1.38"',s,count=1);assert n==1
           else:
            s,n=re.subn(r'(name\s*=\s*"clinic-cases-system"\s*\nversion\s*=\s*")7\.1\.37(")',r'\g<1>7.1.38\2',s,count=1);assert n==1
           p.write_text(s,encoding='utf-8')
          print('Backup check patch installed')
          
          PY
      - name: Install dependencies
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Windows installer
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-V7.1.38-Backup-Integrity
          path: src-tauri/target/release/bundle/nsis/*7.1.38*-setup.exe
          if-no-files-found: error
      - name: Commit only after green
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/lib.rs package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m 'V7.1.38 validated atomic backups'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
