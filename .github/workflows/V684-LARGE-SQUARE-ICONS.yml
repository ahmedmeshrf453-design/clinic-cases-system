      - name: Verify functionality untouched
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/main.sha256"
          sha256sum -c "$RUNNER_TEMP/labCatalog.sha256"
          sha256sum -c "$RUNNER_TEMP/lab2labCatalog.sha256"
          sha256sum -c "$RUNNER_TEMP/lab2labArabic.sha256"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: V6.8.4 icon visibility gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          css = Path("src/style.css").read_text(encoding="utf-8")
          pkg = json.loads(Path("package.json").read_text(encoding="utf-8"))
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          assert pkg["version"] == "6.8.4"
          assert conf["version"] == "6.8.4"
          assert "V6.8.4 large square visible icons" in css

          for selector in [
              ".nav-icon",
              ".patient-feature-card-icon",
              ".settings-section-icon",
              ".icon-action",
              ".modal-close",
              ".modal-back-arrow",
              ".page-back-btn",
              ".stat-icon",
              ".lab2lab-lock-icon",
              ".doctor-avatar"
          ]:
              assert selector in css, selector

          assert "width:42px !important" in css
          assert "width:48px !important" in css
          assert "aspect-ratio:1/1" in css
          print("V6.8.4 large square icon gate passed")
          PY

      - name: Build V6.8.4 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 80000000) { throw "Offline WebView2 installer missing or setup too small" }

      - name: Upload V6.8.4 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V6.8.4-Large-Square-Icons
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Commit validated V6.8.4 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/style.css package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true

          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V6.8.4: larger square icons for visibility"
          fi

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
