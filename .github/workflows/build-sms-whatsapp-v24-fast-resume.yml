      - name: Verify fast-resume performance fix
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionName = "3.0.3"' app/build.gradle.kts
          grep -q 'versionCode = 33' app/build.gradle.kts
          grep -q 'refreshFromStoreAsync()' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          ! grep -q 'refreshFromStore()' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'MessageStore.dataVersion(this)' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'fun dataVersion' app/src/main/java/com/alakad/smsforwarder/MessageStore.kt
          grep -q '5 \* 60 \* 1000L' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'displayBodyCache' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'bookingDateCache' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'MAX_MESSAGES = 30_000' app/src/main/java/com/alakad/smsforwarder/MessageStore.kt
          grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_SMS' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml
          test -s app/stable-release.jks

      - name: Build installable release APK
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Hagz-AlHalat-v3.0.3-FAST-RESUME.apk"
          sha256sum "$GITHUB_WORKSPACE/Hagz-AlHalat-v3.0.3-FAST-RESUME.apk" > "$GITHUB_WORKSPACE/Hagz-AlHalat-v3.0.3-FAST-RESUME.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagz-AlHalat-v3.0.3-FAST-RESUME
          path: |
            Hagz-AlHalat-v3.0.3-FAST-RESUME.apk
            Hagz-AlHalat-v3.0.3-FAST-RESUME.sha256
          retention-days: 30
