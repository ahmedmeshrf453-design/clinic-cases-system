      - name: Verify sound fix and notification actions
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionName = "2.6.0"' app/build.gradle.kts
          grep -q 'versionCode = 26' app/build.gradle.kts
          grep -q 'booking_arrivals_v26_sound' app/src/main/java/com/alakad/smsforwarder/SmsReceiver.kt
          grep -q 'R.raw.booking_alert' app/src/main/java/com/alakad/smsforwarder/SmsReceiver.kt
          grep -q 'addAction(android.R.drawable.ic_menu_send, "إرسال"' app/src/main/java/com/alakad/smsforwarder/SmsReceiver.kt
          grep -q 'addAction(android.R.drawable.ic_menu_edit, "تعديل"' app/src/main/java/com/alakad/smsforwarder/SmsReceiver.kt
          grep -q 'addAction(android.R.drawable.ic_menu_delete, "حذف"' app/src/main/java/com/alakad/smsforwarder/SmsReceiver.kt
          grep -q 'BookingActionActivity' app/src/main/AndroidManifest.xml
          grep -q 'NotificationActionReceiver' app/src/main/AndroidManifest.xml
          grep -q 'fullBookingSend' app/src/main/res/layout/activity_fullscreen_booking.xml
          grep -q 'fullBookingEdit' app/src/main/res/layout/activity_fullscreen_booking.xml
          grep -q 'fullBookingDelete' app/src/main/res/layout/activity_fullscreen_booking.xml
          test -s app/src/main/res/raw/booking_alert.wav
          grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml
          test -s app/stable-release.jks

      - name: Build installable APK
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.6-Notification-Actions-Sound.apk"
          sha256sum "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.6-Notification-Actions-Sound.apk" > "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.6-Notification-Actions-Sound.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagz-AlHalat-v2.6-Notification-Actions-Sound
          path: |
            Hagz-AlHalat-v2.6-Notification-Actions-Sound.apk
            Hagz-AlHalat-v2.6-Notification-Actions-Sound.sha256
          retention-days: 30
