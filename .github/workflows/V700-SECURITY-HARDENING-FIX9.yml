name: Clinic Cases V7.0 Security Hardening FIX9

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Security Hardening FIX9
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/fix9.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix9.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix9.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix9.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix9.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix9.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix9.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix9.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix9.b64"
          printf '%s' '' >> "$RUNNER_TEMP/fix9.b64"
          python - "$RUNNER_TEMP/fix9.b64" <<'PY'
          import base64
          import pathlib
          import sys
          payload = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          exec(base64.b64decode(payload).decode("utf-8"))
          PY
      - name: Verify FIX9 source
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; r=Path('src-tauri/src/lib.rs').read_text(encoding='utf-8'); c=Path('src-tauri/Cargo.toml').read_text(encoding='utf-8'); terms=['argon2 = \"0.5\"','fn argon2_hash_pin','fn pin_rate_limit_check','fn attachment_signature_ok','fn stored_attachment_path_is_safe','fn backup_schema_compatible','CLINIC_APPLICATION_ID','MAX_BACKUP_BYTES','prune_backup_prefix','security_hardening_argon2_rate_limit_and_app_identity','attachment_signature_checks_real_content']; [(_ for _ in ()).throw(AssertionError(x)) for x in terms if x not in r+c]; assert 'sqlcipher' not in c.lower(); print('FIX9 source gates passed — patient DB remains unencrypted')"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        shell: bash
        run: npm install
      - name: Frontend build
        shell: bash
        run: npm run build
      - name: Rust tests including security hardening tests
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        shell: bash
        run: npx tauri build --bundles nsis
      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 80000000) { throw "Offline installer missing or setup too small" }
      - name: Upload FIX9 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.0-Security-Hardening-FIX9
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Commit validated FIX9 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/src/lib.rs
          if git diff --cached --quiet; then
            echo "No FIX9 changes to commit"
          else
            git commit -m "V7.0 FIX9: security hardening without patient data encryption"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
