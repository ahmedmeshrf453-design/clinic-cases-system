name: Clinic Cases V7.1.9B Real Image Tiles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V7.1.9B real image tiles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          main_p=Path('src/main.ts')
          css_p=Path('src/style.css')
          tauri_p=Path('src-tauri/tauri.conf.json')
          cargo_p=Path('src-tauri/Cargo.toml')
          lock_p=Path('src-tauri/Cargo.lock')
          pkg_p=Path('package.json')
          pkglock_p=Path('package-lock.json')

          m=main_p.read_text(encoding='utf-8')
          c=css_p.read_text(encoding='utf-8')

          # bump app version
          for p in [tauri_p,pkg_p]:
              obj=json.loads(p.read_text(encoding='utf-8'))
              obj['version']='7.1.9'
              p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          pl=pkglock_p.read_text(encoding='utf-8')
          pl=re.sub(r'("version"\s*:\s*")7\.1\.\d+(")',r'\g<1>7.1.9\2',pl,count=2)
          pkglock_p.write_text(pl,encoding='utf-8')

          cg=cargo_p.read_text(encoding='utf-8')
          cg=re.sub(r'(?m)^version\s*=\s*"7\.1\.\d+"\s*$', 'version = "7.1.9"',cg,count=1)
          cargo_p.write_text(cg,encoding='utf-8')

          cl=lock_p.read_text(encoding='utf-8')
          cl=re.sub(r'(name\s*=\s*"clinic-cases-system"\s*\nversion\s*=\s*")7\.1\.\d+(")',r'\g<1>7.1.9\2',cl,count=1)
          lock_p.write_text(cl,encoding='utf-8')

          # use the already-committed 4x4 real organ sprite, so workflow stays tiny and reliable
          start=m.index('const HOME_SPECIALTIES=[')
          end=m.index('\nconst HOME_SPECIALTY_ORDER_KEY=',start)
          defs="""const HOME_SPECIALTIES=[
            {key:'urology',label:'مسالك بولية وذكورة',iconClass:'organ-urology',keys:['مسالك','ذكورة']},
            {key:'internal',label:'باطنة وجهاز هضمي',iconClass:'organ-internal',keys:['باطنة','جهاز هضمي']},
            {key:'ortho',label:'عظام ومفاصل',iconClass:'organ-ortho',keys:['عظام','مفاصل']},
            {key:'surgery',label:'جراحة عامة ومناظير',iconClass:'organ-surgery',keys:['جراحة عامة','مناظير']},
            {key:'eye',label:'عيون',iconClass:'organ-eye',keys:['عيون','رمد','ophthalm']},
            {key:'neuro',label:'مخ وأعصاب وعمود فقري',iconClass:'organ-neuro',keys:['مخ','أعصاب','اعصاب','عمود فقري']},
            {key:'obgyn',label:'نساء وتوليد',iconClass:'organ-obgyn',keys:['نساء','توليد','حقن مجهري','تأخر الإنجاب']},
            {key:'ent',label:'أنف وأذن وحنجرة',iconClass:'organ-ent',keys:['أنف','انف','أذن','اذن','حنجرة']},
            {key:'nutrition',label:'تغذية علاجية',iconClass:'organ-nutrition',keys:['تغذية']},
            {key:'vascular',label:'أوعية دموية وقدم سكري',iconClass:'organ-vascular',keys:['أوعية','اوعية','قدم سكري']},
            {key:'audiology',label:'سمع واتزان',iconClass:'organ-audiology',keys:['سمع','اتزان']}
          ] as const;

          const HOME_SERVICES=[
            {key:'labs',screen:'labs' as Screen,label:'التحاليل',iconClass:'organ-labs'},
            {key:'radiology',screen:'radiology' as Screen,label:'الأشعة',iconClass:'organ-radiology'},
            {key:'physio',screen:'physio' as Screen,label:'العلاج الطبيعي',iconClass:'organ-physio'},
            {key:'nursing',screen:'nursing' as Screen,label:'خدمات التمريض',iconClass:'organ-nursing'}
          ] as const;
          """
          m=m[:start]+defs+m[end:]

          m=re.sub(r"const HOME_SPECIALTY_ORDER_KEY='[^']+';","const HOME_SPECIALTY_ORDER_KEY='clinicCases.home.specialties.v719b';",m)
          m=re.sub(r"const HOME_SERVICE_ORDER_KEY='[^']+';","const HOME_SERVICE_ORDER_KEY='clinicCases.home.services.v719b';",m)
          m=re.sub(r'specialty-home specialty-home-v7[0-9a-zA-Z-]*','specialty-home specialty-home-v719b',m,count=1)

          # replace icon markup only; keep drag/order behavior untouched
          m=re.sub(r'<span class="specialty-card-icon[^>]*>.*?</span>',
                   '<span class="specialty-card-icon photo-sprite-tile ${x.iconClass}"></span>',m,count=1,flags=re.S)
          m=re.sub(r'<span class="clinic-service-icon[^>]*>.*?</span>',
                   '<span class="clinic-service-icon photo-sprite-tile ${x.iconClass}"></span>',m,count=1,flags=re.S)
          m=re.sub(r'V7\.1\.\d+ • [^<]+','V7.1.9 • REAL IMAGE TILES',m,count=1)

          if 'V7.1.9B REAL IMAGE TILES' not in c:
              c += """

          /* ===== V7.1.9B REAL IMAGE TILES ===== */
          .specialty-home-v719b{background:#f4f8fb!important}
          .specialty-home-v719b .specialty-grid{grid-template-columns:repeat(6,minmax(150px,1fr));gap:10px}
          .specialty-home-v719b .clinic-services-grid{grid-template-columns:repeat(4,minmax(170px,1fr));gap:10px}
          .specialty-home-v719b .home-sortable-card{position:relative;overflow:visible;cursor:grab;user-select:none}
          .specialty-home-v719b .home-sortable-card:active{cursor:grabbing}
          .specialty-home-v719b .specialty-card,.specialty-home-v719b .clinic-service-card{
            position:relative!important;min-height:108px!important;padding:10px 8px 10px!important;
            border-radius:17px!important;border:1px solid #d7e4ee!important;background:#fff!important;
            box-shadow:0 7px 15px rgba(20,50,74,.045)!important;display:flex!important;flex-direction:column!important;
            align-items:center!important;justify-content:center!important;gap:6px!important;text-align:center!important
          }
          .specialty-home-v719b .specialty-card:hover,.specialty-home-v719b .clinic-service-card:hover{
            transform:translateY(-1px)!important;border-color:#bfdae8!important;box-shadow:0 10px 20px rgba(20,50,74,.075)!important
          }
          .specialty-home-v719b .specialty-card-arrow,
          .specialty-home-v719b .specialty-card-copy small,
          .specialty-home-v719b .clinic-service-copy small{display:none!important}
          .specialty-home-v719b .specialty-card-drag{
            position:absolute!important;top:7px!important;right:7px!important;font-size:13px!important;color:#9db0bd!important;
            letter-spacing:-2px!important;line-height:1!important;padding:2px!important;z-index:2!important
          }
          .specialty-home-v719b .specialty-card-copy,.specialty-home-v719b .clinic-service-copy{
            display:flex!important;align-items:center!important;justify-content:center!important;text-align:center!important
          }
          .specialty-home-v719b .specialty-card-copy strong,.specialty-home-v719b .clinic-service-copy strong{
            font-size:13px!important;font-weight:800!important;line-height:1.3!important;color:#153a5a!important
          }
          .specialty-home-v719b .photo-sprite-tile{
            width:58px!important;height:58px!important;min-width:58px!important;min-height:58px!important;border-radius:14px!important;
            display:block!important;padding:0!important;margin:0 auto!important;overflow:hidden!important;
            background-image:url('/home-icons/organ-sprite.webp')!important;background-size:400% 400%!important;
            background-repeat:no-repeat!important;border:1px solid #dbe8ef!important;
            box-shadow:0 5px 14px rgba(41,122,165,.11),0 0 0 3px rgba(84,203,255,.07)!important
          }
          .specialty-home-v719b .organ-urology{background-position:0% 0%!important}
          .specialty-home-v719b .organ-internal{background-position:33.33% 0%!important}
          .specialty-home-v719b .organ-ortho{background-position:66.67% 0%!important}
          .specialty-home-v719b .organ-surgery{background-position:100% 0%!important}
          .specialty-home-v719b .organ-eye{background-position:0% 33.33%!important}
          .specialty-home-v719b .organ-neuro{background-position:33.33% 33.33%!important}
          .specialty-home-v719b .organ-obgyn{background-position:66.67% 33.33%!important}
          .specialty-home-v719b .organ-ent{background-position:100% 33.33%!important}
          .specialty-home-v719b .organ-audiology{background-position:0% 66.67%!important}
          .specialty-home-v719b .organ-vascular{background-position:33.33% 66.67%!important}
          .specialty-home-v719b .organ-nutrition{background-position:66.67% 66.67%!important}
          .specialty-home-v719b .organ-nursing{background-position:100% 66.67%!important}
          .specialty-home-v719b .organ-physio{background-position:0% 100%!important}
          .specialty-home-v719b .organ-radiology{background-position:33.33% 100%!important}
          .specialty-home-v719b .organ-labs{background-position:66.67% 100%!important}
          .specialty-home-v719b .home-section-title{margin-bottom:6px!important}
          .specialty-home-v719b .home-section-title strong{font-size:25px!important;color:#163a59!important}
          .specialty-home-v719b .home-section-title small{color:#899daa!important}
          .specialty-home-v719b .specialty-home-hero{background:#fff!important;border:1px solid #d9e6ef!important;padding:11px 16px!important;margin-bottom:8px!important}
          .specialty-home-v719b .specialty-home-hero h2{font-size:20px!important;color:#163a59!important}
          .specialty-home-v719b .specialty-home-hero p{font-size:12px!important;color:#7f919e!important}
          .specialty-home-v719b .specialty-home-day{background:#eef7fb!important;color:#163a59!important;border:1px solid #dce8f0!important;padding:8px 10px!important}
          .specialty-home-v719b .home-quick-actions button{background:#fff!important;border:1px solid #d9e6ef!important;color:#21455f!important;min-height:39px!important;padding:8px 9px!important}
          .specialty-home-v719b .v71-build-stamp{font-size:10px!important;color:#9aabb5!important}
          .specialty-home-v719b .is-dragging{opacity:.55!important;transform:scale(.98)!important}
          .specialty-home-v719b .is-drag-over{outline:2px dashed #9fdcff!important;outline-offset:-4px!important}
          @media(max-width:1400px){.specialty-home-v719b .specialty-grid{grid-template-columns:repeat(5,minmax(150px,1fr))}}
          @media(max-width:1120px){.specialty-home-v719b .specialty-grid,.specialty-home-v719b .clinic-services-grid{grid-template-columns:repeat(4,minmax(145px,1fr))}}
          @media(max-width:860px){.specialty-home-v719b .specialty-grid,.specialty-home-v719b .clinic-services-grid{grid-template-columns:repeat(2,minmax(145px,1fr))}}
          """

          main_p.write_text(m,encoding='utf-8')
          css_p.write_text(c,encoding='utf-8')
          print('V7.1.9B real image sprite tiles applied')
          PY

      - name: Verify V7.1.9B
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          m=Path('src/main.ts').read_text(encoding='utf-8')
          c=Path('src/style.css').read_text(encoding='utf-8')
          t=json.loads(Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          p=Path('public/home-icons/organ-sprite.webp')
          checks={
           'version':t.get('version')=='7.1.9',
           'marker':'REAL IMAGE TILES' in m,
           'class':'specialty-home-v719b' in m,
           'sprite_markup':'photo-sprite-tile' in m,
           'sprite_css':'V7.1.9B REAL IMAGE TILES' in c,
           'sprite_file':p.exists() and p.stat().st_size>30000,
          }
          for k,v in checks.items():print(k,'OK' if v else 'FAIL')
          assert all(checks.values()),checks
          print('V7.1.9B verified')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "NSIS build attempt $attempt/3"
            if npx tauri build --bundles nsis; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1

      - name: Verify installer
        shell: pwsh
        run: |
          $i=Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Where-Object { $_.Name -match "7\.1\.9" } | Select-Object -First 1
          if(-not $i){throw "V7.1.9 installer missing"}
          if($i.Length -lt 80000000){throw "Installer too small"}

      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.1.9B-Real-Image-Tiles
          path: src-tauri/target/release/bundle/nsis/*7.1.9*-setup.exe
          if-no-files-found: error

      - name: Commit validated V7.1.9B
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "V7.1.9B: real image tiles on compact home"; fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
