      - name: Patch Lab2Lab UI and bilingual search
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          p = Path("src/main.ts")
          s = p.read_text(encoding="utf-8")

          import_old = "import { LAB2LAB_SOURCE } from './lab2labCatalog';"
          import_new = "import { LAB2LAB_SOURCE } from './lab2labCatalog';\nimport { LAB2LAB_ARABIC } from './lab2labArabic';"
          if "from './lab2labArabic'" not in s:
              if import_old not in s:
                  raise RuntimeError("Lab2Lab import marker not found")
              s = s.replace(import_old, import_new, 1)

          selected_marker = "  let selected: Lab2LabPriceRow | null = null;\n\n  const norm = (value: string) => value.trim().toLocaleLowerCase();"
          selected_new = "  let selected: Lab2LabPriceRow | null = null;\n  const arabicNameFor = (id: number) => LAB2LAB_ARABIC[id] || '';\n\n  const norm = (value: string) => value.trim().toLocaleLowerCase();"
          if "const arabicNameFor" not in s:
              if selected_marker not in s:
                  raise RuntimeError("Lab2Lab selected marker not found")
              s = s.replace(selected_marker, selected_new, 1)

          search_old = "    return rows.filter(row => norm(row.testName).includes(q));"
          search_new = "    return rows.filter(row => norm(row.testName).includes(q) || norm(arabicNameFor(row.id)).includes(q));"
          if search_new not in s:
              if search_old not in s:
                  raise RuntimeError("Lab2Lab search marker not found")
              s = s.replace(search_old, search_new, 1)

          selected_old = '      <div class="lab2lab-selected-main">\n        <span>اسم التحليل</span>\n        <strong class="ltr">${esc(selected.testName)}</strong>\n      </div>'
          selected_new_html = '      <div class="lab2lab-selected-main">\n        <span>اسم التحليل</span>\n        <strong class="ltr">${esc(selected.testName)}</strong>\n        <small dir="rtl" style="display:block;margin-top:6px;font-size:14px;color:#526b7a;font-weight:800">${esc(arabicNameFor(selected.id))}</small>\n      </div>'
          if 'arabicNameFor(selected.id)' not in s:
              if selected_old not in s:
                  raise RuntimeError("Selected Lab2Lab card marker not found")
              s = s.replace(selected_old, selected_new_html, 1)

          option_old = '      <button type="button" class="lab2lab-option" data-lab2lab-id="${row.id}">\n        <span class="ltr">${esc(row.testName)}</span>\n        <strong class="ltr">${esc(row.price)}</strong>\n      </button>'
          option_new = '      <button type="button" class="lab2lab-option" data-lab2lab-id="${row.id}">\n        <span>\n          <b class="ltr" style="display:block">${esc(row.testName)}</b>\n          <small dir="rtl" style="display:block;margin-top:4px;font-size:12px;color:#627786;font-weight:700">${esc(arabicNameFor(row.id))}</small>\n        </span>\n        <strong class="ltr">${esc(row.price)}</strong>\n      </button>'
          if 'arabicNameFor(row.id)' not in s:
              if option_old not in s:
                  raise RuntimeError("Lab2Lab dropdown option marker not found")
              s = s.replace(option_old, option_new, 1)

          placeholder_old = 'placeholder="اختر من القائمة أو اكتب اسم التحليل..."'
          placeholder_new = 'placeholder="اكتب بالعربي أو الإنجليزي، أو اختر من القائمة..."'
          s = s.replace(placeholder_old, placeholder_new, 1)

          help_old = '<div class="lab2lab-help">اضغط لعرض كل التحاليل، أو اكتب لتصفية القائمة ثم اختر التحليل.</div>'
          help_new = '<div class="lab2lab-help">كل تحليل يظهر بالعربي والإنجليزي • البحث يعمل بالاسمين.</div>'
          s = s.replace(help_old, help_new, 1)

          p.write_text(s, encoding="utf-8")

          pkg_path = Path("package.json")
          pkg = json.loads(pkg_path.read_text(encoding="utf-8"))
          pkg["version"] = "6.8.2"
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          conf_path = Path("src-tauri/tauri.conf.json")
          conf = json.loads(conf_path.read_text(encoding="utf-8"))
          conf["version"] = "6.8.2"
          conf_path.write_text(json.dumps(conf, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          cargo_path = Path("src-tauri/Cargo.toml")
          cargo = cargo_path.read_text(encoding="utf-8")
          cargo = re.sub(r'(?m)^version\s*=\s*"6\.8\.1"\s*$', 'version = "6.8.2"', cargo, count=1)
          cargo_path.write_text(cargo, encoding="utf-8")
          PY

      - name: Verify main clinic lab catalog untouched
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/labCatalog.sha256"

      - name: Verify Arabic catalog completeness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          a = Path("src/lab2labArabic.ts").read_text(encoding="utf-8")
          ids = {int(x) for x in re.findall(r'^\s*(\d+):', a, flags=re.M)}
          assert ids == set(range(1, 332)), (len(ids), min(ids), max(ids))
          assert any('\u0600' <= ch <= '\u06ff' for ch in a)
          print("331 Arabic Lab2Lab names verified")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: V6.8.2 bilingual gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          main = Path("src/main.ts").read_text(encoding="utf-8")
          arabic = Path("src/lab2labArabic.ts").read_text(encoding="utf-8")
          pkg = json.loads(Path("package.json").read_text(encoding="utf-8"))
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          assert pkg["version"] == "6.8.2"
          assert conf["version"] == "6.8.2"
          assert "LAB2LAB_ARABIC" in main
          assert "arabicNameFor(row.id)" in main
          assert "arabicNameFor(selected.id)" in main
          assert "اكتب بالعربي أو الإنجليزي" in main
          assert "صورة دم كاملة CBC" in arabic
          assert "السكر التراكمي HbA1c" in arabic
          assert "هرمون الغدة الدرقية TSH" in arabic
          assert "فيتامين د 25 هيدروكسي D3" in arabic
          print("V6.8.2 bilingual Lab2Lab gate passed")
          PY

      - name: Build V6.8.2 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 80000000) { throw "Offline WebView2 installer missing or setup too small" }

      - name: Upload V6.8.2 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V6.8.2-Lab2Lab-Arabic-English
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Commit validated V6.8.2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main.ts src/lab2labArabic.ts package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true

          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V6.8.2: Arabic names and bilingual Lab2Lab search"
          fi

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
