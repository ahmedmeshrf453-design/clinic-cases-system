name: AK Patient Print Header Footer Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ak-patient-print-header-footer-fix
  cancel-in-progress: false

jobs:
  fix-and-package:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Apply targeted patient print update
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path('src/main.ts')
          c = Path('src/style.css')
          s = p.read_text(encoding='utf-8')
          css = c.read_text(encoding='utf-8')
          begin = 'function patientExportSheet(title: string, subtitle: string, body: string) {'
          end = 'function buildPatientQrPayload(details: PatientDetails) {'
          if begin not in s or end not in s:
              raise RuntimeError('Patient-print template not found; source was changed')
          a = s.index(begin)
          b = s.index(end, a)
          template = s[a:b]
          brand_old = '<div>\n          <div class="patient-print-slogan">'
          brand_new = '<div class="patient-print-brand-copy">\n          <div class="patient-print-clinic-name">${esc(appSettings.clinicName)}</div>\n          <div class="patient-print-slogan">'
          brand_new = brand_new.replace('\\n', '\n')
          brand_old = brand_old.replace('\\n', '\n')
          old_wa = '<span class="patient-print-footer-badge wa">WA</span>'
          old_phone = '<span class="patient-print-footer-badge phone">☎</span>'
          if 'patient-print-clinic-name' not in template:
              if template.count(brand_old) != 1 or old_wa not in template or old_phone not in template:
                  raise RuntimeError('Print template does not match expected original; no changes saved')
              template = template.replace(brand_old, brand_new, 1)
              template = template.replace(old_wa, '<span>واتساب</span>', 1)
              template = template.replace(old_phone, '<span>تليفون</span>', 1)
              s = s[:a] + template + s[b:]
              p.write_text(s, encoding='utf-8')
          marker = '/* AK_PATIENT_PRINT_HEADER_FOOTER_FIX_20261014 */'
          if marker not in css:
              css += '\n' + marker + '''
          .patient-export-document .patient-print-brand-copy{display:grid;gap:6px;justify-items:center;text-align:center}
          .patient-export-document .patient-print-clinic-name{margin-top:12px;font-size:28px;line-height:1.35;font-weight:900;color:#0a2342}
          .patient-export-document .patient-print-slogan{margin-top:2px;font-size:24px;line-height:1.3;font-weight:900;letter-spacing:0;color:#087f8a}
          .patient-export-document .patient-print-address{margin-top:4px;max-width:820px;font-size:14px;line-height:1.9;font-weight:700;color:#5f7686}
          .patient-export-document .patient-export-title h2{font-size:31px;line-height:1.35;font-weight:900}
          .patient-export-document .patient-export-title p{font-size:18px;line-height:1.7;font-weight:800}
          .patient-export-document .patient-print-footer{gap:28px}
          .patient-export-document .patient-print-footer-item{gap:8px}
          .patient-export-document .patient-print-footer-item span{font-size:12px;font-weight:900;color:#738698}
          .patient-export-document .patient-print-footer-item strong{font-size:18px;color:#0a2342}
          .patient-export-document .patient-file-event.created{display:none!important}
          '''
              c.write_text(css, encoding='utf-8')
          print('Patient print template updated without modifying underlying records')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify targeted changes only
        shell: pwsh
        run: |
          git add -- src/main.ts src/style.css
          $changed = @(git diff --cached --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin @('src/main.ts','src/style.css') })
          if ($unexpected.Count -gt 0) { throw "Unexpected changes: $($unexpected -join ', ')" }
          if (-not (Select-String -Path src/main.ts -Pattern 'patient-print-clinic-name' -Quiet)) { throw 'Clinic name missing' }
          if (-not (Select-String -Path src/style.css -Pattern 'AK_PATIENT_PRINT_HEADER_FOOTER_FIX_20261014' -Quiet)) { throw 'CSS change missing' }
          Write-Host 'Scope and changes OK'
      - name: Install packages and build UI
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows EXE installer
        shell: pwsh
        run: |
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -File -Filter '*.exe')
          if ($files.Count -lt 1) { throw 'No NSIS EXE was built' }
          Copy-Item -LiteralPath $files[0].FullName -Destination 'Clinic-Cases-Windows-Setup.exe'
          $hash = (Get-FileHash 'Clinic-Cases-Windows-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Clinic-Cases-Windows-Setup.exe" | Set-Content 'Clinic-Cases-Windows-Setup.exe.sha256' -Encoding ascii
      - name: Commit only successful fix
        shell: pwsh
        run: |
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Already fixed'; exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix patient print report header footer and created event'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rebase origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows installer as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-Setup
          path: |
            Clinic-Cases-Windows-Setup.exe
            Clinic-Cases-Windows-Setup.exe.sha256
          retention-days: 30
