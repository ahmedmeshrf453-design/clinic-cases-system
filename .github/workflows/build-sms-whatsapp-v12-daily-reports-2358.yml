      - name: Verify daily reports and table
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionName = "2.0.0"' app/build.gradle.kts
          grep -q 'حجز الحالات' app/src/main/res/values/strings.xml
          grep -q 'reportsButton' app/src/main/res/layout/activity_main.xml
          grep -q 'تقرير تلقائي يوميًا الساعة 11:58 مساءً' app/src/main/res/layout/activity_main.xml
          grep -q 'اسم الحالة' app/src/main/res/layout/activity_reports.xml
          grep -q 'التطبيق' app/src/main/res/layout/activity_reports.xml
          grep -q 'رقم التليفون' app/src/main/res/layout/activity_reports.xml
          grep -q 'reportDaySpinner' app/src/main/res/layout/activity_reports.xml
          grep -q 'إجمالي الحالات' app/src/main/res/layout/activity_reports.xml
          grep -q 'Calendar.HOUR_OF_DAY, 23' app/src/main/java/com/alakad/smsforwarder/DailyReportScheduler.kt
          grep -q 'Calendar.MINUTE, 58' app/src/main/java/com/alakad/smsforwarder/DailyReportScheduler.kt
