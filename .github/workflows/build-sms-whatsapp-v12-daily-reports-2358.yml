      - name: Verify real booking examples
        shell: bash
        run: |
          python3 - <<'PY2'
          import datetime, re
          trans = str.maketrans('٠١٢٣٤٥٦٧٨٩۰۱۲۳۴۵۶۷۸۹','01234567890123456789')
          samples = [
              'إكشف: لديك حجز جديد: آمنة حسن خيري - 01151402515 - الميعاد: غدا 30/9 من: 8:00 مساءً - الى:11:00 مساءً, عيادة رقم:57642, فيصل',
              'حجز جديد: ياسين محمد عو الدين - ٠١٥٠٨٥٨٨٠٩٦ - السبت ١٠/٣ - ٨:٠٠ م - فيصل - دكتور محمد غازي',
              'حجزجديد على عيادة عيادات العقاد التخصصية, 2026-10-01 من الساعه 08:30 م - 10:00 م, سلوي احمد, 01110665500',
          ]
          x=[s.translate(trans) for s in samples]
          phone_re=re.compile(r'(?<!\d)(01[0125]\d{8})(?!\d)')
          assert phone_re.search(x[0]).group(1)=='01151402515'
          assert phone_re.search(x[1]).group(1)=='01508588096'
          assert phone_re.search(x[2]).group(1)=='01110665500'
          assert re.search(r'(?:لديك\s*)?حجز\s*جديد\s*:\s*([^\n,\-]{2,80})\s*-',x[0]).group(1).strip()=='آمنة حسن خيري'
          assert re.search(r'(?:لديك\s*)?حجز\s*جديد\s*:\s*([^\n,\-]{2,80})\s*-',x[1]).group(1).strip()=='ياسين محمد عو الدين'
          assert re.search(r',\s*([^,\n]{2,80})\s*,\s*01110665500',x[2]).group(1).strip()=='سلوي احمد'
          assert re.search(r'(20\d{2})-(\d{1,2})-(\d{1,2})',x[2]).groups()==('2026','10','01')
          a,b=map(int,re.search(r'(\d{1,2})\s*/\s*(\d{1,2})',x[1]).groups())
          candidates=[]
          for month,day in [(b,a),(a,b)]:
              try:candidates.append(datetime.date(2026,month,day))
              except ValueError:pass
          assert datetime.date(2026,10,3) in candidates and datetime.date(2026,10,3).strftime('%A')=='Saturday'
          print('Booking/date/name/phone examples OK')
          PY2

      - name: Build installable APK
        shell: bash
