        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.0-Daily-Reports-2358.apk"
          sha256sum "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.0-Daily-Reports-2358.apk" > "$GITHUB_WORKSPACE/Hagz-AlHalat-v2.0-Daily-Reports-2358.sha256"

