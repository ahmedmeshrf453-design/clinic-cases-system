name: Clinic Cases V7.1.34 Smart Multi Lab Search
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add intelligent lab multi-select
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,json
          p=Path('src/main.ts');s=p.read_text(encoding='utf-8')
          a=s.index('async function renderLabPrices()');b=s.index('\nfunction openForgotLab2LabPinModal()',a)
          r=s[a:b]
          old='<textarea id="labInquiryInput" rows="2" placeholder="مثال: CBC، TSH، كبد أو Kidney, Liver"></textarea>'
          new='''<div class="lab-inquiry-composer"><div id="labInquiryChips" class="lab-inquiry-chips" aria-label="التحاليل المختارة"></div>
                  <textarea id="labInquiryInput" rows="2" placeholder="اكتب اسم تحليل بالعربي أو الإنجليزي، أو اختر من القائمة بالأسهم و Enter..."></textarea></div>
                  <small class="lab-inquiry-key-hint">↑ ↓ للتنقل • Enter للاختيار • Shift+Enter لسطر جديد • الفاصلة أو النقطة للفصل</small>'''
          assert r.count(old)==1,'textarea not found'
          r=r.replace(old,new)
          needle="  const inquiryResults=document.querySelector<HTMLDivElement>('#labInquiryResults')!;"
          assert r.count(needle)==1
          r=r.replace(needle,needle+'''
            const inquiryChips=document.querySelector<HTMLDivElement>('#labInquiryChips')!;
            let inquiryActiveIndex=-1;
            const inquiryMatches=()=>labInquirySearch(inquiryInput.value);
            const inquiryAdd=(id:number)=>{
              if(!LAB_TESTS.some(t=>t.id===id))return;
              selectedInquiryIds.add(id);
              inquiryInput.value='';
              inquiryActiveIndex=-1;
              renderInquiry();
              inquiryInput.focus();
            };
            const inquiryConsumeTokens=()=>{
              const value=inquiryInput.value;
              const segments=value.split(/[,،;؛.\\n]+/);
              if(segments.length<2)return;
              const completed=segments.slice(0,-1);
              for(const term of completed){
                const word=term.trim();if(!word)continue;
                const exact=LAB_TESTS.find(t=>[t.name,t.arabic,t.market].some(n=>normalizeLabSearch(n)===normalizeLabSearch(word)));
                if(exact)selectedInquiryIds.add(exact.id);
              }
              inquiryInput.value=segments[segments.length-1].trimStart();
              inquiryActiveIndex=-1;
            };
          ''',1)
          # use actual regex \n in TypeScript, raw Python code representation
          r=r.replace('const segments=value.split(/[,،;؛.\\\\n]+/);','const segments=value.split(/[,،;؛.\\n]+/);')
          needle="    inquirySummary.textContent=selected.length?"
          assert needle in r
          r=r.replace(needle,'''    inquiryChips.innerHTML=selected.map(t=>`<span class="lab-inquiry-chip"><span>${esc(t.name)}</span><button type="button" data-remove-inquiry="${t.id}" aria-label="حذف ${esc(t.name)}">×</button></span>`).join('');
              inquiryChips.querySelectorAll<HTMLButtonElement>('[data-remove-inquiry]').forEach(btn=>{
                btn.onclick=()=>{selectedInquiryIds.delete(Number(btn.dataset.removeInquiry));renderInquiry()};
              });
          '''+needle,1)
          needle="    inquiryResults.querySelectorAll<HTMLButtonElement>('[data-edit-main-lab-price]').forEach(btn=>{"
          assert needle in r
          r=r.replace(needle,'''    const optionRows=Array.from(inquiryResults.querySelectorAll<HTMLElement>('.lab-inquiry-row'));
              optionRows.forEach((row,i)=>row.classList.toggle('lab-inquiry-key-active',i===inquiryActiveIndex));
          '''+needle,1)
          needle="  inquiryInput.oninput=renderInquiry;"
          assert r.count(needle)==1
          r=r.replace(needle,'''  inquiryInput.oninput=()=>{inquiryConsumeTokens();inquiryActiveIndex=-1;renderInquiry()};
            inquiryInput.onkeydown=(event)=>{
              if(event.key==='ArrowDown'||event.key==='ArrowUp'){
                event.preventDefault();
                const matches=inquiryMatches();if(!matches.length)return;
                inquiryActiveIndex=event.key==='ArrowDown'?(inquiryActiveIndex+1)%matches.length:(inquiryActiveIndex-1+matches.length)%matches.length;
                renderInquiry();
                inquiryResults.querySelectorAll<HTMLElement>('.lab-inquiry-row')[inquiryActiveIndex]?.scrollIntoView({block:'nearest'});
              }else if(event.key==='Enter'&&!event.shiftKey){
                const matches=inquiryMatches();
                if(matches.length){event.preventDefault();inquiryAdd(matches[inquiryActiveIndex>=0?inquiryActiveIndex:0].id)}
              }
            };''',1)
          r=r.replace("el.checked)selectedInquiryIds.add(id);else selectedInquiryIds.delete(id);renderInquiry()","el.checked)selectedInquiryIds.add(id);else selectedInquiryIds.delete(id);renderInquiry()")
          # Set rendered chip updated always, duplicate protection Set.
          s=s[:a]+r+s[b:]
          p.write_text(s,encoding='utf-8')
          css=Path('src/style.css');c=css.read_text(encoding='utf-8');c+='''
          /* V7.1.34 smart multi-test lab search; scoped to lab inquiry only */
          .lab-inquiry-panel .lab-inquiry-composer{border:1px solid #ccdfeb;border-radius:10px;padding:8px;min-height:76px}
          .lab-inquiry-panel .lab-inquiry-composer textarea{border:0!important;box-shadow:none!important;outline:none!important;min-height:44px!important;padding:5px!important}
          .lab-inquiry-panel .lab-inquiry-chips{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:7px 0 10px;min-height:4px}
          .lab-inquiry-panel .lab-inquiry-chip{display:inline-flex;align-items:center;gap:8px;background:#e8f6fc;color:#095375;border:1px solid #c9e7f3;padding:5px 8px;border-radius:9px;font-size:12px;font-weight:700;max-width:100%}
          .lab-inquiry-panel .lab-inquiry-chip button{border:0;background:transparent;color:#386a83;font-size:19px;line-height:1;cursor:pointer}
          .lab-inquiry-panel .lab-inquiry-key-hint{display:block;color:#748b9d;font-size:11px;margin-top:5px}
          .lab-inquiry-panel .lab-inquiry-results .lab-inquiry-key-active{outline:2px solid #13a4db!important;background:#eefaff!important}
          ''';css.write_text(c,encoding='utf-8')
          for fn in ('package.json','src-tauri/tauri.conf.json'):
           pp=Path(fn);v=json.loads(pp.read_text(encoding='utf-8'));assert v['version']=='7.1.33',v['version'];v['version']='7.1.34';pp.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('package-lock.json');v=p.read_text(encoding='utf-8');v,n=re.subn(r'("version"\s*:\s*")7\.1\.33(")',r'\g<1>7.1.34\2',v,count=2);assert n==2;p.write_text(v,encoding='utf-8')
          p=Path('src-tauri/Cargo.toml');v=p.read_text(encoding='utf-8');v,n=re.subn(r'(?m)^version\s*=\s*"7\.1\.33"\s*$', 'version = "7.1.34"',v,count=1);assert n==1;p.write_text(v,encoding='utf-8')
          p=Path('src-tauri/Cargo.lock');v=p.read_text(encoding='utf-8');v,n=re.subn(r'(name\s*=\s*"clinic-cases-system"\s*\nversion\s*=\s*")7\.1\.33(")',r'\g<1>7.1.34\2',v,count=1);assert n==1;p.write_text(v,encoding='utf-8')
          print('V7.1.34 smart search patch applied')
          
          PY
      - name: Verify lab UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          m=Path('src/main.ts').read_text(encoding='utf-8')
          assert 'id="labInquiryChips"' in m
          assert 'inquiryInput.onkeydown=' in m
          assert 'lab-inquiry-key-active' in m
          assert 'inquiryConsumeTokens' in m
          assert 'id="labInquiryResults"' in m
          print('keyboard, chips, results available')
          
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: TypeScript frontend build
        run: npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Windows installer
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-V7.1.34-Smart-Multi-Lab-Search
          path: src-tauri/target/release/bundle/nsis/*7.1.34*-setup.exe
          if-no-files-found: error
      - name: Commit only after successful build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts src/style.css package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m 'V7.1.34 smart multi-lab search with chips and keyboard selection'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
