name: Clinic Cases V7.1.3 Hologram Organ Icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V7.1.3 hologram icons
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, urllib.parse

          main_p = Path('src/main.ts')
          css_p = Path('src/style.css')
          version_paths = [
              Path('src-tauri/tauri.conf.json'),
              Path('src-tauri/Cargo.toml'),
              Path('src-tauri/Cargo.lock'),
              Path('package.json'),
              Path('package-lock.json'),
          ]

          m = main_p.read_text(encoding='utf-8')
          c = css_p.read_text(encoding='utf-8')

          for p in version_paths:
              s = p.read_text(encoding='utf-8')
              s = s.replace('7.1.2', '7.1.3').replace('7.1.1', '7.1.3').replace('7.1.0', '7.1.3')
              p.write_text(s, encoding='utf-8')

          start = m.index('const HOME_SPECIALTIES=[')
          end = m.index('\nconst HOME_SPECIALTY_ORDER_KEY=', start)
          defs = """const HOME_SPECIALTIES=[
            {key:'urology',label:'مسالك بولية وذكورة',iconClass:'organ-urology',keys:['مسالك','ذكورة']},
            {key:'internal',label:'باطنة وجهاز هضمي',iconClass:'organ-internal',keys:['باطنة','جهاز هضمي']},
            {key:'ortho',label:'عظام ومفاصل',iconClass:'organ-ortho',keys:['عظام','مفاصل']},
            {key:'surgery',label:'جراحة عامة ومناظير',iconClass:'organ-surgery',keys:['جراحة عامة','مناظير']},
            {key:'eye',label:'عيون',iconClass:'organ-eye',keys:['عيون','رمد','ophthalm']},
            {key:'neuro',label:'مخ وأعصاب وعمود فقري',iconClass:'organ-neuro',keys:['مخ','أعصاب','اعصاب','عمود فقري']},
            {key:'obgyn',label:'نساء وتوليد',iconClass:'organ-obgyn',keys:['نساء','توليد','حقن مجهري','تأخر الإنجاب']},
            {key:'ent',label:'أنف وأذن وحنجرة',iconClass:'organ-ent',keys:['أنف','انف','أذن','اذن','حنجرة']},
            {key:'nutrition',label:'تغذية علاجية',iconClass:'organ-nutrition',keys:['تغذية']},
            {key:'vascular',label:'أوعية دموية وقدم سكري',iconClass:'organ-vascular',keys:['أوعية','اوعية','قدم سكري']},
            {key:'audiology',label:'سمع واتزان',iconClass:'organ-audiology',keys:['سمع','اتزان']}
          ] as const;

          const HOME_SERVICES=[
            {key:'labs',screen:'labs' as Screen,label:'التحاليل',iconClass:'organ-labs'},
            {key:'radiology',screen:'radiology' as Screen,label:'الأشعة',iconClass:'organ-radiology'},
            {key:'physio',screen:'physio' as Screen,label:'العلاج الطبيعي',iconClass:'organ-physio'},
            {key:'nursing',screen:'nursing' as Screen,label:'خدمات التمريض',iconClass:'organ-nursing'}
          ] as const;"""
          m = m[:start] + defs + m[end:]

          m = re.sub(r"const HOME_SPECIALTY_ORDER_KEY='[^']+';", "const HOME_SPECIALTY_ORDER_KEY='clinicCases.home.specialties.v713';", m)
          m = re.sub(r"const HOME_SERVICE_ORDER_KEY='[^']+';", "const HOME_SERVICE_ORDER_KEY='clinicCases.home.services.v713';", m)
          m = m.replace('specialty-home specialty-home-v712', 'specialty-home specialty-home-v713')
          m = m.replace('specialty-home specialty-home-v711', 'specialty-home specialty-home-v713')
          patterns = [
              (r'<span class="specialty-card-icon[^>]*>.*?</span>', '<span class="specialty-card-icon hologram-tile ${x.iconClass}"></span>'),
              (r'<span class="clinic-service-icon[^>]*>.*?</span>', '<span class="clinic-service-icon hologram-tile ${x.iconClass}"></span>'),
          ]
          for pat, repl in patterns:
              m = re.sub(pat, repl, m, count=1, flags=re.S)
          m = re.sub(r'V7\.1\.[0-9]+ • [^<]+', 'V7.1.3 • HOLOGRAM ORGAN ICONS', m, count=1)

          def svg_uri(svg: str) -> str:
              return 'data:image/svg+xml,' + urllib.parse.quote(svg, safe='')

          def icon_svg(shape: str) -> str:
              return svg_uri(f"""
          <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'>
            <defs>
              <filter id='glow' x='-60%' y='-60%' width='220%' height='220%'>
                <feGaussianBlur stdDeviation='3.2' result='b'/>
                <feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge>
              </filter>
            </defs>
            <g filter='url(%23glow)' fill='none' stroke='%2387efff' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'>
              {shape}
            </g>
          </svg>""")

          icons = {
              'organ-urology': icon_svg("<path d='M64 20c10 14 20 28 20 42a20 20 0 1 1-40 0c0-14 10-28 20-42Z'/><path d='M64 82v20'/><path d='M54 92h20'/>") ,
              'organ-internal': icon_svg("<path d='M49 26c0 14 4 19 15 23 13 5 21 14 21 28 0 14-10 25-24 25-18 0-33-15-33-37 0-18 8-31 21-39Z'/>") ,
              'organ-ortho': icon_svg("<path d='M33 37a12 12 0 1 1 13-17l36 0a12 12 0 1 1 0 24H46A12 12 0 0 1 33 37Z'/><path d='M95 91a12 12 0 1 1-13 17H46a12 12 0 1 1 0-24h36A12 12 0 0 1 95 91Z'/>") ,
              'organ-surgery': icon_svg("<path d='M64 24v80'/><path d='M24 64h80'/>") ,
              'organ-eye': icon_svg("<path d='M16 64c12-18 29-28 48-28s36 10 48 28c-12 18-29 28-48 28S28 82 16 64Z'/><circle cx='64' cy='64' r='12'/><circle cx='64' cy='64' r='4'/>") ,
              'organ-neuro': icon_svg("<path d='M45 31c5-9 16-15 28-15 18 0 32 13 32 30 7 4 11 11 11 20 0 12-10 22-22 22H42c-12 0-22-10-22-22 0-9 4-16 11-20 1-6 4-11 8-15 3 4 7 7 12 9'/><path d='M64 24v64'/><path d='M44 46c9 1 16 8 18 16'/><path d='M84 46c-9 1-16 8-18 16'/>") ,
              'organ-obgyn': icon_svg("<circle cx='64' cy='44' r='18'/><path d='M64 62v36'/><path d='M46 82h36'/>") ,
              'organ-ent': icon_svg("<path d='M66 22c18 0 31 13 31 31 0 14-6 21-14 27-7 6-10 10-10 17 0 7-5 12-11 12s-11-5-11-12c0-13 8-22 17-29 7-5 11-10 11-17 0-7-5-13-13-13s-13 6-13 13'/><circle cx='58' cy='92' r='4'/>") ,
              'organ-nutrition': icon_svg("<path d='M30 82h68'/><path d='M40 82c3 12 9 18 24 18s21-6 24-18'/><path d='M48 60c0-8 6-14 14-14'/><path d='M68 52c1-8 8-13 16-13'/><path d='M84 62c0-7 5-12 12-12'/>") ,
              'organ-vascular': icon_svg("<path d='M64 20c10 14 20 28 20 42a20 20 0 1 1-40 0c0-14 10-28 20-42Z'/><path d='M44 80c8 4 16 6 20 6s12-2 20-6'/>") ,
              'organ-audiology': icon_svg("<path d='M32 80c10-18 18-26 30-26 14 0 24 10 31 26'/><path d='M44 72c7-10 12-14 18-14 8 0 14 6 18 14'/><circle cx='96' cy='84' r='4'/>") ,
              'organ-labs': icon_svg("<path d='M50 22h28'/><path d='M56 22v20l-14 30a16 16 0 0 0 14 22h16a16 16 0 0 0 14-22L72 42V22'/><path d='M50 66h28'/>") ,
              'organ-radiology': icon_svg("<rect x='28' y='20' width='72' height='88' rx='10'/><circle cx='64' cy='64' r='18'/><path d='M64 46v36'/><path d='M48 64h32'/>") ,
              'organ-physio': icon_svg("<path d='M74 20c9 0 16 7 16 16 0 4-2 8-5 11l-11 11c-6 6-9 13-9 21v10c0 10-8 18-18 18H34'/><path d='M42 98h20'/>") ,
              'organ-nursing': icon_svg("<path d='M64 104 27 67a22 22 0 0 1 31-31l6 6 6-6a22 22 0 0 1 31 31Z'/><path d='M64 48v24'/><path d='M52 60h24'/>") ,
          }

          css = """
          /* ===== V7.1.3 HOLOGRAM ORGAN ICONS ===== */
          .specialty-home-v713 .specialty-grid{grid-template-columns:repeat(4,minmax(235px,1fr));gap:14px}
          .specialty-home-v713 .clinic-services-grid{grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px}
          .specialty-home-v713 .home-sortable-card{position:relative;overflow:hidden;cursor:grab;user-select:none}
          .specialty-home-v713 .home-sortable-card:active{cursor:grabbing}
          .specialty-home-v713 .specialty-card,.specialty-home-v713 .clinic-service-card{
            min-height:126px;border-radius:20px;border:1px solid rgba(83,205,255,.28);
            background:linear-gradient(180deg,rgba(7,24,42,.96) 0%,rgba(8,35,58,.96) 100%);
            box-shadow:0 10px 26px rgba(3,18,34,.35), inset 0 0 0 1px rgba(150,240,255,.08), inset 0 0 28px rgba(78,200,255,.08)
          }
          .specialty-home-v713 .specialty-card{display:grid;grid-template-columns:22px 90px 1fr 18px;gap:13px;align-items:center;padding:15px}
          .specialty-home-v713 .clinic-service-card{display:grid;grid-template-columns:22px 90px 1fr;gap:13px;align-items:center;padding:15px;text-align:right}
          .specialty-home-v713 .specialty-card-drag{color:#6fcfff;font-size:17px;letter-spacing:-3px;align-self:flex-start;padding-top:4px}
          .specialty-home-v713 .hologram-tile{
            width:90px!important;height:90px!important;border-radius:18px!important;display:block!important;padding:0!important;
            background-color:rgba(6,22,38,.92)!important;background-repeat:no-repeat!important;background-position:center center!important;background-size:74% 74%!important;
            border:1px solid rgba(114,229,255,.42)!important;box-shadow:0 0 0 1px rgba(120,225,255,.12) inset, 0 0 14px rgba(66,214,255,.35), inset 0 0 18px rgba(71,205,255,.18)!important;
            position:relative;overflow:hidden
          }
          .specialty-home-v713 .hologram-tile:before{
            content:'';position:absolute;inset:0;background:
            linear-gradient(180deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,0) 24%),
            repeating-linear-gradient(180deg,rgba(127,232,255,.12) 0 2px,rgba(127,232,255,0) 2px 6px),
            radial-gradient(circle at 50% 20%,rgba(120,240,255,.14),transparent 42%);
            pointer-events:none;mix-blend-mode:screen
          }
          .specialty-home-v713 .specialty-card-copy,.specialty-home-v713 .clinic-service-copy{display:grid;gap:5px;text-align:right}
          .specialty-home-v713 .specialty-card-copy strong,.specialty-home-v713 .clinic-service-copy strong{font-size:15px;color:#d9f7ff;line-height:1.45}
          .specialty-home-v713 .specialty-card-copy small,.specialty-home-v713 .clinic-service-copy small{font-size:10px;color:#8fdcf1}
          .specialty-home-v713 .specialty-card-arrow{font-size:18px;color:#79dfff}
          .specialty-home-v713 .is-dragging{opacity:.55;transform:scale(.97)!important}
          .specialty-home-v713 .is-drag-over{outline:3px dashed #53d5ff;outline-offset:-7px;background:rgba(12,46,74,.98)}
          .specialty-home-v713 .home-section-title{display:flex;justify-content:space-between;align-items:end;margin-top:4px}
          .specialty-home-v713 .home-section-title strong{font-size:18px;color:#d7f6ff}
          .specialty-home-v713 .home-section-title small{font-size:10px;color:#8fdcf1}
          .specialty-home-v713 .home-quick-actions button{background:linear-gradient(180deg,#0a2742 0%,#103757 100%);border:1px solid rgba(95,220,255,.25);color:#d7f6ff}
          .specialty-home-v713 .specialty-home-day{background:linear-gradient(180deg,#0a2742 0%,#103757 100%);color:#dff8ff;border:1px solid rgba(95,220,255,.22)}
          @media(max-width:1250px){.specialty-home-v713 .specialty-grid{grid-template-columns:repeat(3,minmax(220px,1fr))}}
          @media(max-width:980px){.specialty-home-v713 .specialty-grid,.specialty-home-v713 .clinic-services-grid{grid-template-columns:repeat(2,minmax(180px,1fr))}}
          """
          for name, uri in icons.items():
              css += f'\n.specialty-home-v713 .{name}{{background-image:url("{uri}")!important;}}'

          if 'V7.1.3 HOLOGRAM ORGAN ICONS' not in c:
              c += '\n' + css

          main_p.write_text(m, encoding='utf-8')
          css_p.write_text(c, encoding='utf-8')
          print('V7.1.3 hologram patch applied')

          PY

      - name: Verify V7.1.3 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          m=Path('src/main.ts').read_text(encoding='utf-8')
          c=Path('src/style.css').read_text(encoding='utf-8')
          t=Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8')
          assert '7.1.3' in t
          assert 'HOLOGRAM ORGAN ICONS' in m
          assert 'specialty-home-v713' in m
          assert 'hologram-tile' in c and 'organ-neuro' in c and 'organ-eye' in c
          print('V7.1.3 source gates passed')

          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        env:
          RUST_BACKTRACE: '1'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify installer
        shell: pwsh
        run: |
          $i=Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Where-Object { $_.Name -match "7\.1\.3" } | Select-Object -First 1
          if(-not $i){throw "V7.1.3 installer missing"}
          if($i.Length -lt 80000000){throw "Installer too small"}

      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V7.1.3-Hologram-Organ-Icons
          path: src-tauri/target/release/bundle/nsis/*7.1.3*-setup.exe
          if-no-files-found: error

      - name: Commit validated V7.1.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "V7.1.3: hologram organ icons"; fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
