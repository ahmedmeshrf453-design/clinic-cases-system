      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Frontend build
        shell: bash
        run: npm run build

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: V6.5 patient file gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          main = Path("src/main.ts").read_text(encoding="utf-8")
          rust = Path("src-tauri/src/lib.rs").read_text(encoding="utf-8")
          css = Path("src/style.css").read_text(encoding="utf-8")
          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          for required in [
              "const CLINIC_ADDRESS =",
              "type PatientFileSnapshot =",
              "async function loadPatientFile(",
              "function patientFileTimelineHtml(",
              "إنشاء ملف المريض",
              "حفظ بالنظام:",
              "تاريخ إنشاء الملف",
              "آخر تحديث",
              "السجل الكامل للمريض",
              "حفظ ملف المريض فقط",
              "حفظ الملف + إضافة كشف / استشارة",
              "PDF الملف الكامل",
              "عيادات العقاد التخصصية",
          ]:
              assert required in main, required

          for required in [
              "/* V6.5 permanent longitudinal patient file */",
              ".patient-file-clinic-banner",
              ".patient-file-timeline",
              ".patient-file-event",
              ".patient-full-record-wrap",
              ".patient-print-footer-address",
          ]:
              assert required in css, required

          assert "LIMIT 50" not in rust[rust.index("fn list_patient_nursing_orders("):rust.index("fn delete_patient(", rust.index("fn list_patient_nursing_orders("))]
          assert "version: '6.5.0'" in main
          assert conf["version"] == "6.5.0"
          assert conf["bundle"]["windows"]["webviewInstallMode"]["type"] == "offlineInstaller"
          print("V6.5 patient file gate passed")
          PY

      - name: Build V6.5 Windows installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Verify self-contained installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup EXE was not generated" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 80000000) { throw "Offline WebView2 installer missing or setup too small" }

      - name: Commit validated V6.5 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/style.css src-tauri/src/lib.rs src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          [ -f package-lock.json ] && git add package-lock.json || true
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "V6.5: permanent longitudinal patient file"
            git push
          fi

      - name: Upload V6.5 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Cases-Windows-V6.5-Permanent-Patient-File
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
