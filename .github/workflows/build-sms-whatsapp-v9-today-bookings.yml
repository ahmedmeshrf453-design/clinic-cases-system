      - name: Verify Today Bookings feature
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.alakad.smsforwarder.business.history"' app/build.gradle.kts
          grep -q 'versionName = "1.8.0"' app/build.gradle.kts
          grep -q 'حجز الحالات' app/src/main/res/values/strings.xml
          grep -q 'todayBookingsButton' app/src/main/res/layout/activity_main.xml
          grep -q 'حجوزات اليوم' app/src/main/res/layout/activity_main.xml
          grep -q 'bookingDateKey' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'normalizeArabicDigits' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          grep -q 'android.permission.READ_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_SMS' app/src/main/AndroidManifest.xml
          grep -q 'com.whatsapp.w4b' app/src/main/java/com/alakad/smsforwarder/MainActivity.kt
          test -s app/stable-release.jks
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s app/src/main/res/drawable/ic_today_booking.xml

      - name: Verify date formats from real booking messages
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          def norm(s):
              trans = str.maketrans("٠١٢٣٤٥٦٧٨٩۰۱۲۳۴۵۶۷۸۹", "01234567890123456789")
              return s.translate(trans)
          examples = [
              "إكشف: لديك حجز جديد: آمنة حسن خيري - 01151402515 - الميعاد: غدا 30/9 من: 8:00 مساءً - الى:11:00 مساءً, عيادة رقم:57642, فيصل",
              "حجز جديد: ياسين محمد عو الدين - ٠١٥٠٨٥٨٨٠٩٦ - السبت ١٠/٣ - ٨:٠٠ م - فيصل - دكتور محمد غازي",
              "حجزجديد على عيادة عيادات العقاد التخصصية, 2026-10-01 من الساعه 08:30 م - 10:00 م, سلوي احمد, 01110665500",
          ]
          t = [norm(x) for x in examples]
          assert re.search(r"(?<!\d)(\d{1,2})\s*/\s*(\d{1,2})", t[0]).groups() == ("30","9")
          assert re.search(r"(?<!\d)(\d{1,2})\s*/\s*(\d{1,2})", t[1]).groups() == ("10","3")
          assert re.search(r"(?<!\d)(20\d{2})\s*[-/]\s*(\d{1,2})\s*[-/]\s*(\d{1,2})", t[2]).groups() == ("2026","10","01")
          print("Date formats OK")
          PY

      - name: Build signed installable APK
        shell: bash
        working-directory: ${{ runner.temp }}/hagzapp
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Hagz-AlHalat-v1.8-Today-Bookings.apk"
          sha256sum "$GITHUB_WORKSPACE/Hagz-AlHalat-v1.8-Today-Bookings.apk" > "$GITHUB_WORKSPACE/Hagz-AlHalat-v1.8-Today-Bookings.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagz-AlHalat-v1.8-Today-Bookings
          path: |
            Hagz-AlHalat-v1.8-Today-Bookings.apk
            Hagz-AlHalat-v1.8-Today-Bookings.sha256
          retention-days: 30
