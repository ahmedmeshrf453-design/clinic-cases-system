name: Clinic Windows Direct EXE Release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify dependencies and tests
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build offline Windows installer
        shell: pwsh
        run: |
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare one direct-download EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -File -Filter '*.exe')
          if ($files.Count -ne 1) { throw "Expected one NSIS installer; found $($files.Count)" }
          Copy-Item -LiteralPath $files[0].FullName -Destination 'Clinic-Cases-Windows-Setup.exe'
          $hash = (Get-FileHash 'Clinic-Cases-Windows-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Clinic-Cases-Windows-Setup.exe" | Set-Content 'Clinic-Cases-Windows-Setup.exe.sha256' -Encoding ascii
          $version = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid app version' }
          $tag = "v$version-windows-$($env:GITHUB_SHA.Substring(0,7))"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "## Windows EXE ready" >> $env:GITHUB_STEP_SUMMARY
          "- Size: $([math]::Round($files[0].Length / 1MB, 2)) MB" >> $env:GITHUB_STEP_SUMMARY
          "- Direct link after release: https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Clinic-Cases-Windows-Setup.exe" >> $env:GITHUB_STEP_SUMMARY
      - name: Publish direct-download EXE to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create "$env:RELEASE_TAG" 'Clinic-Cases-Windows-Setup.exe' 'Clinic-Cases-Windows-Setup.exe.sha256' --target "$env:GITHUB_SHA" --title "Clinic Cases Windows $env:RELEASE_TAG" --notes 'Windows x64 offline NSIS setup. Built from tested source. No patient data included.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "DIRECT EXE: https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/Clinic-Cases-Windows-Setup.exe"
